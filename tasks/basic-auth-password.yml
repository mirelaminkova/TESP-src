---
# Sets tesp_basic_auth_password, the TES password (issue #41). Generated on
# the first run and kept in tesp_basic_auth_password_file (0600, in the
# root-only tesp_secrets_dir); later runs read it back. Before, every run
# made a new one, so a re-run changed settings.toml, the welcome page and the
# tesp-api container, and logged out every client that had the old one.
# Delete the file and re-run the playbook to change the password.
# Same pattern as tasks/pulsar-token.yml (see there for the details).
# Included by playbook.yml, tests/idempotence.yml and
# tests/check-mode/basic-auth-password.yml.

# Letters and digits: it goes into a TOML string, the welcome page and
# clients' configs as is.
- name: Store a new TES password unless one is stored already
  ansible.builtin.copy:
    content: >-
      {{ lookup('ansible.builtin.password',
                '/dev/null chars=ascii_letters,digits length=24') }}
    dest: "{{ tesp_basic_auth_password_file }}"
    force: false
    mode: '0600'
  no_log: true

# Under --check on a host deployed before this file existed, copy writes
# nothing: the play goes on with a stand-in that is never written anywhere.
- name: Find the stored TES password file
  ansible.builtin.stat:
    path: "{{ tesp_basic_auth_password_file }}"
    get_checksum: false
  register: tesp_basic_auth_password_file_stat
  no_log: true

# copy with force: false leaves an existing file's mode alone.
- name: Keep the stored TES password file private
  ansible.builtin.file:
    path: "{{ tesp_basic_auth_password_file }}"
    mode: '0600'
  when: tesp_basic_auth_password_file_stat.stat.exists
  no_log: true

- name: Read the stored TES password
  ansible.builtin.slurp:
    src: "{{ tesp_basic_auth_password_file }}"
  register: tesp_basic_auth_password_stored
  when: tesp_basic_auth_password_file_stat.stat.exists
  no_log: true

- name: Set the TES password
  ansible.builtin.set_fact:
    tesp_basic_auth_password: >-
      {{ (tesp_basic_auth_password_stored.content | b64decode | trim)
         if tesp_basic_auth_password_stored.content is defined
         else ('check-mode-stand-in-password-not-stored' if ansible_check_mode else '') }}
  no_log: true

# An empty or short file would otherwise give the endpoint a weak or empty
# password. Not no_log, so the message shows: it names the file and the
# check, never the password.
# ast-grep-ignore: secret-needs-no-log
- name: Check the stored TES password
  ansible.builtin.assert:
    that:
      - tesp_basic_auth_password | length >= 16
      # It goes into a TOML basic string, and into single-quoted shell and
      # Nextflow snippets on the welcome page, unescaped.
      - tesp_basic_auth_password is not search('["\x27\\\\\s]')
    fail_msg: >-
      {{ tesp_basic_auth_password_file }} holds no usable TES password (at
      least 16 characters, no quotes, backslashes or spaces). Delete it and
      re-run the playbook to generate a new one.
    quiet: true
