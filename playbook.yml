---
# Fails before anything is installed if the component parameters are invalid.
- name: Check component parameters
  # Same hosts workaround as the plays below (SRC needs localhost).
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}"
  gather_facts: false
  tasks:
    # Keeps the secret out of the assert below, which then needs no no_log
    # and can show its message.
    - name: Check whether an S3 secret key is set
      ansible.builtin.set_fact:
        tesp_s3_has_secret_key: "{{ tesp_s3_secret_access_key | length > 0 }}"
      no_log: true

    - name: Validate the S3 parameters (src_s3_*)
      vars:
        # scheme://host[:port][/path], ASCII only (no user:pass@)
        url_re: 'https?://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$'
      ansible.builtin.assert:
        quiet: true
        that:
          - tesp_s3_endpoint_url == '' or tesp_s3_endpoint_url is match(url_re)
          - tesp_s3_addressing_style in ['path', 'virtual', 'auto']
          - tesp_s3_region is match('[A-Za-z0-9_-]+$')
          - (tesp_s3_access_key_id != '') == (tesp_s3_has_secret_key | bool)
          - tesp_s3_presign_expiry_seconds | int in range(1, 604801)
          - tesp_s3_output_presign_expiry_seconds | int in range(1, 604801)
        fail_msg: >-
          Invalid S3 component parameters.
          src_s3_endpoint_url must be empty (AWS S3) or an http:// or
          https:// URL with a host and optional port and path, such as
          https://s3.example.org;
          src_s3_addressing_style must be path, virtual or auto;
          src_s3_region may only contain letters, digits, _ and -;
          src_s3_access_key_id and src_s3_secret_access_key must be set
          together; tesp_s3_presign_expiry_seconds and
          tesp_s3_output_presign_expiry_seconds must be between 1 and 604800.
          See "Using S3" in the README.

    # tesp-api would refuse to start on a negative value; | int in the
    # template would silently turn a non-number into 0 (no limit).
    - name: Validate tesp_max_wait_seconds
      ansible.builtin.assert:
        quiet: true
        that:
          - tesp_max_wait_seconds | string is match('[0-9]+$')
        fail_msg: >-
          tesp_max_wait_seconds must be a whole number of seconds, 0 for no
          limit. See "Long tasks" in the README.

- name: Install pre-requisites (SLURM, DRMAA, time sync)
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}" # workaround because SRC needs localhost, but molecule needs specifc hostvars
  roles:
    - galaxyproject.repos
    - galaxyproject.slurm
  post_tasks:
    - name: Install Dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - slurm-drmaa1
          - chrony
        state: present

    - name: deploy chrony.conf template
      template:
       src: templates/chrony.conf
       dest: /etc/chrony.conf
       owner: root
       group: root
       mode: 0644
       backup: yes

    - name: Restart chronyd
      service:
        name: chronyd
        state: restarted


- name: Install TESP (GA4GH TES API backed by Pulsar)
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}" # workaround because SRC needs localhost, but molecule needs specifc hostvars

  pre_tasks:
    # Copied from mirelaminkova/src-component-galaxy
    - name: Set workspace user facts
      ansible.builtin.include_role:
        name: uusrc.general.fact_regular_users

    - name: Generate password
      set_fact:
        pulsar_token: "{{ lookup('community.general.random_string', base64=True, length=24) }}"

    - name: Generate TESP-API basic auth password
      set_fact:
        tesp_basic_auth_password: "{{ lookup('community.general.random_string', base64=True, length=24) }}"

    - name: Install Dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - build-essential
          - git
          - libcurl4-openssl-dev
          - libssl-dev
          - python3-virtualenv
          - python3-dev
          - acl
          - gnutls-bin # workaround for git-clone issue, https://stackoverflow.com/a/53147659/4326632
          - iptables
        state: present

    # ---- Pulsar firewall ----
    # Pulsar listens on pulsar_host (0.0.0.0) so the pulsar-proxy container can
    # reach it; this keeps everyone else out. Set up before the Pulsar role
    # starts Pulsar, and re-applied at boot by a systemd unit.
    - name: Install Pulsar firewall script
      ansible.builtin.template:
        src: templates/pulsar-firewall.sh.j2
        dest: /usr/local/sbin/tesp-pulsar-firewall
        owner: root
        group: root
        mode: '0755'
      notify: Restart Pulsar firewall

    - name: Install Pulsar firewall systemd unit
      ansible.builtin.template:
        src: templates/pulsar-firewall.service.j2
        dest: /etc/systemd/system/tesp-pulsar-firewall.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart Pulsar firewall

    - name: Enable and start Pulsar firewall
      ansible.builtin.systemd_service:
        name: tesp-pulsar-firewall
        enabled: true
        state: started
        daemon_reload: true

  roles:
    - geerlingguy.docker
    - usegalaxy_eu.apptainer
    - uusrc.general.nginx_reverse_proxy
    # https://github.com/galaxyproject/pulsar/issues/375
    - galaxyproject.pulsar

  post_tasks:
    - name: Create directory /srv/static/
      file:
        path: /srv/static/
        state: directory
        mode: '0755'

    - name: Template out the welcome
      template:
        src: templates/welcome.html
        dest: /srv/static/index.html
        owner: www-data
        group: www-data
        mode: '0640'

    # ---- TESP-API: GA4GH TES front-end for Pulsar ----
    # Lets TES clients submit jobs that are translated into Pulsar jobs and run
    # on this node's SLURM/DRMAA. Deployed as a Docker Compose stack
    # (tesp-api + MongoDB + a token-injecting Pulsar proxy).
    - name: Clone TESP-API repository
      ansible.builtin.git:
        repo: "{{ tesp_api_repo }}"
        dest: "{{ tesp_install_dir }}"
        version: "{{ tesp_api_version }}"
        force: true

    - name: Ensure TESP-API MongoDB data directory exists
      ansible.builtin.file:
        path: "{{ tesp_install_dir }}/docker/mongodb/data"
        state: directory
        mode: '0755'

    - name: Template TESP-API settings.toml
      ansible.builtin.template:
        src: templates/tesp-api/settings.toml.j2
        dest: "{{ tesp_install_dir }}/settings.toml"
        owner: root
        group: root
        mode: '0640'

    - name: Create the TESP-API secrets directory
      ansible.builtin.file:
        path: "{{ tesp_secrets_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    # Holds the S3 secret key. no_log so it is never shown (not even with
    # --diff or -v).
    - name: Template TESP-API secrets (S3 credentials)
      ansible.builtin.template:
        src: templates/tesp-api/secrets.toml.j2
        dest: "{{ tesp_secrets_file }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Template Pulsar token-injection proxy config
      ansible.builtin.template:
        src: templates/tesp-api/pulsar-token-proxy.conf.j2
        dest: "{{ tesp_install_dir }}/pulsar-token-proxy.conf"
        owner: root
        group: root
        mode: '0640'  # holds the Pulsar token

    - name: Template TESP-API deployment compose file
      ansible.builtin.template:
        src: templates/tesp-api/docker-compose.yml.j2
        dest: "{{ tesp_install_dir }}/docker-compose.deploy.yml"
        owner: root
        group: root
        mode: '0644'

    - name: Build and start the TESP-API stack
      community.docker.docker_compose_v2:
        project_src: "{{ tesp_install_dir }}"
        files:
          - docker-compose.deploy.yml
        build: always
        state: present

  handlers:
    - name: Restart Pulsar firewall
      ansible.builtin.systemd_service:
        name: tesp-pulsar-firewall
        state: restarted
        daemon_reload: true
