---
# Fails before anything is installed if the component parameters are invalid.
- name: Check component parameters
  # Same hosts workaround as the plays below (SRC needs localhost).
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}"
  gather_facts: false
  tasks:
    # The service info's createdAt on a first deploy (see "Service info" in
    # the README).
    - name: Record the deploy time
      ansible.builtin.set_fact:
        tesp_deploy_time: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Check component parameters and settings
      ansible.builtin.include_tasks: tasks/check-parameters.yml

- name: Install pre-requisites (SLURM, DRMAA, time sync)
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}" # workaround because SRC needs localhost, but molecule needs specifc hostvars
  roles:
    - galaxyproject.repos
    - galaxyproject.slurm
  post_tasks:
    - name: Install Dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - slurm-drmaa1
          - chrony
        state: present

    - name: Deploy chrony.conf template
      ansible.builtin.template:
        src: templates/chrony.conf
        dest: /etc/chrony.conf
        owner: root
        group: root
        mode: '0644'
        backup: true

    - name: Restart chronyd
      ansible.builtin.service:
        name: chronyd
        state: restarted


- name: Install TESP (GA4GH TES API backed by Pulsar)
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}" # workaround because SRC needs localhost, but molecule needs specifc hostvars

  pre_tasks:
    # Copied from mirelaminkova/src-component-galaxy
    - name: Set workspace user facts
      ansible.builtin.include_role:
        name: uusrc.general.fact_regular_users

    # The rule matches the variable name; the path itself is not secret.
    # ast-grep-ignore: secret-needs-no-log
    - name: Create the TESP-API secrets directory
      ansible.builtin.file:
        path: "{{ tesp_secrets_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    # The same token on every run, so a re-run doesn't leave pulsar-proxy
    # with an old one.
    - name: Get the Pulsar token
      ansible.builtin.include_tasks: tasks/pulsar-token.yml

    # no_log here and on the other tasks that set or read a secret (also in
    # tasks/pulsar-token.yml): -v would print it. Templates that render one
    # have diff: false instead, as --diff is what would print them.
    - name: Generate TESP-API basic auth password
      ansible.builtin.set_fact:
        tesp_basic_auth_password: "{{ lookup('community.general.random_string', base64=True, length=24) }}"
      no_log: true

    - name: Install Dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - build-essential
          - git
          - libcurl4-openssl-dev
          - libssl-dev
          - python3-virtualenv
          - python3-dev
          - acl
          - gnutls-bin # workaround for git-clone issue, https://stackoverflow.com/a/53147659/4326632
          - iptables
        state: present

    # ---- Pulsar firewall ----
    # Pulsar listens on pulsar_host (0.0.0.0) so the pulsar-proxy container can
    # reach it; this keeps everyone else out. Set up before the Pulsar role
    # starts Pulsar, and re-applied at boot by a systemd unit.
    - name: Install Pulsar firewall script
      ansible.builtin.template:
        src: templates/pulsar-firewall.sh.j2
        dest: /usr/local/sbin/tesp-pulsar-firewall
        owner: root
        group: root
        mode: '0755'
      notify: Restart Pulsar firewall

    - name: Install Pulsar firewall systemd unit
      ansible.builtin.template:
        src: templates/pulsar-firewall.service.j2
        dest: /etc/systemd/system/tesp-pulsar-firewall.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart Pulsar firewall

    - name: Enable and start Pulsar firewall
      ansible.builtin.systemd_service:
        name: tesp-pulsar-firewall
        enabled: true
        state: started
        daemon_reload: true

  roles:
    - geerlingguy.docker
    - usegalaxy_eu.apptainer
    - uusrc.general.nginx_reverse_proxy
    # https://github.com/galaxyproject/pulsar/issues/375
    - role: galaxyproject.pulsar
      # --diff would print app.yml, which holds the Pulsar token. Not no_log,
      # which would also hide the role's errors.
      diff: false

  post_tasks:
    # The role's restart (pulsar_restart_handler_name) is a handler: if a run
    # stops after the role wrote a new app.yml but before handlers ran, the
    # next run changes nothing and Pulsar would keep the old token. So also
    # restart Pulsar whenever it doesn't run with the config on disk
    # (templates/pulsar-config-stale.sh.j2).
    - name: Check whether Pulsar runs with its current config
      ansible.builtin.shell: "{{ lookup('ansible.builtin.template', 'pulsar-config-stale.sh.j2') }}"
      args:
        executable: /bin/bash
      register: tesp_pulsar_config_state
      changed_when: false
      # Only reads, so it runs under --check too, where the task below needs
      # its result.
      check_mode: false

    - name: Restart Pulsar if it doesn't run with its current config
      ansible.builtin.systemd_service:
        name: "{{ pulsar_systemd_service_name | default('pulsar') }}.service"
        state: restarted
      # "missing": systemd has no Pulsar unit (not-found), which happens
      # under --check on a fresh host; the role would have failed otherwise.
      # A normal run tries the restart anyway, so the failure shows.
      when: >-
        tesp_pulsar_config_state.stdout == 'stale' or (tesp_pulsar_config_state.stdout == 'missing' and not ansible_check_mode)

    - name: Create directory /srv/static/
      ansible.builtin.file:
        path: /srv/static/
        state: directory
        mode: '0755'

    - name: Template out the welcome
      ansible.builtin.template:
        src: templates/welcome.html
        dest: /srv/static/index.html
        owner: www-data
        group: www-data
        mode: '0640'
      diff: false  # shows the TES password

    # ---- TESP-API: GA4GH TES front-end for Pulsar ----
    # Lets TES clients submit jobs that are translated into Pulsar jobs and run
    # on this node's SLURM/DRMAA. Deployed as a Docker Compose stack
    # (tesp-api + MongoDB + a token-injecting Pulsar proxy).
    - name: Clone TESP-API repository
      ansible.builtin.git:
        repo: "{{ tesp_api_repo }}"
        dest: "{{ tesp_install_dir }}"
        version: "{{ tesp_api_version }}"
        force: true

    - name: Ensure TESP-API MongoDB data directory exists
      ansible.builtin.file:
        path: "{{ tesp_install_dir }}/docker/mongodb/data"
        state: directory
        mode: '0755'

    - name: Template TESP-API settings.toml
      ansible.builtin.template:
        src: templates/tesp-api/settings.toml.j2
        dest: "{{ tesp_install_dir }}/settings.toml"
        owner: root
        group: root
        mode: '0640'
      diff: false  # holds the TES password

    # Holds the S3 secret key. no_log so it is never shown (not even with
    # --diff or -v).
    - name: Template TESP-API secrets (S3 credentials)
      ansible.builtin.template:
        src: templates/tesp-api/secrets.toml.j2
        dest: "{{ tesp_secrets_file }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Template Pulsar token-injection proxy config
      ansible.builtin.template:
        src: templates/tesp-api/pulsar-token-proxy.conf.j2
        dest: "{{ tesp_pulsar_proxy_conf }}"
        owner: root
        group: root
        mode: '0640'  # holds the Pulsar token
      # --diff would print the token; diff: false rather than no_log keeps
      # template errors visible.
      diff: false

    # Earlier versions wrote it into the image build context, so every image
    # built from there holds the token.
    - name: Remove the Pulsar proxy config from the tesp-api build context
      ansible.builtin.file:
        path: "{{ tesp_install_dir }}/pulsar-token-proxy.conf"
        state: absent

    # pulsar-proxy keeps the file it started with: the template replaces the
    # bind-mounted file (new inode) and nginx reads it only at start. The
    # checksum goes into a label on the service, so Compose recreates the
    # container whenever the config differs from the one it runs with, also
    # on a later run if this one stops before the stack is up.
    - name: Checksum the Pulsar proxy config
      ansible.builtin.stat:
        path: "{{ tesp_pulsar_proxy_conf }}"
        get_checksum: true
        checksum_algorithm: sha256
      register: tesp_pulsar_proxy_conf_stat

    - name: Remember the Pulsar proxy config checksum
      ansible.builtin.set_fact:
        # Under --check on a host without it, the file isn't written yet.
        tesp_pulsar_proxy_conf_checksum: >-
          {{ tesp_pulsar_proxy_conf_stat.stat.checksum
             if not ansible_check_mode
             else tesp_pulsar_proxy_conf_stat.stat.checksum | default('check-mode') }}

    # Issue #25. Outside tesp_install_dir, the image build context.
    - name: Create the TES gateway directory
      ansible.builtin.file:
        path: "{{ tesp_gateway_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Template the TES gateway config
      ansible.builtin.template:
        src: templates/tesp-api/gateway.conf.j2
        dest: "{{ tesp_gateway_dir }}/gateway.conf"
        owner: root
        group: root
        mode: '0644'
      register: tesp_gateway_conf

    # Goes into a label of the gateway container, so a changed config
    # recreates it (nginx reads its config only at start).
    - name: Record the TES gateway config checksum
      ansible.builtin.set_fact:
        # No checksum in --check mode when the file would change.
        tesp_gateway_conf_checksum: "{{ tesp_gateway_conf.checksum | default('check-mode') }}"

    # createdAt is the first deploy: keep it from the file a previous deploy
    # wrote.
    - name: Look for the service info of a previous deploy
      ansible.builtin.stat:
        path: "{{ tesp_gateway_dir }}/service-info.json"
      register: tesp_previous_service_info_stat

    - name: Read the service info of a previous deploy
      ansible.builtin.slurp:
        src: "{{ tesp_gateway_dir }}/service-info.json"
      register: tesp_previous_service_info
      when: tesp_previous_service_info_stat.stat.exists

    # A missing file, one that isn't JSON or one without a valid createdAt
    # counts as a first deploy.
    - name: Keep the first deploy time
      block:
        - name: Take createdAt from the previous service info
          ansible.builtin.set_fact:
            tesp_first_deploy_time: >-
              {{ (tesp_previous_service_info.content | b64decode
                  | from_json).createdAt }}
          when: tesp_previous_service_info_stat.stat.exists

        - name: The previous createdAt is valid
          ansible.builtin.assert:
            that: tesp_first_deploy_time is match(tesp_time_re)
            quiet: true
          when: tesp_first_deploy_time is defined
      rescue:
        - name: Use this deploy's time instead
          ansible.builtin.set_fact:
            tesp_first_deploy_time: "{{ tesp_deploy_time }}"

    - name: First deploy
      ansible.builtin.set_fact:
        tesp_first_deploy_time: "{{ tesp_deploy_time }}"
      when: tesp_first_deploy_time is not defined

    # Read by the nginx workers (not root) on every request.
    - name: Template the TES service info
      ansible.builtin.template:
        src: templates/tesp-api/service-info.json.j2
        dest: "{{ tesp_gateway_dir }}/service-info.json"
        owner: root
        group: root
        mode: '0644'

    - name: Template TESP-API deployment compose file
      ansible.builtin.template:
        src: templates/tesp-api/docker-compose.yml.j2
        dest: "{{ tesp_install_dir }}/docker-compose.deploy.yml"
        owner: root
        group: root
        mode: '0644'

    - name: Build and start the TESP-API stack
      community.docker.docker_compose_v2:
        project_src: "{{ tesp_install_dir }}"
        files:
          - docker-compose.deploy.yml
        build: always
        state: present

    # A config nginx rejects would only show as a restarting container.
    - name: Check the TES gateway config
      ansible.builtin.command: docker exec tesp-gateway nginx -t
      changed_when: false

  handlers:
    # Notified by the galaxyproject.pulsar role when its config changes
    # (pulsar_restart_handler_name in group_vars/all.yml).
    - name: Restart Pulsar
      ansible.builtin.systemd_service:
        name: "{{ pulsar_systemd_service_name | default('pulsar') }}.service"
        state: restarted

    - name: Restart Pulsar firewall
      ansible.builtin.systemd_service:
        name: tesp-pulsar-firewall
        state: restarted
        daemon_reload: true
