---
# Fails before anything is installed if the component parameters are invalid.
- name: Check component parameters
  # Same hosts workaround as the plays below (SRC needs localhost).
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}"
  gather_facts: false
  tasks:
    # The service info's createdAt on a first deploy (see "Service info" in
    # the README).
    - name: Record the deploy time
      ansible.builtin.set_fact:
        tesp_deploy_time: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Check component parameters and settings
      ansible.builtin.include_tasks: tasks/check-parameters.yml

    # tesp_task_fence_enabled: false (issue #48), first step. Pulsar and
    # slurmd require the fence's unit while it is enabled, so on a host where
    # the fence can't start (no IPv6, a broken iptables) every later restart
    # of them (the roles' handlers, a stale Pulsar config) would fail before
    # the rest of the off block below runs. Disabling removes those links.
    - name: Unlink the task network fence from Pulsar and slurmd
      when: not (tesp_task_fence_enabled | bool)
      block:
        - name: Look for the task network fence unit (to unlink it)
          ansible.builtin.stat:
            path: /etc/systemd/system/tesp-task-fence.service
          register: tesp_task_fence_unit_early

        - name: Disable the task network fence unit
          ansible.builtin.systemd_service:
            name: tesp-task-fence
            enabled: false
            daemon_reload: true
          when: tesp_task_fence_unit_early.stat.exists

- name: Install pre-requisites (SLURM, DRMAA, time sync)
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}" # workaround because SRC needs localhost, but molecule needs specifc hostvars
  # slurm.conf names it as TaskProlog (group_vars/all.yml). Installed first:
  # slurmd runs a task without it, outside a PID namespace, if it's missing.
  pre_tasks:
    - name: Install the task prolog (PID namespace for tasks)
      ansible.builtin.template:
        src: templates/task-prolog.sh.j2
        dest: "{{ tesp_task_prolog_path }}"
        owner: root
        group: root
        mode: '0755'
  roles:
    - galaxyproject.repos
    - galaxyproject.slurm
  post_tasks:
    # The role restarts slurmctld and slurmd for a changed slurm.conf in
    # handlers, at the end of the play. If a later task here fails, the next
    # run sees slurm.conf unchanged and never restarts them, and tasks keep
    # running without the task prolog. So: restart now, and on every run
    # compare what slurmctld has loaded.
    - name: Restart SLURM for a changed slurm.conf now
      ansible.builtin.meta: flush_handlers

    - name: Read the TaskProlog SLURM has loaded
      ansible.builtin.command: scontrol show config
      register: tesp_slurm_live_config
      # slurmctld may still be starting after the handlers.
      until: tesp_slurm_live_config.rc == 0
      retries: 15
      delay: 2
      changed_when: false
      failed_when: false
      check_mode: false

    # slurmctld and slurmd read slurm.conf only when they start.
    - name: Restart SLURM to load the task prolog
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop:
        - "{{ slurmctld_service_name | default('slurmctld') }}"
        - "{{ slurmd_service_name | default('slurmd') }}"
      when: >-
        not ansible_check_mode
        and tesp_slurm_live_config.stdout is not search('^TaskProlog\\s*=\\s*' ~ (tesp_task_prolog_path | regex_escape) ~ '\\s*$', multiline=True)
      register: tesp_slurm_prolog_restart

    - name: Wait for slurmctld after loading the task prolog
      ansible.builtin.command: scontrol ping
      register: tesp_slurm_prolog_ping
      until: >-
        tesp_slurm_prolog_ping.rc == 0
        and tesp_slurm_prolog_ping.stdout is search(' is UP$', multiline=True)
      retries: 30
      delay: 2
      changed_when: false
      when: tesp_slurm_prolog_restart.results | default([]) | selectattr('changed') | list | length > 0

    - name: Install Dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - slurm-drmaa1
          - chrony
        state: present

    - name: Deploy chrony.conf template
      ansible.builtin.template:
        src: templates/chrony.conf
        dest: /etc/chrony.conf
        owner: root
        group: root
        mode: '0644'
        backup: true

    - name: Restart chronyd
      ansible.builtin.service:
        name: chronyd
        state: restarted

    # Issue #43. galaxyproject.slurm restarts slurmd and slurmctld in
    # handlers; check SLURM after them, not before.
    - name: Run the SLURM handlers now
      ansible.builtin.meta: flush_handlers

    - name: Check that SLURM works
      ansible.builtin.include_tasks: tasks/slurm-health.yml
      # Under --check on a fresh host there is no SLURM yet.
      when: not ansible_check_mode


- name: Install TESP (GA4GH TES API backed by Pulsar)
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}" # workaround because SRC needs localhost, but molecule needs specifc hostvars

  pre_tasks:
    # Copied from mirelaminkova/src-component-galaxy
    - name: Set workspace user facts
      ansible.builtin.include_role:
        name: uusrc.general.fact_regular_users

    # The rule matches the variable name; the path itself is not secret.
    # ast-grep-ignore: secret-needs-no-log
    - name: Create the TESP-API secrets directory
      ansible.builtin.file:
        path: "{{ tesp_secrets_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    # The same token on every run, so a re-run doesn't leave pulsar-proxy
    # with an old one.
    - name: Get the Pulsar token
      ansible.builtin.include_tasks: tasks/pulsar-token.yml

    # no_log here and on the other tasks that set or read a secret (also in
    # tasks/pulsar-token.yml): -v would print it. Templates that render one
    # have diff: false instead, as --diff is what would print them.
    - name: Generate TESP-API basic auth password
      ansible.builtin.set_fact:
        tesp_basic_auth_password: "{{ lookup('community.general.random_string', base64=True, length=24) }}"
      no_log: true

    - name: Install Dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - build-essential
          - git
          - libcurl4-openssl-dev
          - libssl-dev
          - python3-virtualenv
          - python3-dev
          - acl
          - gnutls-bin # workaround for git-clone issue, https://stackoverflow.com/a/53147659/4326632
          - iptables
        state: present

    # ---- Pulsar firewall ----
    # Pulsar listens on pulsar_host (0.0.0.0) so the pulsar-proxy container can
    # reach it; this keeps everyone else out. Set up before the Pulsar role
    # starts Pulsar, and re-applied at boot by a systemd unit.
    - name: Install Pulsar firewall script
      ansible.builtin.template:
        src: templates/pulsar-firewall.sh.j2
        dest: /usr/local/sbin/tesp-pulsar-firewall
        owner: root
        group: root
        mode: '0755'
      notify: Restart Pulsar firewall

    - name: Install Pulsar firewall systemd unit
      ansible.builtin.template:
        src: templates/pulsar-firewall.service.j2
        dest: /etc/systemd/system/tesp-pulsar-firewall.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart Pulsar firewall

    - name: Enable and start Pulsar firewall
      ansible.builtin.systemd_service:
        name: tesp-pulsar-firewall
        enabled: true
        state: started
        daemon_reload: true

    # uwsgi's worker socket (pulsar_uwsgi_options in group_vars/all.yml) lives
    # in Pulsar's runtime directory. Before the role starts Pulsar.
    - name: Create the Pulsar unit's drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/{{ tesp_pulsar_unit }}.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Give Pulsar a runtime directory for its uwsgi socket
      ansible.builtin.template:
        src: templates/pulsar-uwsgi-socket.conf.j2
        dest: /etc/systemd/system/{{ tesp_pulsar_unit }}.d/tesp-uwsgi-socket.conf
        owner: root
        group: root
        mode: '0644'
      # No restart from here: handlers notified in pre_tasks run before the
      # role reloads systemd. The role's systemd task reloads it, and the
      # role's server.ini change (the socket options) restarts Pulsar.

  roles:
    - geerlingguy.docker
    - usegalaxy_eu.apptainer
    - uusrc.general.nginx_reverse_proxy
    # https://github.com/galaxyproject/pulsar/issues/375
    - role: galaxyproject.pulsar
      # --diff would print app.yml, which holds the Pulsar token. Not no_log,
      # which would also hide the role's errors.
      diff: false

  post_tasks:
    # The role's restart (pulsar_restart_handler_name) is a handler: if a run
    # stops after the role wrote a new app.yml but before handlers ran, the
    # next run changes nothing and Pulsar would keep the old token. So also
    # restart Pulsar whenever it doesn't run with the config on disk
    # (templates/pulsar-config-stale.sh.j2).
    - name: Check whether Pulsar runs with its current config
      ansible.builtin.shell: "{{ lookup('ansible.builtin.template', 'pulsar-config-stale.sh.j2') }}"
      args:
        executable: /bin/bash
      register: tesp_pulsar_config_state
      changed_when: false
      # Only reads, so it runs under --check too, where the task below needs
      # its result.
      check_mode: false

    - name: Restart Pulsar if it doesn't run with its current config
      ansible.builtin.systemd_service:
        name: "{{ tesp_pulsar_unit }}"
        state: restarted
      # "missing": systemd has no Pulsar unit (not-found), which happens
      # under --check on a fresh host; the role would have failed otherwise.
      # A normal run tries the restart anyway, so the failure shows.
      when: >-
        tesp_pulsar_config_state.stdout == 'stale' or (tesp_pulsar_config_state.stdout == 'missing' and not ansible_check_mode)

    # ---- Task network fence (issue #45) ----
    # Tasks run as the Pulsar user on the host's network. Applied right after
    # the Pulsar role, which creates that user (the rules match it by name),
    # and before the tesp-api stack starts, so no task runs unfenced. A
    # systemd unit that Pulsar and slurmd require applies it at boot.
    - name: Install the task network fence script
      ansible.builtin.template:
        src: templates/task-fence.sh.j2
        dest: /usr/local/sbin/tesp-task-fence
        owner: root
        group: root
        mode: '0755'

    - name: Put the task network fence in force
      when: tesp_task_fence_enabled | bool
      block:
        - name: Install the task network fence systemd unit
          ansible.builtin.template:
            src: templates/task-fence.service.j2
            dest: /etc/systemd/system/tesp-task-fence.service
            owner: root
            group: root
            mode: '0644'
          register: tesp_task_fence_unit

        # Under --check on a host deployed before the fence, the unit isn't
        # there to enable.
        - name: Enable and start the task network fence
          ansible.builtin.systemd_service:
            name: tesp-task-fence
            enabled: true
            state: started
            daemon_reload: true
          when: not (ansible_check_mode and tesp_task_fence_unit is changed)

        # enabled: true above changes nothing where the unit is already enabled,
        # so links added to [Install] later (RequiredBy=slurmd.service) would
        # never appear. Checked from the links themselves, so that a run that
        # fails later doesn't lose the fix. slurmd's unit name is fixed
        # (galaxyproject.slurm); Pulsar's comes from tesp_pulsar_unit.
        - name: Check that Pulsar and slurmd require the task network fence
          ansible.builtin.shell: |
            for unit in {{ tesp_pulsar_unit | quote }} slurmd.service; do
              [ -L "/etc/systemd/system/$unit.requires/tesp-task-fence.service" ] || echo "$unit"
            done
          register: tesp_task_fence_links
          changed_when: false
          check_mode: false

        # One call: disable-then-enable as two tasks could leave the unit disabled
        # if the run stopped in between. Only the links change; the rules stay.
        - name: Recreate the task network fence's [Install] links
          ansible.builtin.command: systemctl reenable tesp-task-fence.service  # noqa: command-instead-of-module
          changed_when: true
          when: tesp_task_fence_links.stdout | length > 0

        # Also on every run, not only when the unit starts: something may have
        # dropped the rules since (ufw, a full iptables-restore), and a changed
        # script must be in force before tesp-api can submit tasks. The script is
        # idempotent and says "changed" when it had to change the rules.
        - name: Apply the task network fence
          ansible.builtin.command: /usr/local/sbin/tesp-task-fence
          register: tesp_task_fence_run
          changed_when: "'changed' in tesp_task_fence_run.stdout_lines"

    # tesp_task_fence_enabled: false (issue #48). Pulsar's unix socket and
    # the docker group change stay: they don't depend on the fence.
    - name: Take the task network fence off
      when: not (tesp_task_fence_enabled | bool)
      block:
        - name: Look for the task network fence unit
          ansible.builtin.stat:
            path: /etc/systemd/system/tesp-task-fence.service
          register: tesp_task_fence_unit_file

        # Disabled in the first play, which removed the RequiredBy links. A
        # dependency added another way (a drop-in with Requires=, BindsTo=)
        # would make the stop below stop Pulsar or slurmd too.
        - name: Check that nothing still requires the task network fence
          # The systemd module can't read reverse dependencies.
          ansible.builtin.command: systemctl show -p RequiredBy,BoundBy,PartOf,ConsistsOf --value tesp-task-fence  # noqa: command-instead-of-module
          register: tesp_task_fence_dependents
          changed_when: false
          check_mode: false
          failed_when: >-
            tesp_task_fence_dependents.rc != 0
            or tesp_task_fence_dependents.stdout_lines | select | list | length > 0
          when: tesp_task_fence_unit_file.stat.exists

        - name: Stop the task network fence unit
          ansible.builtin.systemd_service:
            name: tesp-task-fence
            state: stopped
          when: tesp_task_fence_unit_file.stat.exists

        - name: Remove the task network fence unit
          ansible.builtin.file:
            path: /etc/systemd/system/tesp-task-fence.service
            state: absent

        - name: Reload systemd without the task network fence unit
          ansible.builtin.systemd_service:
            daemon_reload: true
          when: tesp_task_fence_unit_file.stat.exists

        # Last, so a run that stops part-way leaves the rules in force. The
        # script stays installed (above), for --remove and to turn it on by
        # hand.
        - name: Remove the task network fence rules
          ansible.builtin.command: /usr/local/sbin/tesp-task-fence --remove
          register: tesp_task_fence_removed
          changed_when: "'changed' in tesp_task_fence_removed.stdout_lines"

    # docker_users (group_vars/all.yml) no longer adds the Pulsar user to the
    # docker group, but it stays in on hosts deployed before. New SLURM jobs
    # get the user's groups when they start; Pulsar at its restart.
    - name: Take the Pulsar user out of the docker group
      ansible.builtin.command: gpasswd -d {{ pulsar_user.name }} docker
      register: tesp_pulsar_docker_group
      # 3: not a member, or no docker group (geerlingguy.docker creates it)
      changed_when: tesp_pulsar_docker_group.rc == 0
      failed_when: tesp_pulsar_docker_group.rc not in [0, 3]
      when: tesp_container_type != 'docker'

    # From the running process rather than a handler: a run that fails after
    # gpasswd would leave Pulsar with the group, and the next one would see
    # nothing left to change.
    - name: Check whether Pulsar still runs with the docker group
      ansible.builtin.shell: |
        set -o pipefail
        pid=$(systemctl show -p MainPID --value {{ tesp_pulsar_unit | quote }})
        gid=$(getent group docker | cut -d: -f3)
        if [ -n "$gid" ] && [ "${pid:-0}" != 0 ] \
            && grep '^Groups:' "/proc/$pid/status" | tr -s ' \t' '\n' | grep -qx "$gid"; then
          echo docker
        fi
      args:
        executable: /bin/bash
      register: tesp_pulsar_groups
      changed_when: false
      check_mode: false
      when: tesp_container_type != 'docker'

    # slurmctld caches each user's groups for new jobs (about 10 minutes on
    # SLURM 21.08, measured on the test bed), so new tasks would keep the
    # docker gid that long. Only a restart of slurmctld empties that cache
    # (scontrol reconfigure and a slurmd restart don't); it keeps its saved
    # state, so queued and running jobs carry on, and running jobs keep their
    # groups until they end. Also when Pulsar still has the group: then an
    # earlier run stopped before getting this far. (If Pulsar was restarted in
    # between, nothing shows it; the cache then clears itself within about 10
    # minutes.) Not under --check, where gpasswd doesn't run.
    - name: Decide whether SLURM must forget the Pulsar user's old groups
      ansible.builtin.set_fact:
        tesp_refresh_slurm_groups: >-
          {{ tesp_container_type != 'docker' and not ansible_check_mode
             and (tesp_pulsar_docker_group is changed
                  or tesp_pulsar_groups.stdout | default('') == 'docker') }}

    - name: Make SLURM forget the Pulsar user's old groups
      ansible.builtin.systemd_service:
        name: "{{ slurmctld_service_name | default('slurmctld') }}"
        state: restarted
      when: tesp_refresh_slurm_groups | bool

    # Pulsar's submissions fail while slurmctld is down.
    - name: Wait for slurmctld after the restart
      ansible.builtin.command: scontrol ping
      register: tesp_slurmctld_ping
      until: >-
        tesp_slurmctld_ping.rc == 0
        and tesp_slurmctld_ping.stdout is search(' is UP$', multiline=True)
      retries: 30
      delay: 2
      changed_when: false
      when: tesp_refresh_slurm_groups | bool

    - name: Restart Pulsar without the docker group
      ansible.builtin.systemd_service:
        name: "{{ tesp_pulsar_unit }}"
        state: restarted
      when:
        - tesp_container_type != 'docker'
        - tesp_pulsar_groups.stdout == 'docker'

    # Issue #43, again with a test job now that the Pulsar user, its groups
    # and the task network fence are in place: what Pulsar's submissions go
    # through. Before the tesp-api stack starts taking tasks.
    - name: Check that the Pulsar user can run SLURM jobs
      ansible.builtin.include_tasks: tasks/slurm-health.yml
      vars:
        tesp_slurm_health_job_user: "{{ pulsar_user.name }}"
      when: not ansible_check_mode

    - name: Create directory /srv/static/
      ansible.builtin.file:
        path: /srv/static/
        state: directory
        mode: '0755'

    - name: Template out the welcome
      ansible.builtin.template:
        src: templates/welcome.html
        dest: /srv/static/index.html
        owner: www-data
        group: www-data
        mode: '0640'
      diff: false  # shows the TES password

    # ---- TESP-API: GA4GH TES front-end for Pulsar ----
    # Lets TES clients submit jobs that are translated into Pulsar jobs and run
    # on this node's SLURM/DRMAA. Deployed as a Docker Compose stack
    # (tesp-api + MongoDB + a token-injecting Pulsar proxy).
    - name: Clone TESP-API repository
      ansible.builtin.git:
        repo: "{{ tesp_api_repo }}"
        dest: "{{ tesp_install_dir }}"
        version: "{{ tesp_api_version }}"
        force: true

    - name: Ensure TESP-API MongoDB data directory exists
      ansible.builtin.file:
        path: "{{ tesp_install_dir }}/docker/mongodb/data"
        state: directory
        mode: '0755'

    # Issue #10: settings.toml and the S3 keys, outside the image build
    # context; a change recreates tesp-api (see the task file).
    - name: Template the generated TESP-API config
      ansible.builtin.include_tasks: tasks/tesp-api-config.yml

    - name: Template Pulsar token-injection proxy config
      ansible.builtin.template:
        src: templates/tesp-api/pulsar-token-proxy.conf.j2
        dest: "{{ tesp_pulsar_proxy_conf }}"
        owner: root
        group: root
        mode: '0640'  # holds the Pulsar token
      # --diff would print the token; diff: false rather than no_log keeps
      # template errors visible.
      diff: false

    # Earlier versions wrote it into the image build context, so every image
    # built from there holds the token.
    - name: Remove the Pulsar proxy config from the tesp-api build context
      ansible.builtin.file:
        path: "{{ tesp_install_dir }}/pulsar-token-proxy.conf"
        state: absent

    # pulsar-proxy keeps the file it started with: the template replaces the
    # bind-mounted file (new inode) and nginx reads it only at start. The
    # checksum goes into a label on the service, so Compose recreates the
    # container whenever the config differs from the one it runs with, also
    # on a later run if this one stops before the stack is up.
    - name: Checksum the Pulsar proxy config
      ansible.builtin.stat:
        path: "{{ tesp_pulsar_proxy_conf }}"
        get_checksum: true
        checksum_algorithm: sha256
      register: tesp_pulsar_proxy_conf_stat

    - name: Remember the Pulsar proxy config checksum
      ansible.builtin.set_fact:
        # Under --check on a host without it, the file isn't written yet.
        tesp_pulsar_proxy_conf_checksum: >-
          {{ tesp_pulsar_proxy_conf_stat.stat.checksum
             if not ansible_check_mode
             else tesp_pulsar_proxy_conf_stat.stat.checksum | default('check-mode') }}

    # Issue #25. Outside tesp_install_dir, the image build context.
    - name: Create the TES gateway directory
      ansible.builtin.file:
        path: "{{ tesp_gateway_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    # Root-only: with OAuth on it holds tesp-api's Basic credentials. Read by
    # the nginx master process, which runs as root. nginx -t checks the new
    # file before it replaces the old one (validate), so a config nginx
    # rejects never reaches the gateway; only when the content changes.
    - name: Template the TES gateway config
      block:
        - name: Template the TES gateway config
          ansible.builtin.template:
            src: templates/tesp-api/gateway.conf.j2
            dest: "{{ tesp_gateway_dir }}/gateway.conf"
            owner: root
            group: root
            mode: '0600'
            validate: >-
              docker run --rm --entrypoint nginx
              -v %s:/etc/nginx/conf.d/gateway.conf:ro {{ tesp_nginx_image }} -t
          register: tesp_gateway_conf
          no_log: true
      rescue:
        # no_log above hides nginx's reason; nginx -t names file and line,
        # not their content.
        - name: Keep the rejected gateway config for inspection
          ansible.builtin.template:
            src: templates/tesp-api/gateway.conf.j2
            dest: "{{ tesp_gateway_dir }}/gateway.conf.rejected"
            owner: root
            group: root
            mode: '0600'
          no_log: true

        - name: Show why nginx rejects the gateway config
          ansible.builtin.command: >-
            docker run --rm --entrypoint nginx
            -v {{ tesp_gateway_dir }}/gateway.conf.rejected:/etc/nginx/conf.d/gateway.conf:ro
            {{ tesp_nginx_image }} -t
          register: tesp_gateway_conf_check
          changed_when: false
          failed_when: false

        - name: Stop on the rejected gateway config
          ansible.builtin.fail:
            msg: >-
              nginx rejects the new gateway config, kept as
              {{ tesp_gateway_dir }}/gateway.conf.rejected; the running
              gateway keeps the old one. nginx -t says:
              {{ tesp_gateway_conf_check.stderr | default('') }}

    # Goes into a label of the gateway container, so a changed config
    # recreates it (nginx reads its config only at start).
    - name: Record the TES gateway config checksum
      ansible.builtin.set_fact:
        # No checksum in --check mode when the file would change.
        tesp_gateway_conf_checksum: "{{ tesp_gateway_conf.checksum | default('check-mode') }}"

    # createdAt is the first deploy: keep it from the file a previous deploy
    # wrote.
    - name: Look for the service info of a previous deploy
      ansible.builtin.stat:
        path: "{{ tesp_gateway_dir }}/service-info.json"
      register: tesp_previous_service_info_stat

    - name: Read the service info of a previous deploy
      ansible.builtin.slurp:
        src: "{{ tesp_gateway_dir }}/service-info.json"
      register: tesp_previous_service_info
      when: tesp_previous_service_info_stat.stat.exists

    # A missing file, one that isn't JSON or one without a valid createdAt
    # counts as a first deploy.
    - name: Keep the first deploy time
      block:
        - name: Take createdAt from the previous service info
          ansible.builtin.set_fact:
            tesp_first_deploy_time: >-
              {{ (tesp_previous_service_info.content | b64decode
                  | from_json).createdAt }}
          when: tesp_previous_service_info_stat.stat.exists

        - name: The previous createdAt is valid
          ansible.builtin.assert:
            that: tesp_first_deploy_time is match(tesp_time_re)
            quiet: true
          when: tesp_first_deploy_time is defined
      rescue:
        - name: Use this deploy's time instead
          ansible.builtin.set_fact:
            tesp_first_deploy_time: "{{ tesp_deploy_time }}"

    - name: First deploy
      ansible.builtin.set_fact:
        tesp_first_deploy_time: "{{ tesp_deploy_time }}"
      when: tesp_first_deploy_time is not defined

    # Read by the nginx workers (not root) on every request.
    - name: Template the TES service info
      ansible.builtin.template:
        src: templates/tesp-api/service-info.json.j2
        dest: "{{ tesp_gateway_dir }}/service-info.json"
        owner: root
        group: root
        mode: '0644'

    # ---- Token validator (issue #26), only with tesp_oauth_enabled ----
    - name: Install the token validator
      when: tesp_oauth_enabled | bool
      block:
        - name: Create the validator directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop:
            - "{{ tesp_validator_dir }}"
            - "{{ tesp_gateway_dir }}/validator"

        # The image build context: only these files.
        - name: Copy the validator sources
          ansible.builtin.copy:
            src: "files/tes-validator/{{ item }}"
            dest: "{{ tesp_validator_dir }}/{{ item }}"
            owner: root
            group: root
            mode: '0644'
          loop:
            - Dockerfile
            - requirements.txt
            - tes_validator.py

        - name: Check the validator's CA bundle
          ansible.builtin.stat:
            path: "{{ tesp_oauth_ca_bundle }}"
          register: tesp_oauth_ca_bundle_stat
          when: tesp_oauth_ca_bundle | length > 0

        # Docker would create a missing path as an empty directory, and every
        # token would be refused.
        - name: The CA bundle is a file
          ansible.builtin.assert:
            that: tesp_oauth_ca_bundle_stat.stat.isreg | default(false)
            fail_msg: tesp_oauth_ca_bundle {{ tesp_oauth_ca_bundle }} is not a file.
            quiet: true
          when: tesp_oauth_ca_bundle | length > 0

        # No secrets in it; the validator (nobody) reads it.
        - name: Template the validator config
          ansible.builtin.template:
            src: templates/tesp-api/validator.json.j2
            dest: "{{ tesp_gateway_dir }}/validator/config.json"
            owner: root
            group: root
            mode: '0644'
          register: tesp_validator_conf

        - name: Record the validator config checksum
          ansible.builtin.set_fact:
            tesp_validator_conf_checksum: "{{ tesp_validator_conf.checksum | default('check-mode') }}"

    - name: Template TESP-API deployment compose file
      ansible.builtin.template:
        src: templates/tesp-api/docker-compose.yml.j2
        dest: "{{ tesp_install_dir }}/docker-compose.deploy.yml"
        owner: root
        group: root
        mode: '0644'

    # Issue #44: the stack's network has a fixed subnet (tesp_stack_subnet).
    # It must not collide with another Docker network or a route of the
    # workspace; the stack's own network, from an earlier deploy, doesn't
    # count. Read-only, so in check mode too.
    - name: Check that the stack's subnet is free
      ansible.builtin.script:
        cmd: >-
          files/check_stack_subnet.py {{ tesp_stack_subnet | quote }}
          {{ tesp_compose_project | quote }}
        executable: python3
      register: tesp_stack_subnet_check
      changed_when: false
      check_mode: false

    # An earlier version let Docker pick the subnets, and Compose doesn't
    # always recreate a network whose addresses changed. Taking the stack
    # down removes its containers and networks; MongoDB's data is a bind
    # mount and stays, and the next task starts everything again.
    - name: Take the stack down to recreate its networks on the pinned subnets
      community.docker.docker_compose_v2:
        project_src: "{{ tesp_install_dir }}"
        project_name: "{{ tesp_compose_project }}"
        files:
          - docker-compose.deploy.yml
        state: absent
      vars:
        # The last line: anything a pty mixes in comes before it.
        old: "{{ (tesp_stack_subnet_check.stdout_lines | last | from_json).own_subnets }}"
        pinned: {default: "{{ tesp_stack_default_subnet }}", auth: "{{ tesp_stack_auth_subnet }}"}
      # auth only with tokens on: with them off, Compose no longer manages a
      # leftover auth network, and it does no harm.
      when: >-
        old.get('default') not in [none, pinned.default]
        or (tesp_oauth_enabled | bool and old.get('auth') not in [none, pinned.auth])

    - name: Build and start the TESP-API stack
      community.docker.docker_compose_v2:
        project_src: "{{ tesp_install_dir }}"
        project_name: "{{ tesp_compose_project }}"
        files:
          - docker-compose.deploy.yml
        build: always
        state: present
        # Until every container runs and the validator is healthy.
        wait: true
        wait_timeout: 300
        # Drops the validator when tokens are switched off.
        remove_orphans: true

    # The gateway trusts X-Real-IP only from the networks' bridge addresses;
    # on any other address every client would look like one (one rate-limit
    # bucket, no Basic source matching).
    - name: Read the stack networks' addresses
      ansible.builtin.command:
        argv: [docker, network, inspect, "{{ tesp_compose_project }}_{{ item }}"]
      register: tesp_stack_networks
      changed_when: false
      loop: "{{ ['default', 'auth'] if tesp_oauth_enabled | bool else ['default'] }}"
      when: not ansible_check_mode

    - name: The stack's networks have the pinned subnets and gateways
      ansible.builtin.assert:
        that:
          - ipam | length == 1
          - ipam[0].Subnet | default('') == pinned[item.item].subnet
          - ipam[0].Gateway | default('') == pinned[item.item].gateway
        fail_msg: >-
          The network {{ tesp_compose_project }}_{{ item.item }} has
          {{ ipam }}, not {{ pinned[item.item] }}. Run `docker compose -f
          docker-compose.deploy.yml down` in {{ tesp_install_dir }} and
          deploy again.
        quiet: true
      vars:
        ipam: "{{ (item.stdout | from_json)[0].IPAM.Config }}"
        pinned:
          default: {subnet: "{{ tesp_stack_default_subnet }}", gateway: "{{ tesp_stack_gateway }}"}
          auth: {subnet: "{{ tesp_stack_auth_subnet }}", gateway: "{{ tesp_stack_auth_gateway }}"}
      loop: "{{ tesp_stack_networks.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not ansible_check_mode

  handlers:
    # Notified by the galaxyproject.pulsar role when its config changes
    # (pulsar_restart_handler_name in group_vars/all.yml).
    - name: Restart Pulsar
      ansible.builtin.systemd_service:
        name: "{{ tesp_pulsar_unit }}"
        state: restarted

    - name: Restart Pulsar firewall
      ansible.builtin.systemd_service:
        name: tesp-pulsar-firewall
        state: restarted
        daemon_reload: true
