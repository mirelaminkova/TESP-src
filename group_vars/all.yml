# NGINX
nginx_reverse_proxy_locations:
- name: about
  location: '=/'
  auth: sram
  root: /srv/static/
  try_files: $uri/index.html =404
- name: tes
  location: /tes/
  proxy_pass: "http://127.0.0.1:8080/"
  auth: noauth
# Pulsar is not published through nginx: only tesp-api talks to it, via the
# token-injecting pulsar-proxy sidecar (templates/tesp-api/).

# SLURM
# One node, both controller and worker. CPUs and RealMemory must be set:
# without them the node counts as 1 CPU and 1 MB and rejects any task asking
# for more. See "Resource limits" in the README.
slurm_roles: ['controller', 'exec']
slurm_nodes:
- name: localhost
  CPUs: "{{ tesp_slurm_cpus }}"
  RealMemory: "{{ tesp_slurm_real_memory_mb }}"
slurm_config:
  SelectType: select/cons_tres
  # CPU, not Core: --cpus-per-task counts logical CPUs, the same as CPUs above.
  SelectTypeParameters: CR_CPU_Memory
  # Memory for jobs without --mem (tasks without ram_gb), per allocated CPU.
  # Without it such a job would take all of RealMemory and run alone.
  DefMemPerCPU: >-
    {{ (tesp_slurm_real_memory_mb | int) // (tesp_slurm_cpus | int) }}
# Online CPUs, as slurmd counts them; more than slurmd finds drains the node.
tesp_slurm_cpus: >-
  {{ [ansible_facts['processor_vcpus'] | int,
      ansible_facts['processor_nproc'] | int] | min }}
# Memory (MiB) kept out of SLURM for the OS, Docker (tesp-api, MongoDB),
# Pulsar and nginx. At most half of the node's memory is held back.
tesp_slurm_reserved_memory_mb: 2048
# Must not exceed what slurmd detects, or SLURM drains the node.
tesp_slurm_real_memory_mb: >-
  {{ [(ansible_facts['memtotal_mb'] | int)
        - (tesp_slurm_reserved_memory_mb | int),
      (ansible_facts['memtotal_mb'] | int) // 2] | max }}

# Pulsar
pulsar_root: "{{ src_pulsar_storage_path | default('/mnt/pulsar', true) }}" # component variable attached_storage_path

pulsar_pip_install: true
pulsar_pycurl_ssl_library: openssl
pulsar_systemd: true
pulsar_systemd_runner: uwsgi

pulsar_systemd_environment:
- DRMAA_LIBRARY_PATH=/usr/lib/slurm-drmaa/lib/libdrmaa.so.1

pulsar_create_user: true
pulsar_user: {name: pulsar, shell: /bin/bash}

pulsar_optional_dependencies:
  - pyOpenSSL
  # For remote transfers initiated on the Pulsar end rather than the Galaxy end
  - pycurl
  # psutil and pylockfile are optional dependencies but can make Pulsar
  # more robust in small ways.
  - psutil
  - uwsgi
  # drmaa required if connecting to an external DRM using it.
  - drmaa

# Must listen beyond loopback so the pulsar-proxy container can reach it via
# host.docker.internal. It is not exposed through nginx, and a host firewall
# rule (templates/pulsar-firewall.sh.j2) drops connections to pulsar_port that
# don't come from loopback or a Docker bridge.
pulsar_host: "0.0.0.0"
# Also hardcoded in templates/tesp-api/pulsar-token-proxy.conf.j2.
pulsar_port: 8913
pulsar_uwsgi_options:
  buffer-size: 32768

pulsar_yaml_config:
  managers:
    _default_:
      # type: queued_cli
      # job_plugin: Slurm
      type: queued_drmaa
      # type: queued_python
      # type: queued_condor
      # submit_request_memory: 85
  private_token: "{{ pulsar_token }}"
  staging_directory: "{{ pulsar_staging_dir }}"
  persistence_directory: "{{ pulsar_persistence_dir }}"
  tool_dependency_dir: "{{ pulsar_dependencies_dir }}"
  min_polling_interval: 0.5

# Docker
docker_install_compose: true
# Lets Pulsar jobs use docker if tesp_container_type is switched to "docker".
docker_users:
  - "{{ pulsar_user.name }}"

# TESP-API (GA4GH TES -> Pulsar bridge)
# Exposed publicly via nginx at https://<workspace_fqdn>{{ tesp_root_path }}/ and
# protected by tesp-api's own HTTP basic auth (password generated at deploy time).
# Deployed from the mirelaminkova/tesp-api fork of CESNET/tesp-api, which
# carries the TES and S3 fixes. Bump deliberately: see "Configuration notes"
# in the README for what to check.
tesp_api_repo: "https://github.com/mirelaminkova/tesp-api.git"
# mirelaminkova/tesp-api main, 2026-10-26; CI green:
# https://github.com/mirelaminkova/tesp-api/actions/runs/40359853249
tesp_api_version: "c3a9f2376df7a634ad6c33959800d169219b7560"
tesp_install_dir: /srv/tesp-api
tesp_api_port: 8080          # host-localhost port; must match the /tes/ nginx proxy_pass above
tesp_root_path: /tes         # public URL prefix (also passed to uvicorn --root-path)
tesp_container_type: singularity  # docker | singularity -- how tesp-api wraps TES task containers.
                                  # NOTE: "both" is broken upstream (emits `singularity exec` but
                                  # omits the docker:// image prefix); use singularity on this
                                  # apptainer/SLURM node so images resolve as docker://<image>.
tesp_network_mtu: 1442       # SURF Research Cloud requires a lower MTU
tesp_basic_auth_user: tes
# Longest a TES task's Pulsar job may queue and run, in whole seconds. Past it
# tesp-api cancels the job and the task ends in SYSTEM_ERROR. 0 = no limit:
# tesp-api waits until the job finishes. See "Long tasks" in the README.
tesp_max_wait_seconds: 0

# How TES task resources (cpu_cores, ram_gb) are enforced; see "Resource
# limits" in the README. Templates for the per-job SLURM options that Pulsar
# passes through DRMAA, each used only when the task requests that resource.
# Placeholders (Python format, not Jinja): {cpu_cores} in the first, {ram_gb}
# or {ram_mib} (ram_gb in whole MiB, rounded up) in the second. Set one to ""
# to leave that resource out of the SLURM request.
tesp_native_spec_cpu_cores: "--cpus-per-task={cpu_cores}"
tesp_native_spec_ram_gb: "--mem={ram_mib}"
# auto | always | never: --cpus/--memory on the container command line.
# "auto" adds them for docker only. Keep it for singularity: Apptainer needs a
# cgroups manager for these flags and fails the task without one.
tesp_container_resource_limits: auto

# S3 storage for s3://bucket/key task inputs and outputs (see "Using S3" in the
# README). Set from the optional src_s3_* component parameters; with none set,
# tesp-api uses AWS S3 anonymously (public buckets only). Values are trimmed
# first, so a blank parameter counts as unset.
tesp_s3_endpoint_url: "{{ src_s3_endpoint_url | default('') | trim }}"
tesp_s3_region: >-
  {{ src_s3_region | default('') | trim | default('us-east-1', true) }}
# path | virtual | auto
tesp_s3_addressing_style: >-
  {{ src_s3_addressing_style | default('') | trim | default('path', true) }}
# The key pair must come from secret parameters. It is written only to
# tesp_secrets_file, never to settings.toml.
tesp_s3_access_key_id: "{{ src_s3_access_key_id | default('') | trim }}"
tesp_s3_secret_access_key: >-
  {{ src_s3_secret_access_key | default('') | trim }}
tesp_s3_presign_expiry_seconds: 3600          # download URLs handed to Pulsar
# Upload URLs; must cover a whole task run. Both at most 604800 (7 days).
tesp_s3_output_presign_expiry_seconds: 86400
# Root-only, and outside tesp_install_dir on purpose: that directory is the
# image build context (the Dockerfile does COPY . .), so a secret in it would
# be baked into an image layer. Bind-mounted read-only as /app/.secrets.toml.
tesp_secrets_dir: /etc/tesp-api
tesp_secrets_file: "{{ tesp_secrets_dir }}/secrets.toml"
# Pulsar's private_token, generated on the first run and reused on later ones
# (tasks/pulsar-token.yml). Delete it and re-run to rotate the token.
tesp_pulsar_token_file: "{{ tesp_secrets_dir }}/pulsar_token"
