# NGINX
nginx_reverse_proxy_locations:
- name: about
  location: '=/'
  auth: sram
  root: /srv/static/
  try_files: $uri/index.html =404
- name: tes
  location: /tes/
  proxy_pass: "http://127.0.0.1:8080/"
  auth: noauth
# Pulsar is not published through nginx: only tesp-api talks to it, via the
# token-injecting pulsar-proxy sidecar (templates/tesp-api/).

# SLURM
slurm_roles: ['controller', 'exec']
slurm_nodes:
- name: localhost

# Pulsar
pulsar_root: "{{ src_pulsar_storage_path | default('/mnt/pulsar', true) }}" # component variable attached_storage_path

pulsar_pip_install: true
pulsar_pycurl_ssl_library: openssl
pulsar_systemd: true
pulsar_systemd_runner: uwsgi

pulsar_systemd_environment:
- DRMAA_LIBRARY_PATH=/usr/lib/slurm-drmaa/lib/libdrmaa.so.1

pulsar_create_user: true
pulsar_user: {name: pulsar, shell: /bin/bash}

pulsar_optional_dependencies:
  - pyOpenSSL
  # For remote transfers initiated on the Pulsar end rather than the Galaxy end
  - pycurl
  # psutil and pylockfile are optional dependencies but can make Pulsar
  # more robust in small ways.
  - psutil
  - uwsgi
  # drmaa required if connecting to an external DRM using it.
  - drmaa

# Must listen beyond loopback so the pulsar-proxy container can reach it via
# host.docker.internal. It is not exposed through nginx.
pulsar_host: "0.0.0.0"
pulsar_uwsgi_options:
  buffer-size: 32768

pulsar_yaml_config:
  managers:
    _default_:
      # type: queued_cli
      # job_plugin: Slurm
      type: queued_drmaa
      # type: queued_python
      # type: queued_condor
      # submit_request_memory: 85
  private_token: "{{ pulsar_token }}"
  staging_directory: "{{ pulsar_staging_dir }}"
  persistence_directory: "{{ pulsar_persistence_dir }}"
  tool_dependency_dir: "{{ pulsar_dependencies_dir }}"
  min_polling_interval: 0.5

# Docker
docker_install_compose: true
# Lets Pulsar jobs use docker if tesp_container_type is switched to "docker".
docker_users:
  - "{{ pulsar_user.name }}"

# TESP-API (GA4GH TES -> Pulsar bridge)
# Exposed publicly via nginx at https://<workspace_fqdn>{{ tesp_root_path }}/ and
# protected by tesp-api's own HTTP basic auth (password generated at deploy time).
tesp_api_repo: "https://github.com/CESNET/tesp-api.git"
tesp_api_version: "3d470f76d4289abf15ae4b047ad8e267f2a944a9"  # CESNET/tesp-api main @ 2026-02-13; bump deliberately
tesp_install_dir: /srv/tesp-api
tesp_api_port: 8080          # host-localhost port; must match the /tes/ nginx proxy_pass above
tesp_root_path: /tes         # public URL prefix (also passed to uvicorn --root-path)
tesp_container_type: singularity  # docker | singularity -- how tesp-api wraps TES task containers.
                                  # NOTE: "both" is broken upstream (emits `singularity exec` but
                                  # omits the docker:// image prefix); use singularity on this
                                  # apptainer/SLURM node so images resolve as docker://<image>.
tesp_network_mtu: 1442       # SURF Research Cloud requires a lower MTU
tesp_basic_auth_user: tes
