---
name: e2e

# Issues #25, #26: brings up the tesp-api stack as playbook.yml renders it
# (gateway, tesp-api at the pinned commit, MongoDB, and the validator with
# tokens on; no Pulsar) and checks the gateway, once with Basic only and once
# with LS Login tokens against a mock identity provider. Needs no secrets;
# the password and keys are throwaway test values.
# Issue #45 (job task-fence): applies the task network fence in a network
# namespace and checks what a task user can reach.
# Issue #10: checks that the image holds no generated config and that a
# changed setting recreates tesp-api.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # basic: the default, as before issue #26. oauth: LS Login tokens on,
        # against a mock identity provider (tests/e2e/compose.oauth.yml).
        auth: [basic, oauth]
    name: e2e (${{ matrix.auth }})
    env:
      E2E_DIR: ${{ github.workspace }}/../e2e
      E2E_TES_PASSWORD: e2e-tes-password-not-secret
      E2E_IDP_SRC: ${{ github.workspace }}/tests/e2e/idp
      E2E_IDP_KEYS: ${{ github.workspace }}/../e2e-idp
    steps:
      - name: check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: install ansible-core and the validator's dependencies
        # ansible-core 2.16.20: what the SRC catalog item's plugin installs
        # (ansible 9.1.0). PyJWT and cryptography mint the test tokens.
        run: |
          pip install "ansible-core==2.16.20"
          pip install --require-hashes --only-binary=:all: --no-deps -r files/tes-validator/requirements.txt

      - name: create the mock identity provider's keys
        if: matrix.auth == 'oauth'
        run: |
          python3 tests/e2e/idp/make_keys.py "$E2E_IDP_KEYS"
          # The validator's base image runs the mock too.
          echo "E2E_PYTHON_IMAGE=$(sed -n 's/^FROM //p' files/tes-validator/Dockerfile)" >> "$GITHUB_ENV"

      - name: render the stack
        run: |
          extra=()
          if [ "${{ matrix.auth }}" = oauth ]; then
            extra=(-e @tests/e2e/oauth-vars.yml -e "tesp_oauth_ca_bundle=$E2E_IDP_KEYS/ca.pem")
          fi
          ansible-playbook -i localhost, -c local tests/e2e/render-stack.yml -e "e2e_dir=$E2E_DIR" "${extra[@]}"
          if [ "${{ matrix.auth }}" = oauth ]; then
            echo "COMPOSE_FILE=docker-compose.deploy.yml:$GITHUB_WORKSPACE/tests/e2e/compose.oauth.yml" >> "$GITHUB_ENV"
          else
            echo "COMPOSE_FILE=docker-compose.deploy.yml" >> "$GITHUB_ENV"
          fi

      # Issue #44: the playbook's check of the stack's pinned subnet
      # (tesp_stack_subnet's default), against the runner's real Docker
      # networks and routes, before the stack exists and after.
      - name: the stack's subnet is free before the first start
        run: |
          out=$(python3 files/check_stack_subnet.py 172.16.97.0/24 tesp-api)
          echo "$out"
          test "$out" = '{"own_subnets": {}}'

      - name: start the stack
        working-directory: ${{ env.E2E_DIR }}/tesp-api
        run: docker compose up -d --build

      - name: the stack's own networks pass the subnet check; others don't
        run: |
          out=$(python3 files/check_stack_subnet.py 172.16.97.0/24 tesp-api)
          echo "$out"
          if [ "${{ matrix.auth }}" = oauth ]; then
            want='{"own_subnets": {"auth": "172.16.97.128/25", "default": "172.16.97.0/25"}}'
          else
            want='{"own_subnets": {"default": "172.16.97.0/25"}}'
          fi
          test "$(echo "$out" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), sort_keys=True))')" = "$want"
          # As another project, the stack's networks are a conflict; so is
          # Docker's default bridge.
          # (bash -e ignores a failing "! cmd", hence the ifs.)
          if python3 files/check_stack_subnet.py 172.16.97.0/24 other-project; then
            echo "expected a conflict with the stack's networks" >&2; exit 1
          fi
          if python3 files/check_stack_subnet.py 172.17.0.0/24 tesp-api; then
            echo "expected a conflict with docker0" >&2; exit 1
          fi

      - name: wait for tesp-api behind the gateway
        run: tests/e2e/wait-for-tesp-api.sh http://127.0.0.1:8080 tes "$E2E_TES_PASSWORD"

      - name: check the gateway
        run: tests/e2e/check-gateway.sh http://127.0.0.1:8080 tes "$E2E_TES_PASSWORD" "$E2E_DIR/gateway/service-info.json"

      - name: check LS Login token access
        if: matrix.auth == 'oauth'
        run: tests/e2e/check-oauth.sh http://127.0.0.1:8080 tes "$E2E_TES_PASSWORD" "$E2E_IDP_KEYS"

      - name: the gateway finds a recreated tesp-api
        # As after a redeploy that rebuilds tesp-api. A placeholder container
        # takes tesp-api's old address, so the new one surely gets another,
        # which the gateway must resolve again.
        working-directory: ${{ env.E2E_DIR }}/tesp-api
        run: |
          old_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' tesp-api)
          network=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' tesp-api)
          docker compose rm -sf tesp-api
          docker run -d --rm --name ip-placeholder --network "$network" --ip "$old_ip" \
            --entrypoint sleep "$(docker inspect -f '{{.Config.Image}}' tesp-gateway)" 600
          docker compose up -d --no-deps tesp-api
          new_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' tesp-api)
          echo "tesp-api moved from $old_ip to $new_ip"
          test "$old_ip" != "$new_ip"
          "$GITHUB_WORKSPACE/tests/e2e/wait-for-tesp-api.sh" http://127.0.0.1:8080 tes "$E2E_TES_PASSWORD"

      # Issue #10: the generated config stays out of the image. grep exits
      # 1 when nothing matches, 0 on a match, 2 on an error.
      - name: the tesp-api image has no generated config
        run: |
          set +e
          docker run --rm --entrypoint grep "$(docker inspect -f '{{.Image}}' tesp-api)" \
            -rlsF -e "$E2E_TES_PASSWORD" -e e2e-pulsar-token /app
          status=$?
          set -e
          test "$status" -eq 1

      # Issue #10: a redeploy with a changed setting recreates tesp-api, which
      # then uses the new value; the other containers stay as they are.
      # --no-build and the image check: the compose file is in the build
      # context, so a rebuild alone would also recreate tesp-api; this shows
      # that the config label does it.
      - name: a changed setting recreates tesp-api only
        run: |
          cid() { docker inspect -f '{{.Id}}' "$1"; }
          api=$(cid tesp-api); proxy=$(cid tesp-pulsar-proxy); gateway=$(cid tesp-gateway)
          image=$(docker inspect -f '{{.Image}}' tesp-api)
          extra=()
          if [ "${{ matrix.auth }}" = oauth ]; then
            extra=(-e @tests/e2e/oauth-vars.yml -e "tesp_oauth_ca_bundle=$E2E_IDP_KEYS/ca.pem")
          fi
          ansible-playbook -i localhost, -c local tests/e2e/render-stack.yml \
            -e "e2e_dir=$E2E_DIR" "${extra[@]}" -e tesp_max_wait_seconds=4321
          (cd "$E2E_DIR/tesp-api" && docker compose up -d --no-build)
          test "$(docker inspect -f '{{.Image}}' tesp-api)" = "$image"
          test "$(cid tesp-api)" != "$api"
          test "$(cid tesp-pulsar-proxy)" = "$proxy"
          test "$(cid tesp-gateway)" = "$gateway"
          # The app's venv; plain `python` is Poetry's own.
          docker exec -w /app tesp-api /opt/pysetup/.venv/bin/python -c \
            'from tesp_api.config.properties import properties as p; assert p.pulsar.status.max_wait_seconds == 4321, p.pulsar.status.max_wait_seconds'
          tests/e2e/wait-for-tesp-api.sh http://127.0.0.1:8080 tes "$E2E_TES_PASSWORD"

      - name: dump logs on failure
        if: failure()
        working-directory: ${{ env.E2E_DIR }}/tesp-api
        run: docker compose logs --no-color --tail 200

  task-fence:
    # Issue #45: applies the task network fence as playbook.yml renders it, in
    # a throwaway network namespace, and checks what a task user can reach.
    # 22.04: the workspace's release (kernel netfilter, iptables 1.8.7).
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: install ansible-core
        # 2.16.20: what the SRC catalog item's plugin installs (ansible 9.1.0).
        run: pip install "ansible-core==2.16.20"

      - name: render the fence
        run: ansible-playbook -i localhost, -c local tests/e2e/render-task-fence.yml -e "fence_out=$RUNNER_TEMP/tesp-task-fence"

      - name: check the fence
        run: sudo tests/e2e/check-task-fence.sh "$RUNNER_TEMP/tesp-task-fence" nobody
