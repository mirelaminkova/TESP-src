---
# Extra vars for tests/e2e/render-stack.yml in the e2e job with tokens on
# (issue #26): the mock identity provider of tests/e2e/compose.oauth.yml.
tesp_oauth_enabled: true
tesp_oauth_issuers:
  - issuer: https://idp.e2e.test:8443/
    allowed_client_ids: [e2e-portal, e2e-service]
    exempt_client_ids: [e2e-service]
    # The test tokens' aud; required for the exempt client's tokens.
    exempt_audiences: [tes]
    entitlements:
      any_of: ["urn:e2e:group:ECP_CLN"]
# The runner reaches the gateway's published port from a stack network's
# bridge address, as the host nginx does, so Basic is allowed from there;
# check-oauth.sh sends X-Real-IP to be elsewhere.
tesp_basic_auth_sources: ["{{ tesp_stack_gateway }}", "{{ tesp_stack_auth_gateway }}"]
# Never rate-limited; check-oauth.sh claims it with X-Real-IP (issue #44).
tesp_rate_exempt_sources: [198.51.100.7]
# A browser portal such as Krini.
tesp_cors_origins: ["https://portal.e2e.test"]
# The tag e2e tasks of the exempt client name their user in.
tesp_oauth_audit_tag_keys: [user_sub]
