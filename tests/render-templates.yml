---
# Renders every template with representative values and checks what ends up
# where. Runs locally without root, Docker or the SRC roles:
#
#   ansible-playbook -i localhost, -c local tests/render-templates.yml
#
# The rendered files go to a temporary directory that is removed afterwards.
- name: Render templates and check them
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    workspace_fqdn: tesp.example.src.surf-hosted.nl
    fact_co_groups: {src_co_admin: test-co-admins}
    src_pulsar_storage_path: ""
    templates_dir: "{{ playbook_dir }}/../templates"
    # Set by playbook.yml from the rendered proxy config.
    tesp_pulsar_proxy_conf_checksum: test-proxy-conf-sha256-4f1c
    # playbook.yml itself, for the checks of its tasks.
    plays: "{{ lookup('file', playbook_dir ~ '/../playbook.yml') | from_yaml }}"
    # Issue #8: the secrets, and the files that hold them. secret_var_re
    # matches a secret variable's own name only (not tesp_pulsar_token_file).
    secret_var_re: \b(pulsar_token|tesp_basic_auth_password|tesp_s3_secret_access_key)\b
    secret_re: >-
      pulsar_token|tesp_basic_auth_password|tesp_s3_secret_access_key|pulsar-token-proxy\.conf|settings\.toml|secrets\.toml
  tasks:
    # Test values only. Set as host facts, like playbook.yml does, so they
    # show up in hostvars the way the real secrets do.
    - name: Set test secrets
      ansible.builtin.set_fact:
        pulsar_token: test-pulsar-token-7Hq2
        tesp_basic_auth_password: test-tes-password-K9xw
        # Stands in for any other secret that a variable dump would leak.
        test_unlisted_secret: test-unlisted-secret-Zp4m
        # S3 component parameters, as SRC passes them. The secret has
        # characters that must be escaped in TOML.
        src_s3_endpoint_url: https://s3.example.org
        src_s3_access_key_id: test-s3-access-key-Qe3r
        src_s3_secret_access_key: test-s3-secret/Jw8+"\\
        # Given as an s3:// URL; the playbook keeps just the bucket name.
        src_s3_bucket: ' s3://tesp-test-bucket/ '

    - name: Create output directory
      ansible.builtin.tempfile:
        state: directory
        suffix: tesp-render
      register: out

    - name: Render, check, clean up
      block:
        - name: Render templates
          ansible.builtin.template:
            src: "{{ templates_dir }}/{{ item }}"
            dest: >-
              {{ out.path }}/{{ item | basename | regex_replace('\.j2$', '') }}
            mode: '0600'
          loop:
            - welcome.html
            - chrony.conf
            - pulsar-firewall.sh.j2
            - pulsar-firewall.service.j2
            - tesp-api/docker-compose.yml.j2
            - tesp-api/pulsar-token-proxy.conf.j2
            - tesp-api/settings.toml.j2
            - tesp-api/secrets.toml.j2

        - name: Read rendered files
          ansible.builtin.slurp:
            src: "{{ out.path }}/{{ item }}"
          loop:
            - welcome.html
            - pulsar-firewall.sh
            - pulsar-token-proxy.conf
            - settings.toml
            - secrets.toml
            - docker-compose.yml
          register: rendered

        - name: Index rendered files by name
          ansible.builtin.set_fact:
            files: >-
              {{ files | default({})
                 | combine({item.item: item.content | b64decode}) }}
          loop: "{{ rendered.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Welcome page shows the TES credentials but no other secrets
          ansible.builtin.assert:
            that:
              - pulsar_token not in files['welcome.html']
              - test_unlisted_secret not in files['welcome.html']
              - tesp_basic_auth_password in files['welcome.html']
              - workspace_fqdn in files['welcome.html']
              - tesp_api_version in files['welcome.html']
            fail_msg: welcome.html leaks a secret or lost connection details

        # Each value the nextflow-tesp-src catalog item asks for has its own
        # copy field, hinted with its form label and parameter key.
        - name: Welcome page has copy fields for the Nextflow workspace
          ansible.builtin.assert:
            that:
              - tesp_s3_bucket == 'tesp-test-bucket'
              - >-
                ('id="field-tes-url">https://' ~ workspace_fqdn ~ '/tes<')
                in files['welcome.html']
              - "'id=\"field-tes-username\">tes<' in files['welcome.html']"
              - >-
                ('id="field-tes-password">' ~ tesp_basic_auth_password ~ '<')
                in files['welcome.html']
              - >-
                ('id="field-fqdn">' ~ workspace_fqdn ~ '<')
                in files['welcome.html']
              - >-
                'id="field-nf-workdir">s3://tesp-test-bucket/work<'
                in files['welcome.html']
              - "'id=\"field-s3-bucket\"' not in files['welcome.html']"
              - >-
                '<small>Paste TESP URL · src_tes_endpoint</small>'
                in files['welcome.html']
              - "'<small>src_tes_username</small>' in files['welcome.html']"
              - >-
                '<small>Write the TES password · src_tes_password</small>'
                in files['welcome.html']
              - >-
                '<small>S3 bucket resource · src_nf_workdir</small>'
                in files['welcome.html']
              - "'<small>src_s3_endpoint_url</small>' in files['welcome.html']"
              - "'<small>src_s3_region</small>' in files['welcome.html']"
              - >-
                'href="https://github.com/mirelaminkova/nextflow-tesp-src"'
                in files['welcome.html']
              - >-
                ('id="field-s3-endpoint">' ~ src_s3_endpoint_url ~ '<')
                in files['welcome.html']
              - "\"workDir = 's3://tesp-test-bucket/work'\" in files['welcome.html']"
              - "\"endpoint = 'https://s3.example.org'\" in files['welcome.html']"
              - "'id=\"s3-no-keys\"' not in files['welcome.html']"
              - "'s3PathStyleAccess = true' in files['welcome.html']"
              - "'id=\"field-s3-region\">us-east-1<' in files['welcome.html']"
            fail_msg: welcome.html lacks a copy field or the S3 work directory

        - name: Render the welcome page without S3 settings
          ansible.builtin.template:
            src: "{{ templates_dir }}/welcome.html"
            dest: "{{ out.path }}/no-s3-welcome.html"
            mode: '0600'
          # The src_s3_* test values are facts, which beat task vars, so
          # override what group_vars derives from them.
          vars:
            tesp_s3_bucket: ''
            tesp_s3_endpoint_url: ''
            tesp_s3_access_key_id: ''

        - name: Without S3 settings the page says so and shows no workDir
          ansible.builtin.assert:
            that:
              - "'id=\"field-nf-workdir\"' not in page"
              - "'workDir' not in page"
              - "'aws {' not in page"
              - "'id=\"s3-unset\"' in page"
              - "'id=\"s3-no-keys\"' not in page"
          vars:
            page: "{{ lookup('file', out.path ~ '/no-s3-welcome.html') }}"

        # SRC passes the CO admins as a list.
        - name: Render the welcome page with a list of admins
          ansible.builtin.template:
            src: "{{ templates_dir }}/welcome.html"
            dest: "{{ out.path }}/admins-welcome.html"
            mode: '0600'
          vars:
            fact_co_groups: {src_co_admin: [alice, bob]}

        - name: Admins are listed by name, not as a Python list
          ansible.builtin.assert:
            that:
              - "'<strong>Admins:</strong> alice, bob</li>' in page"
              - "'test-co-admins</li>' in files['welcome.html']"
          vars:
            page: "{{ lookup('file', out.path ~ '/admins-welcome.html') }}"

        - name: Render the welcome page with an endpoint but no bucket or keys
          ansible.builtin.template:
            src: "{{ templates_dir }}/welcome.html"
            dest: "{{ out.path }}/endpoint-only-welcome.html"
            mode: '0600'
          vars:
            tesp_s3_bucket: ''
            tesp_s3_access_key_id: ''
            tesp_s3_addressing_style: virtual

        - name: Endpoint only gives an aws block without workDir or path style
          ansible.builtin.assert:
            that:
              - "'aws {' in page"
              - "\"endpoint = 'https://s3.example.org'\" in page"
              - "'workDir' not in page"
              - "'s3PathStyleAccess' not in page"
              - "'id=\"field-nf-workdir\"' not in page"
              - "'id=\"s3-no-keys\"' in page"
          vars:
            page: "{{ lookup('file', out.path ~ '/endpoint-only-welcome.html') }}"

        # What SRC passed on a failed deploy: a bucket with a prefix, the
        # form nextflow-tesp-src's src_nf_workdir takes.
        - name: A prefix after the bucket becomes the work directory
          ansible.builtin.assert:
            that:
              - tesp_s3_bucket == 'nextflow-tesp'
              - tesp_s3_prefix == 'test/run1'
              - tesp_s3_workdir == 's3://nextflow-tesp/test/run1'
              - tesp_s3_bucket is match(tesp_s3_bucket_re)
              - tesp_s3_prefix is match(tesp_s3_prefix_re)
          vars:
            tesp_s3_location: nextflow-tesp/test/run1

        - name: Without a prefix the work directory is <bucket>/work
          ansible.builtin.assert:
            that:
              - tesp_s3_prefix == ''
              - tesp_s3_workdir == 's3://tesp-test-bucket/work'

        - name: Render the welcome page with a bucket prefix
          ansible.builtin.template:
            src: "{{ templates_dir }}/welcome.html"
            dest: "{{ out.path }}/prefix-welcome.html"
            mode: '0600'
          vars:
            tesp_s3_location: nextflow-tesp/test

        - name: The page uses the prefix as the work directory
          ansible.builtin.assert:
            that:
              - "'id=\"field-nf-workdir\">s3://nextflow-tesp/test<' in page"
              - "\"workDir = 's3://nextflow-tesp/test'\" in page"
              - "'s3://nextflow-tesp/test/work' not in page"
          vars:
            page: "{{ lookup('file', out.path ~ '/prefix-welcome.html') }}"

        - name: Prefixes are checked before they reach the welcome page
          ansible.builtin.assert:
            that:
              - "'work' is match(tesp_s3_prefix_re)"
              - "'a/b_c/d.e-f' is match(tesp_s3_prefix_re)"
              - "'' is not match(tesp_s3_prefix_re)"
              - "'/x' is not match(tesp_s3_prefix_re)"
              - "'a//b' is not match(tesp_s3_prefix_re)"
              - "'a b' is not match(tesp_s3_prefix_re)"
              - "\"a'b\" is not match(tesp_s3_prefix_re)"
              - "'a\\n' is not match(tesp_s3_prefix_re)"

        - name: Bucket names are checked before they reach the welcome page
          ansible.builtin.assert:
            that:
              - "'tesp-test-bucket' is match(tesp_s3_bucket_re)"
              - "'my.bucket-01' is match(tesp_s3_bucket_re)"
              - "'Nextflow_TESP' is not match(tesp_s3_bucket_re)"
              - "'my_bucket' is not match(tesp_s3_bucket_re)"
              - "'bucket-' is not match(tesp_s3_bucket_re)"
              - "'' is not match(tesp_s3_bucket_re)"
              - "'a b' is not match(tesp_s3_bucket_re)"
              - "'bucket/prefix' is not match(tesp_s3_bucket_re)"
              - "'<script>' is not match(tesp_s3_bucket_re)"
              - "'-bucket' is not match(tesp_s3_bucket_re)"
              - "'ab' is not match(tesp_s3_bucket_re)"
              - "'abc' is match(tesp_s3_bucket_re)"
              - "('a' * 63) is match(tesp_s3_bucket_re)"
              - "('a' * 64) is not match(tesp_s3_bucket_re)"
              - "'abc\\n' is not match(tesp_s3_bucket_re)"

        # Catches secrets the test doesn't know about (e.g. future S3
        # credentials) if a variable dump is added back.
        - name: Welcome page template doesn't dump variables
          ansible.builtin.assert:
            that:
              - "'hostvars' not in welcome_src"
              - "'to_nice_json' not in welcome_src"
              - "'to_json' not in welcome_src"
          vars:
            welcome_src: "{{ lookup('file', templates_dir ~ '/welcome.html') }}"

        # Issue #29: base64 tokens have +, / and =. Pulsar decodes the query
        # string, so an unencoded + arrives as a space and every request fails.
        # A fact, as in playbook.yml (task vars can't override facts).
        - name: Use a base64 Pulsar token
          ansible.builtin.set_fact:
            plain_pulsar_token: "{{ pulsar_token }}"
            pulsar_token: a+b/c=d+/==

        - name: Render the Pulsar proxy with a base64 token
          ansible.builtin.template:
            src: "{{ templates_dir }}/tesp-api/pulsar-token-proxy.conf.j2"
            dest: "{{ out.path }}/b64-pulsar-token-proxy.conf"
            mode: '0600'

        - name: Restore the test Pulsar token
          ansible.builtin.set_fact:
            pulsar_token: "{{ plain_pulsar_token }}"

        - name: The token survives the query string, alone and after other args
          ansible.builtin.assert:
            that:
              - query_values | length == 2
              # urldecode is unquote_plus, as Pulsar's parse_qs: a raw +
              # would read as a space.
              - query_values | map('urldecode') | unique == ['a+b/c=d+/==']
            fail_msg: "token in the query string: {{ query_values }}"
          vars:
            conf: "{{ lookup('file', out.path ~ '/b64-pulsar-token-proxy.conf') }}"
            query_values: >-
              {{ conf | regex_findall('private_token=([^";]*)') }}

        - name: Pulsar token goes only to the proxy, TES password to tesp-api
          ansible.builtin.assert:
            that:
              - pulsar_token in files['pulsar-token-proxy.conf']
              - pulsar_token not in files['settings.toml']
              - tesp_basic_auth_password in files['settings.toml']

        - name: S3 key pair goes only to the secrets file
          ansible.builtin.assert:
            that:
              - tesp_s3_secret_access_key == src_s3_secret_access_key
              - ('s3.access_key_id = ' ~ src_s3_access_key_id | to_json)
                in files['secrets.toml']
              - ('s3.secret_access_key = ' ~ src_s3_secret_access_key | to_json)
                in files['secrets.toml']
              - src_s3_secret_access_key not in files['welcome.html']
              - src_s3_secret_access_key not in files['settings.toml']
              - src_s3_secret_access_key not in files['docker-compose.yml']
              - src_s3_access_key_id not in files['settings.toml']
              - ('s3.endpoint_url = "' ~ src_s3_endpoint_url ~ '"')
                in files['settings.toml']
              - (tesp_secrets_file ~ ':/app/.secrets.toml:ro')
                in files['docker-compose.yml']
            fail_msg: S3 key pair missing from secrets.toml or leaked elsewhere

        # The {placeholders} are filled in by tesp-api, so they must reach
        # settings.toml as written.
        - name: Resource settings reach settings.toml with placeholders intact
          ansible.builtin.assert:
            that:
              - >-
                'pulsar.native_specification.cpu_cores = '
                ~ '"--cpus-per-task={cpu_cores}"' in files['settings.toml']
              - >-
                'pulsar.native_specification.ram_gb = "--mem={ram_mib}"'
                in files['settings.toml']
              - >-
                'container.resource_limits = "auto"'
                in files['settings.toml']

        # The keys load_status_polling reads in the pinned tesp-api. max_polls
        # is deprecated there and would log a warning at startup.
        - name: Status polling settings reach settings.toml, max_polls doesn't
          ansible.builtin.assert:
            that:
              - files['settings.toml'] is search(key_re ~ 'poll_interval = ')
              - >-
                files['settings.toml']
                is search(key_re ~ 'max_poll_interval = ')
              - >-
                files['settings.toml']
                is search(key_re ~ 'error_retry_seconds = ')
              - >-
                'pulsar.status.max_wait_seconds = 0' in files['settings.toml']
              - files['settings.toml'] is not search(key_re ~ 'max_polls\\s*=')
              - "'id=\"max-wait\"' not in files['welcome.html']"
          vars:
            key_re: '(?m)^\s*pulsar\.status\.'

        - name: Render with a task runtime cap
          ansible.builtin.template:
            src: "{{ templates_dir }}/{{ item }}"
            dest: >-
              {{ out.path }}/capped-{{ item | basename
                                       | regex_replace('\.j2$', '') }}
            mode: '0600'
          loop:
            - tesp-api/settings.toml.j2
            - welcome.html
          vars:
            tesp_max_wait_seconds: 86400

        - name: The cap reaches settings.toml and the welcome page
          ansible.builtin.assert:
            that:
              - >-
                'pulsar.status.max_wait_seconds = 86400'
                in lookup('file', out.path ~ '/capped-settings.toml')
              - >-
                '<span id="max-wait">86400</span>'
                in lookup('file', out.path ~ '/capped-welcome.html')

        # gather_facts is off; the group_vars templates read these facts
        # lazily, so task vars stand in for them.
        - name: SLURM node and memory settings follow the node's facts
          ansible.builtin.assert:
            that:
              - slurm_nodes[0].CPUs | int == 8
              - slurm_nodes[0].RealMemory | int == 16000 - 2048
              - slurm_config.SelectTypeParameters == 'CR_CPU_Memory'
              - slurm_config.DefMemPerCPU | int == (16000 - 2048) // 8
          vars:
            ansible_facts:
              processor_vcpus: 8
              processor_nproc: 8
              memtotal_mb: 16000

        - name: SLURM gets online CPUs and at least half of a small node
          ansible.builtin.assert:
            that:
              - slurm_nodes[0].RealMemory | int == 1500
              - slurm_nodes[0].CPUs | int == 1
          vars:
            ansible_facts:
              processor_vcpus: 2
              processor_nproc: 1
              memtotal_mb: 3000

        # uwsgi logs each request's URL, and on a client that went away a
        # write error with the URL, both with private_token in it.
        - name: Pulsar logs no request URLs and its config isn't world-readable
          ansible.builtin.assert:
            that:
              - pulsar_uwsgi_options['disable-logging'] | default(false) | bool
              - pulsar_uwsgi_options['ignore-sigpipe'] | default(false) | bool
              - pulsar_uwsgi_options['ignore-write-errors'] | default(false) | bool
              - pulsar_uwsgi_options['disable-write-exception'] | default(false) | bool
              - (pulsar_group | default('')) == pulsar_user.name
            fail_msg: >-
              uwsgi would log private_token with request URLs, or Pulsar's
              config directory would be world-readable (#8)

        - name: Find the tasks and roles in playbook.yml and tasks/
          ansible.builtin.set_fact:
            playbook_tasks: >-
              {{ (plays | map(attribute='pre_tasks', default=[]) | list
                  + plays | map(attribute='tasks', default=[]) | list
                  + plays | map(attribute='post_tasks', default=[]) | list
                  + plays | map(attribute='handlers', default=[]) | list
                  + query('ansible.builtin.file',
                          *query('ansible.builtin.fileglob', playbook_dir ~ '/../tasks/*.yml'))
                    | map('from_yaml') | list)
                 | flatten(levels=1) }}
            playbook_roles: >-
              {{ plays | map(attribute='roles', default=[]) | flatten(levels=1) }}

        # -v prints facts and module results, --diff rendered files. A task
        # that sets, reads or writes a secret (by name, or through the
        # template it renders) must be no_log; a template may use diff: false
        # instead, which keeps its errors visible. file and stat never print
        # a file's content. An assert prints only its messages and the
        # expression text, never values, so one whose messages name no secret
        # needs neither (tasks/pulsar-token.yml).
        - name: Tasks that handle the Pulsar token or a password don't print it
          ansible.builtin.assert:
            that:
              - >-
                item.no_log | default(false) | bool
                or (template_src != '' and item.diff is defined and not item.diff)
                or item['ansible.builtin.file'] is defined
                or item['ansible.builtin.stat'] is defined
                or (item['ansible.builtin.assert'] is defined
                    and not ([item['ansible.builtin.assert'].fail_msg | default(''),
                              item['ansible.builtin.assert'].success_msg | default(''),
                              item['ansible.builtin.assert'].msg | default('')]
                             | join(' ') is search(secret_var_re)))
            fail_msg: >-
              {{ item.name }} handles a secret but isn't no_log (or, for a
              template, diff: false)
            quiet: true
          loop: "{{ playbook_tasks }}"
          loop_control:
            label: "{{ item.name }}"
          when: >-
            item | to_json is search(secret_re)
            or (template_src != ''
                and lookup('ansible.builtin.file', playbook_dir ~ '/../' ~ template_src)
                    is search(secret_var_re))
          vars:
            template_src: >-
              {{ (item['ansible.builtin.template'] | default({})).src | default('') }}

        # Only root (and, for 0640 files, the root group) may read a file that
        # holds the token or a password, by name or through the template that
        # renders it. The welcome page is the one exception, by design: it
        # shows the TES credentials to CO members, so nginx (www-data) serves
        # it, behind SRAM.
        - name: Files with the Pulsar token or a password aren't world-readable
          ansible.builtin.assert:
            that:
              - module.mode is defined
              - module.mode | string is match('^0?[0-7][0-7]0$')
              - module.owner | default('root') == 'root'
              - module.group | default('root') == 'root'
            fail_msg: "{{ item.name }} writes a secret with mode {{ module.mode | default('(unset)') }}"
            quiet: true
          loop: "{{ playbook_tasks }}"
          loop_control:
            label: "{{ item.name }}"
          when:
            - item['ansible.builtin.template'] is defined or item['ansible.builtin.copy'] is defined
            - template_src != 'templates/welcome.html'
            - >-
              item | to_json is search(secret_re)
              or (template_src != ''
                  and lookup('ansible.builtin.file', playbook_dir ~ '/../' ~ template_src)
                      is search(secret_var_re))
          vars:
            module: "{{ item['ansible.builtin.template'] | default(item['ansible.builtin.copy']) }}"
            template_src: >-
              {{ (item['ansible.builtin.template'] | default({})).src | default('') }}

        # pulsar_group makes the role create pulsar_root and every directory
        # under it 0750 root:pulsar or pulsar:pulsar: job data (staging holds
        # job scripts with presigned S3 URLs) is private to root and Pulsar.
        # The welcome page must not present it as something users can open.
        - name: The welcome page says the job store is private
          ansible.builtin.assert:
            that:
              - files['welcome.html'] is search('Job storage:</strong> <code>' ~ pulsar_root ~ '</code>, readable only by root and the Pulsar service user')
            fail_msg: >-
              the welcome page advertises {{ pulsar_root }} without saying that
              only root and the Pulsar user can read it (#8, pulsar_group)

        # Under --check on a host without the proxy config (upgraded from
        # before this change), stat has no checksum.
        - name: The proxy checksum has a value under --check
          ansible.builtin.assert:
            that:
              - checksum_fact | length == 1
              - >-
                checksum_fact[0]['ansible.builtin.set_fact'].tesp_pulsar_proxy_conf_checksum
                is search('ansible_check_mode')
            fail_msg: the proxy config checksum must default under --check only
          vars:
            checksum_fact: >-
              {{ plays | map(attribute='post_tasks', default=[]) | flatten(levels=1)
                 | map('to_json') | select('search', 'set_fact": [{]"tesp_pulsar_proxy_conf_checksum"')
                 | map('from_json') | list }}

        # tesp_install_dir is the tesp-api image's build context (COPY . .):
        # a file there that holds the token ends up in every image layer.
        - name: The Pulsar proxy config is outside the image build context
          ansible.builtin.assert:
            that:
              - not (tesp_pulsar_proxy_conf | dirname).startswith(tesp_install_dir)
              - (tesp_pulsar_proxy_conf ~ ':/etc/nginx/conf.d/default.conf:ro') in files['docker-compose.yml']
            fail_msg: >-
              pulsar-token-proxy.conf must live outside {{ tesp_install_dir }}
              (the image build context) and be what pulsar-proxy mounts (#8)

        - name: The Pulsar role doesn't show diffs
          ansible.builtin.assert:
            that:
              - pulsar_role | length == 1
              - pulsar_role[0].diff is defined
              - not pulsar_role[0].diff
            fail_msg: >-
              galaxyproject.pulsar must run with diff: false, or --diff prints
              app.yml with the Pulsar token (#8)
          vars:
            pulsar_role: >-
              {{ playbook_roles | select('mapping')
                 | selectattr('role', 'eq', 'galaxyproject.pulsar') | list }}

        - name: Firewall script guards the Pulsar port
          ansible.builtin.assert:
            that:
              - ('--dport ' ~ pulsar_port) in files['pulsar-firewall.sh']

        - name: Firewall script is valid sh
          ansible.builtin.command: sh -n {{ out.path }}/pulsar-firewall.sh
          changed_when: false

        # Issue #9. Last: these replace the test pulsar_token fact set above.
        - name: Generate and store a Pulsar token
          ansible.builtin.include_tasks: ../tasks/pulsar-token.yml
          vars:
            tesp_pulsar_token_file: "{{ out.path }}/pulsar_token"

        - name: Remember the first token
          ansible.builtin.set_fact:
            first_pulsar_token: "{{ pulsar_token }}"

        - name: Run the token tasks again, as a re-run of the playbook does
          ansible.builtin.include_tasks: ../tasks/pulsar-token.yml
          vars:
            tesp_pulsar_token_file: "{{ out.path }}/pulsar_token"

        - name: Check the stored token file
          ansible.builtin.stat:
            path: "{{ out.path }}/pulsar_token"
          register: token_file

        - name: A re-run keeps the Pulsar token; the file is private
          ansible.builtin.assert:
            that:
              - first_pulsar_token is match('^[A-Za-z0-9]{32}$')
              - pulsar_token == first_pulsar_token
              - token_file.stat.mode == '0600'
            fail_msg: >-
              the Pulsar token isn't 32 letters and digits, changed on a
              re-run, or its file is readable by others

        # A token put in the file by hand may be base64, with + / =, in a
        # file with looser permissions. It is reused as is (the proxy
        # template URL-encodes it, #29), and the file is made private.
        - name: Store a base64 Pulsar token by hand
          ansible.builtin.copy:
            content: "Ab+cD/eF=gH+iJ/kL=mN+oP/q=="
            dest: "{{ out.path }}/legacy_pulsar_token"
            mode: '0644'

        - name: Run the token tasks on the stored base64 token
          ansible.builtin.include_tasks: ../tasks/pulsar-token.yml
          vars:
            tesp_pulsar_token_file: "{{ out.path }}/legacy_pulsar_token"

        - name: Render the Pulsar proxy with the stored base64 token
          ansible.builtin.template:
            src: "{{ templates_dir }}/tesp-api/pulsar-token-proxy.conf.j2"
            dest: "{{ out.path }}/legacy-pulsar-token-proxy.conf"
            mode: '0600'

        - name: Check the stored base64 token file
          ansible.builtin.stat:
            path: "{{ out.path }}/legacy_pulsar_token"
          register: legacy_token_file

        - name: A stored base64 token is kept, private, and reaches Pulsar intact
          ansible.builtin.assert:
            that:
              - pulsar_token == 'Ab+cD/eF=gH+iJ/kL=mN+oP/q=='
              - legacy_token_file.stat.mode == '0600'
              - query_values | length == 2
              - query_values | map('urldecode') | unique == [pulsar_token]
            fail_msg: >-
              a stored base64 token was replaced, its file stayed readable by
              others, or the proxy doesn't URL-encode it: {{ query_values }}
          vars:
            conf: "{{ lookup('file', out.path ~ '/legacy-pulsar-token-proxy.conf') }}"
            query_values: >-
              {{ conf | regex_findall('private_token=([^";]*)') }}

        - name: Store an empty Pulsar token file
          ansible.builtin.copy:
            content: ""
            dest: "{{ out.path }}/empty_pulsar_token"
            mode: '0600'

        - name: The token tasks refuse an empty token file
          block:
            - name: Run the token tasks on the empty file
              ansible.builtin.include_tasks: ../tasks/pulsar-token.yml
              vars:
                tesp_pulsar_token_file: "{{ out.path }}/empty_pulsar_token"

            - name: An empty token file must fail the run
              ansible.builtin.fail:
                msg: the token tasks accepted an empty token file
          rescue:
            - name: The failure is the token check, not the fail task above
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search('holds no usable Pulsar token')
                fail_msg: >-
                  expected the token check to refuse the empty file, got:
                  {{ ansible_failed_result.msg }}

        # The role notifies pulsar_restart_handler_name when app.yml (the
        # token) changes; its default handler never runs here.
        - name: A changed Pulsar config restarts Pulsar
          ansible.builtin.assert:
            that:
              - pulsar_restart_handler_name | default('') != ''
              - restart_handlers | length == 1
              - (restart_handlers[0]['ansible.builtin.systemd_service'] | default({})).state | default('') == 'restarted'
              - >-
                (restart_handlers[0]['ansible.builtin.systemd_service'] | default({})).name | default('')
                is search('pulsar')
            fail_msg: >-
              Pulsar would keep its old token after app.yml changes (#9):
              pulsar_restart_handler_name must name a playbook handler that
              restarts the pulsar service
          vars:
            restart_handlers: >-
              {{ plays | map(attribute='handlers', default=[]) | flatten(levels=1)
                 | selectattr('name', 'eq', pulsar_restart_handler_name | default(''))
                 | list }}

        # pulsar-proxy reads its config only when it starts, and the template
        # replaces the bind-mounted file, so a changed config must recreate
        # the container. The config's checksum, taken after the template and
        # before the compose file, is a label on the service.
        # A handler alone isn't enough: a run that stops before handlers run
        # leaves the next run with nothing to notify.
        - name: Pulsar is restarted when its config is newer than the process
          ansible.builtin.assert:
            that:
              - check_tasks | length == 1
              - restart_tasks | length == 1
              - pjson.index(check_tasks[0] | to_json) < pjson.index(restart_tasks[0] | to_json)
              - restart_tasks[0]['ansible.builtin.systemd_service'].state | default('') == 'restarted'
            fail_msg: >-
              a run that stops between the Pulsar role and its handlers would
              leave Pulsar on an old token (#9): post_tasks must compare the
              config directory with Pulsar's start time and restart it
          vars:
            pjson: "{{ plays | map(attribute='post_tasks', default=[]) | flatten(levels=1) | map('to_json') | list }}"
            check_tasks: >-
              {{ pjson | select('search', 'ActiveEnterTimestamp')
                 | select('search', 'register": "tesp_pulsar_config_state')
                 | map('from_json') | list }}
            restart_tasks: >-
              {{ pjson | select('search', 'tesp_pulsar_config_state.stdout')
                 | map('from_json') | list }}

        # pulsar-proxy reads its config only when it starts, and the template
        # replaces the bind-mounted file, so a changed config must recreate
        # the container: after the template, the playbook takes the checksum
        # of that same file and the compose file labels pulsar-proxy with it.
        - name: A changed proxy config recreates pulsar-proxy
          ansible.builtin.assert:
            that:
              - tpl_tasks | length == 1
              - stat_tasks | length == 1
              - fact_tasks | length == 1
              - compose_tasks | length == 1
              - >-
                fact_tasks[0]['ansible.builtin.set_fact'].tesp_pulsar_proxy_conf_checksum
                is search(stat_tasks[0].register ~ '[.]stat[.]checksum')
              - >-
                pjson.index(tpl_tasks[0] | to_json) < pjson.index(stat_tasks[0] | to_json)
                < pjson.index(fact_tasks[0] | to_json) < pjson.index(compose_tasks[0] | to_json)
              - >-
                ((files['docker-compose.yml'] | from_yaml).services['pulsar-proxy'].labels
                 | default({}))['tesp.pulsar-proxy-conf-sha256'] | default('')
                == tesp_pulsar_proxy_conf_checksum
            fail_msg: >-
              pulsar-proxy would keep serving an old config (and token) after
              pulsar-token-proxy.conf changes (#9): playbook.yml must template
              it, stat that file, set tesp_pulsar_proxy_conf_checksum from the
              stat, then template the compose file, which labels pulsar-proxy
          vars:
            pjson: "{{ plays | map(attribute='post_tasks', default=[]) | flatten(levels=1) | map('to_json') | list }}"
            tpl_tasks: >-
              {{ pjson | select('search', 'pulsar-token-proxy[.]conf[.]j2')
                 | map('from_json') | list }}
            tpl_dest: "{{ (tpl_tasks[0]['ansible.builtin.template'] | default({})).dest | default('-') }}"
            # The stat of the very file the template writes.
            stat_tasks: >-
              {{ pjson | select('search', '"ansible[.]builtin[.]stat": [{]')
                 | select('search', '"path": "' ~ (tpl_dest | regex_escape) ~ '"')
                 | map('from_json') | list }}
            fact_tasks: >-
              {{ pjson | select('search', 'set_fact": [{]"tesp_pulsar_proxy_conf_checksum"')
                 | map('from_json') | list }}
            compose_tasks: >-
              {{ pjson | select('search', 'docker-compose[.]yml[.]j2')
                 | map('from_json') | list }}

      always:
        - name: Remove output directory
          ansible.builtin.file:
            path: "{{ out.path }}"
            state: absent
