---
# Renders every template with representative values and checks what ends up
# where. Runs locally without root, Docker or the SRC roles:
#
#   ansible-playbook -i localhost, -c local tests/render-templates.yml
#
# The rendered files go to a temporary directory that is removed afterwards.
- name: Render templates and check them
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    workspace_fqdn: tesp.example.src.surf-hosted.nl
    fact_co_groups: {src_co_admin: test-co-admins}
    src_pulsar_storage_path: ""
    templates_dir: "{{ playbook_dir }}/../templates"
  tasks:
    # Test values only. Set as host facts, like playbook.yml does, so they
    # show up in hostvars the way the real secrets do.
    - name: Set test secrets
      ansible.builtin.set_fact:
        pulsar_token: test-pulsar-token-7Hq2
        tesp_basic_auth_password: test-tes-password-K9xw
        # Stands in for any other secret that a variable dump would leak.
        test_unlisted_secret: test-unlisted-secret-Zp4m
        # S3 component parameters, as SRC passes them. The secret has
        # characters that must be escaped in TOML.
        src_s3_endpoint_url: https://s3.example.org
        src_s3_access_key_id: test-s3-access-key-Qe3r
        src_s3_secret_access_key: test-s3-secret/Jw8+"\\
        # Given as an s3:// URL; the playbook keeps just the bucket name.
        src_s3_bucket: ' s3://tesp-test-bucket/ '

    - name: Create output directory
      ansible.builtin.tempfile:
        state: directory
        suffix: tesp-render
      register: out

    - name: Render, check, clean up
      block:
        - name: Render templates
          ansible.builtin.template:
            src: "{{ templates_dir }}/{{ item }}"
            dest: >-
              {{ out.path }}/{{ item | basename | regex_replace('\.j2$', '') }}
            mode: '0600'
          loop:
            - welcome.html
            - chrony.conf
            - pulsar-firewall.sh.j2
            - pulsar-firewall.service.j2
            - tesp-api/docker-compose.yml.j2
            - tesp-api/pulsar-token-proxy.conf.j2
            - tesp-api/settings.toml.j2
            - tesp-api/secrets.toml.j2

        - name: Read rendered files
          ansible.builtin.slurp:
            src: "{{ out.path }}/{{ item }}"
          loop:
            - welcome.html
            - pulsar-firewall.sh
            - pulsar-token-proxy.conf
            - settings.toml
            - secrets.toml
            - docker-compose.yml
          register: rendered

        - name: Index rendered files by name
          ansible.builtin.set_fact:
            files: >-
              {{ files | default({})
                 | combine({item.item: item.content | b64decode}) }}
          loop: "{{ rendered.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Welcome page shows the TES credentials but no other secrets
          ansible.builtin.assert:
            that:
              - pulsar_token not in files['welcome.html']
              - test_unlisted_secret not in files['welcome.html']
              - tesp_basic_auth_password in files['welcome.html']
              - workspace_fqdn in files['welcome.html']
              - tesp_api_version in files['welcome.html']
            fail_msg: welcome.html leaks a secret or lost connection details

        # Each value the nextflow-tesp-src catalog item asks for has its own
        # copy field, hinted with its form label and parameter key.
        - name: Welcome page has copy fields for the Nextflow workspace
          ansible.builtin.assert:
            that:
              - tesp_s3_bucket == 'tesp-test-bucket'
              - >-
                ('id="field-tes-url">https://' ~ workspace_fqdn ~ '/tes<')
                in files['welcome.html']
              - "'id=\"field-tes-username\">tes<' in files['welcome.html']"
              - >-
                ('id="field-tes-password">' ~ tesp_basic_auth_password ~ '<')
                in files['welcome.html']
              - >-
                ('id="field-fqdn">' ~ workspace_fqdn ~ '<')
                in files['welcome.html']
              - >-
                'id="field-nf-workdir">s3://tesp-test-bucket/work<'
                in files['welcome.html']
              - "'id=\"field-s3-bucket\"' not in files['welcome.html']"
              - >-
                '<small>Paste TESP URL · src_tes_endpoint</small>'
                in files['welcome.html']
              - "'<small>src_tes_username</small>' in files['welcome.html']"
              - >-
                '<small>Write the TES password · src_tes_password</small>'
                in files['welcome.html']
              - >-
                '<small>S3 bucket resource · src_nf_workdir</small>'
                in files['welcome.html']
              - "'<small>src_s3_endpoint_url</small>' in files['welcome.html']"
              - "'<small>src_s3_region</small>' in files['welcome.html']"
              - >-
                'href="https://github.com/mirelaminkova/nextflow-tesp-src"'
                in files['welcome.html']
              - >-
                ('id="field-s3-endpoint">' ~ src_s3_endpoint_url ~ '<')
                in files['welcome.html']
              - "\"workDir = 's3://tesp-test-bucket/work'\" in files['welcome.html']"
              - "\"endpoint = 'https://s3.example.org'\" in files['welcome.html']"
              - "'id=\"s3-no-keys\"' not in files['welcome.html']"
              - "'s3PathStyleAccess = true' in files['welcome.html']"
              - "'id=\"field-s3-region\">us-east-1<' in files['welcome.html']"
            fail_msg: welcome.html lacks a copy field or the S3 work directory

        - name: Render the welcome page without S3 settings
          ansible.builtin.template:
            src: "{{ templates_dir }}/welcome.html"
            dest: "{{ out.path }}/no-s3-welcome.html"
            mode: '0600'
          # The src_s3_* test values are facts, which beat task vars, so
          # override what group_vars derives from them.
          vars:
            tesp_s3_bucket: ''
            tesp_s3_endpoint_url: ''
            tesp_s3_access_key_id: ''

        - name: Without S3 settings the page says so and shows no workDir
          ansible.builtin.assert:
            that:
              - "'id=\"field-nf-workdir\"' not in page"
              - "'workDir' not in page"
              - "'aws {' not in page"
              - "'id=\"s3-unset\"' in page"
              - "'id=\"s3-no-keys\"' not in page"
          vars:
            page: "{{ lookup('file', out.path ~ '/no-s3-welcome.html') }}"

        # SRC passes the CO admins as a list.
        - name: Render the welcome page with a list of admins
          ansible.builtin.template:
            src: "{{ templates_dir }}/welcome.html"
            dest: "{{ out.path }}/admins-welcome.html"
            mode: '0600'
          vars:
            fact_co_groups: {src_co_admin: [alice, bob]}

        - name: Admins are listed by name, not as a Python list
          ansible.builtin.assert:
            that:
              - "'<strong>Admins:</strong> alice, bob</li>' in page"
              - "'test-co-admins</li>' in files['welcome.html']"
          vars:
            page: "{{ lookup('file', out.path ~ '/admins-welcome.html') }}"

        - name: Render the welcome page with an endpoint but no bucket or keys
          ansible.builtin.template:
            src: "{{ templates_dir }}/welcome.html"
            dest: "{{ out.path }}/endpoint-only-welcome.html"
            mode: '0600'
          vars:
            tesp_s3_bucket: ''
            tesp_s3_access_key_id: ''
            tesp_s3_addressing_style: virtual

        - name: Endpoint only gives an aws block without workDir or path style
          ansible.builtin.assert:
            that:
              - "'aws {' in page"
              - "\"endpoint = 'https://s3.example.org'\" in page"
              - "'workDir' not in page"
              - "'s3PathStyleAccess' not in page"
              - "'id=\"field-nf-workdir\"' not in page"
              - "'id=\"s3-no-keys\"' in page"
          vars:
            page: "{{ lookup('file', out.path ~ '/endpoint-only-welcome.html') }}"

        # What SRC passed on a failed deploy: a bucket with a prefix, the
        # form nextflow-tesp-src's src_nf_workdir takes.
        - name: A prefix after the bucket becomes the work directory
          ansible.builtin.assert:
            that:
              - tesp_s3_bucket == 'nextflow-tesp'
              - tesp_s3_prefix == 'test/run1'
              - tesp_s3_workdir == 's3://nextflow-tesp/test/run1'
              - tesp_s3_bucket is match(tesp_s3_bucket_re)
              - tesp_s3_prefix is match(tesp_s3_prefix_re)
          vars:
            tesp_s3_location: nextflow-tesp/test/run1

        - name: Without a prefix the work directory is <bucket>/work
          ansible.builtin.assert:
            that:
              - tesp_s3_prefix == ''
              - tesp_s3_workdir == 's3://tesp-test-bucket/work'

        - name: Render the welcome page with a bucket prefix
          ansible.builtin.template:
            src: "{{ templates_dir }}/welcome.html"
            dest: "{{ out.path }}/prefix-welcome.html"
            mode: '0600'
          vars:
            tesp_s3_location: nextflow-tesp/test

        - name: The page uses the prefix as the work directory
          ansible.builtin.assert:
            that:
              - "'id=\"field-nf-workdir\">s3://nextflow-tesp/test<' in page"
              - "\"workDir = 's3://nextflow-tesp/test'\" in page"
              - "'s3://nextflow-tesp/test/work' not in page"
          vars:
            page: "{{ lookup('file', out.path ~ '/prefix-welcome.html') }}"

        - name: Prefixes are checked before they reach the welcome page
          ansible.builtin.assert:
            that:
              - "'work' is match(tesp_s3_prefix_re)"
              - "'a/b_c/d.e-f' is match(tesp_s3_prefix_re)"
              - "'' is not match(tesp_s3_prefix_re)"
              - "'/x' is not match(tesp_s3_prefix_re)"
              - "'a//b' is not match(tesp_s3_prefix_re)"
              - "'a b' is not match(tesp_s3_prefix_re)"
              - "\"a'b\" is not match(tesp_s3_prefix_re)"
              - "'a\\n' is not match(tesp_s3_prefix_re)"

        - name: Bucket names are checked before they reach the welcome page
          ansible.builtin.assert:
            that:
              - "'tesp-test-bucket' is match(tesp_s3_bucket_re)"
              - "'my.bucket-01' is match(tesp_s3_bucket_re)"
              - "'Nextflow_TESP' is not match(tesp_s3_bucket_re)"
              - "'my_bucket' is not match(tesp_s3_bucket_re)"
              - "'bucket-' is not match(tesp_s3_bucket_re)"
              - "'' is not match(tesp_s3_bucket_re)"
              - "'a b' is not match(tesp_s3_bucket_re)"
              - "'bucket/prefix' is not match(tesp_s3_bucket_re)"
              - "'<script>' is not match(tesp_s3_bucket_re)"
              - "'-bucket' is not match(tesp_s3_bucket_re)"
              - "'ab' is not match(tesp_s3_bucket_re)"
              - "'abc' is match(tesp_s3_bucket_re)"
              - "('a' * 63) is match(tesp_s3_bucket_re)"
              - "('a' * 64) is not match(tesp_s3_bucket_re)"
              - "'abc\\n' is not match(tesp_s3_bucket_re)"

        # Catches secrets the test doesn't know about (e.g. future S3
        # credentials) if a variable dump is added back.
        - name: Welcome page template doesn't dump variables
          ansible.builtin.assert:
            that:
              - "'hostvars' not in welcome_src"
              - "'to_nice_json' not in welcome_src"
              - "'to_json' not in welcome_src"
          vars:
            welcome_src: "{{ lookup('file', templates_dir ~ '/welcome.html') }}"

        - name: Pulsar token goes only to the proxy, TES password to tesp-api
          ansible.builtin.assert:
            that:
              - pulsar_token in files['pulsar-token-proxy.conf']
              - pulsar_token not in files['settings.toml']
              - tesp_basic_auth_password in files['settings.toml']

        - name: S3 key pair goes only to the secrets file
          ansible.builtin.assert:
            that:
              - tesp_s3_secret_access_key == src_s3_secret_access_key
              - ('s3.access_key_id = ' ~ src_s3_access_key_id | to_json)
                in files['secrets.toml']
              - ('s3.secret_access_key = ' ~ src_s3_secret_access_key | to_json)
                in files['secrets.toml']
              - src_s3_secret_access_key not in files['welcome.html']
              - src_s3_secret_access_key not in files['settings.toml']
              - src_s3_secret_access_key not in files['docker-compose.yml']
              - src_s3_access_key_id not in files['settings.toml']
              - ('s3.endpoint_url = "' ~ src_s3_endpoint_url ~ '"')
                in files['settings.toml']
              - (tesp_secrets_file ~ ':/app/.secrets.toml:ro')
                in files['docker-compose.yml']
            fail_msg: S3 key pair missing from secrets.toml or leaked elsewhere

        # The {placeholders} are filled in by tesp-api, so they must reach
        # settings.toml as written.
        - name: Resource settings reach settings.toml with placeholders intact
          ansible.builtin.assert:
            that:
              - >-
                'pulsar.native_specification.cpu_cores = '
                ~ '"--cpus-per-task={cpu_cores}"' in files['settings.toml']
              - >-
                'pulsar.native_specification.ram_gb = "--mem={ram_mib}"'
                in files['settings.toml']
              - >-
                'container.resource_limits = "auto"'
                in files['settings.toml']

        # The keys load_status_polling reads in the pinned tesp-api. max_polls
        # is deprecated there and would log a warning at startup.
        - name: Status polling settings reach settings.toml, max_polls doesn't
          ansible.builtin.assert:
            that:
              - files['settings.toml'] is search(key_re ~ 'poll_interval = ')
              - >-
                files['settings.toml']
                is search(key_re ~ 'max_poll_interval = ')
              - >-
                files['settings.toml']
                is search(key_re ~ 'error_retry_seconds = ')
              - >-
                'pulsar.status.max_wait_seconds = 0' in files['settings.toml']
              - files['settings.toml'] is not search(key_re ~ 'max_polls\\s*=')
              - "'id=\"max-wait\"' not in files['welcome.html']"
          vars:
            key_re: '(?m)^\s*pulsar\.status\.'

        - name: Render with a task runtime cap
          ansible.builtin.template:
            src: "{{ templates_dir }}/{{ item }}"
            dest: >-
              {{ out.path }}/capped-{{ item | basename
                                       | regex_replace('\.j2$', '') }}
            mode: '0600'
          loop:
            - tesp-api/settings.toml.j2
            - welcome.html
          vars:
            tesp_max_wait_seconds: 86400

        - name: The cap reaches settings.toml and the welcome page
          ansible.builtin.assert:
            that:
              - >-
                'pulsar.status.max_wait_seconds = 86400'
                in lookup('file', out.path ~ '/capped-settings.toml')
              - >-
                '<span id="max-wait">86400</span>'
                in lookup('file', out.path ~ '/capped-welcome.html')

        # gather_facts is off; the group_vars templates read these facts
        # lazily, so task vars stand in for them.
        - name: SLURM node and memory settings follow the node's facts
          ansible.builtin.assert:
            that:
              - slurm_nodes[0].CPUs | int == 8
              - slurm_nodes[0].RealMemory | int == 16000 - 2048
              - slurm_config.SelectTypeParameters == 'CR_CPU_Memory'
              - slurm_config.DefMemPerCPU | int == (16000 - 2048) // 8
          vars:
            ansible_facts:
              processor_vcpus: 8
              processor_nproc: 8
              memtotal_mb: 16000

        - name: SLURM gets online CPUs and at least half of a small node
          ansible.builtin.assert:
            that:
              - slurm_nodes[0].RealMemory | int == 1500
              - slurm_nodes[0].CPUs | int == 1
          vars:
            ansible_facts:
              processor_vcpus: 2
              processor_nproc: 1
              memtotal_mb: 3000

        - name: Firewall script guards the Pulsar port
          ansible.builtin.assert:
            that:
              - ('--dport ' ~ pulsar_port) in files['pulsar-firewall.sh']

        - name: Firewall script is valid sh
          ansible.builtin.command: sh -n {{ out.path }}/pulsar-firewall.sh
          changed_when: false

        # Last: these replace the test pulsar_token fact set above.
        - name: Generate and store a Pulsar token
          ansible.builtin.include_tasks: ../tasks/pulsar-token.yml
          vars:
            tesp_pulsar_token_file: "{{ out.path }}/pulsar_token"

        - name: Remember the first token
          ansible.builtin.set_fact:
            first_pulsar_token: "{{ pulsar_token }}"

        - name: Run the token tasks again, as a re-run of the playbook does
          ansible.builtin.include_tasks: ../tasks/pulsar-token.yml
          vars:
            tesp_pulsar_token_file: "{{ out.path }}/pulsar_token"

        - name: Check the stored token file
          ansible.builtin.stat:
            path: "{{ out.path }}/pulsar_token"
          register: token_file

        - name: A re-run keeps the Pulsar token; the file is private
          ansible.builtin.assert:
            that:
              - first_pulsar_token | length >= 24
              - pulsar_token == first_pulsar_token
              - token_file.stat.mode == '0600'
            fail_msg: the Pulsar token changed on a re-run, or its file is readable by others

      always:
        - name: Remove output directory
          ansible.builtin.file:
            path: "{{ out.path }}"
            state: absent
