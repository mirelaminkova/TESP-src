---
# Renders every template with representative values and checks what ends up
# where. Runs locally without root, Docker or the SRC roles:
#
#   ansible-playbook -i localhost, -c local tests/render-templates.yml
#
# The rendered files go to a temporary directory that is removed afterwards.
- name: Render templates and check them
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    workspace_fqdn: tesp.example.src.surf-hosted.nl
    fact_co_groups: {src_co_admin: test-co-admins}
    src_pulsar_storage_path: ""
    templates_dir: "{{ playbook_dir }}/../templates"
  tasks:
    # Test values only. Set as host facts, like playbook.yml does, so they
    # show up in hostvars the way the real secrets do.
    - name: Set test secrets
      ansible.builtin.set_fact:
        pulsar_token: test-pulsar-token-7Hq2
        tesp_basic_auth_password: test-tes-password-K9xw
        # Stands in for any other secret that a variable dump would leak.
        test_unlisted_secret: test-unlisted-secret-Zp4m
        # S3 component parameters, as SRC passes them. The secret has
        # characters that must be escaped in TOML.
        src_s3_endpoint_url: https://s3.example.org
        src_s3_access_key_id: test-s3-access-key-Qe3r
        src_s3_secret_access_key: test-s3-secret/Jw8+"\\

    - name: Create output directory
      ansible.builtin.tempfile:
        state: directory
        suffix: tesp-render
      register: out

    - name: Render, check, clean up
      block:
        - name: Render templates
          ansible.builtin.template:
            src: "{{ templates_dir }}/{{ item }}"
            dest: >-
              {{ out.path }}/{{ item | basename | regex_replace('\.j2$', '') }}
            mode: '0600'
          loop:
            - welcome.html
            - chrony.conf
            - pulsar-firewall.sh.j2
            - pulsar-firewall.service.j2
            - tesp-api/docker-compose.yml.j2
            - tesp-api/pulsar-token-proxy.conf.j2
            - tesp-api/settings.toml.j2
            - tesp-api/secrets.toml.j2

        - name: Read rendered files
          ansible.builtin.slurp:
            src: "{{ out.path }}/{{ item }}"
          loop:
            - welcome.html
            - pulsar-firewall.sh
            - pulsar-token-proxy.conf
            - settings.toml
            - secrets.toml
            - docker-compose.yml
          register: rendered

        - name: Index rendered files by name
          ansible.builtin.set_fact:
            files: >-
              {{ files | default({})
                 | combine({item.item: item.content | b64decode}) }}
          loop: "{{ rendered.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Welcome page shows the TES credentials but no other secrets
          ansible.builtin.assert:
            that:
              - pulsar_token not in files['welcome.html']
              - test_unlisted_secret not in files['welcome.html']
              - tesp_basic_auth_password in files['welcome.html']
              - workspace_fqdn in files['welcome.html']
              - tesp_api_version in files['welcome.html']
            fail_msg: welcome.html leaks a secret or lost connection details

        # Catches secrets the test doesn't know about (e.g. future S3
        # credentials) if a variable dump is added back.
        - name: Welcome page template doesn't dump variables
          ansible.builtin.assert:
            that:
              - "'hostvars' not in welcome_src"
              - "'to_nice_json' not in welcome_src"
              - "'to_json' not in welcome_src"
          vars:
            welcome_src: "{{ lookup('file', templates_dir ~ '/welcome.html') }}"

        - name: Pulsar token goes only to the proxy, TES password to tesp-api
          ansible.builtin.assert:
            that:
              - pulsar_token in files['pulsar-token-proxy.conf']
              - pulsar_token not in files['settings.toml']
              - tesp_basic_auth_password in files['settings.toml']

        - name: S3 key pair goes only to the secrets file
          ansible.builtin.assert:
            that:
              - tesp_s3_secret_access_key == src_s3_secret_access_key
              - ('s3.access_key_id = ' ~ src_s3_access_key_id | to_json)
                in files['secrets.toml']
              - ('s3.secret_access_key = ' ~ src_s3_secret_access_key | to_json)
                in files['secrets.toml']
              - src_s3_secret_access_key not in files['welcome.html']
              - src_s3_secret_access_key not in files['settings.toml']
              - src_s3_secret_access_key not in files['docker-compose.yml']
              - src_s3_access_key_id not in files['settings.toml']
              - ('s3.endpoint_url = "' ~ src_s3_endpoint_url ~ '"')
                in files['settings.toml']
              - (tesp_secrets_file ~ ':/app/.secrets.toml:ro')
                in files['docker-compose.yml']
            fail_msg: S3 key pair missing from secrets.toml or leaked elsewhere

        # The {placeholders} are filled in by tesp-api, so they must reach
        # settings.toml as written.
        - name: Resource settings reach settings.toml with placeholders intact
          ansible.builtin.assert:
            that:
              - >-
                'pulsar.native_specification.cpu_cores = '
                ~ '"--cpus-per-task={cpu_cores}"' in files['settings.toml']
              - >-
                'pulsar.native_specification.ram_gb = "--mem={ram_mib}"'
                in files['settings.toml']
              - >-
                'container.resource_limits = "auto"'
                in files['settings.toml']

        # The keys load_status_polling reads in the pinned tesp-api. max_polls
        # is deprecated there and would log a warning at startup.
        - name: Status polling settings reach settings.toml, max_polls doesn't
          ansible.builtin.assert:
            that:
              - files['settings.toml'] is search(key_re ~ 'poll_interval = ')
              - >-
                files['settings.toml']
                is search(key_re ~ 'max_poll_interval = ')
              - >-
                files['settings.toml']
                is search(key_re ~ 'error_retry_seconds = ')
              - >-
                'pulsar.status.max_wait_seconds = 0' in files['settings.toml']
              - files['settings.toml'] is not search(key_re ~ 'max_polls\\s*=')
              - "'id=\"max-wait\"' not in files['welcome.html']"
          vars:
            key_re: '(?m)^\s*pulsar\.status\.'

        - name: Render with a task runtime cap
          ansible.builtin.template:
            src: "{{ templates_dir }}/{{ item }}"
            dest: >-
              {{ out.path }}/capped-{{ item | basename
                                       | regex_replace('\.j2$', '') }}
            mode: '0600'
          loop:
            - tesp-api/settings.toml.j2
            - welcome.html
          vars:
            tesp_max_wait_seconds: 86400

        - name: The cap reaches settings.toml and the welcome page
          ansible.builtin.assert:
            that:
              - >-
                'pulsar.status.max_wait_seconds = 86400'
                in lookup('file', out.path ~ '/capped-settings.toml')
              - >-
                '<span id="max-wait">86400</span>'
                in lookup('file', out.path ~ '/capped-welcome.html')

        # gather_facts is off; the group_vars templates read these facts
        # lazily, so task vars stand in for them.
        - name: SLURM node and memory settings follow the node's facts
          ansible.builtin.assert:
            that:
              - slurm_nodes[0].CPUs | int == 8
              - slurm_nodes[0].RealMemory | int == 16000 - 2048
              - slurm_config.SelectTypeParameters == 'CR_CPU_Memory'
              - slurm_config.DefMemPerCPU | int == (16000 - 2048) // 8
          vars:
            ansible_facts:
              processor_vcpus: 8
              processor_nproc: 8
              memtotal_mb: 16000

        - name: SLURM gets online CPUs and at least half of a small node
          ansible.builtin.assert:
            that:
              - slurm_nodes[0].RealMemory | int == 1500
              - slurm_nodes[0].CPUs | int == 1
          vars:
            ansible_facts:
              processor_vcpus: 2
              processor_nproc: 1
              memtotal_mb: 3000

        - name: Firewall script guards the Pulsar port
          ansible.builtin.assert:
            that:
              - ('--dport ' ~ pulsar_port) in files['pulsar-firewall.sh']

        - name: Firewall script is valid sh
          ansible.builtin.command: sh -n {{ out.path }}/pulsar-firewall.sh
          changed_when: false

      always:
        - name: Remove output directory
          ansible.builtin.file:
            path: "{{ out.path }}"
            state: absent
