---
# Renders every template with representative values and checks what ends up
# where. Runs locally without root, Docker or the SRC roles:
#
#   ansible-playbook -i localhost, -c local tests/render-templates.yml
#
# The rendered files go to a temporary directory that is removed afterwards.
- name: Render templates and check them
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    workspace_fqdn: tesp.example.src.surf-hosted.nl
    fact_co_groups: {src_co_admin: test-co-admins}
    src_pulsar_storage_path: ""
    templates_dir: "{{ playbook_dir }}/../templates"
    # Set by playbook.yml from the rendered proxy config.
    tesp_pulsar_proxy_conf_checksum: test-proxy-conf-sha256-4f1c
    # playbook.yml itself, for the checks of its tasks.
    plays: "{{ lookup('file', playbook_dir ~ '/../playbook.yml') | from_yaml }}"
    # Issue #8: the secrets, and the files that hold them. secret_var_re
    # matches a secret variable's own name only (not tesp_pulsar_token_file).
    secret_var_re: \b(pulsar_token|tesp_basic_auth_password|tesp_s3_secret_access_key)\b
    secret_re: >-
      pulsar_token|tesp_basic_auth_password|tesp_s3_secret_access_key|pulsar-token-proxy\.conf|settings\.toml|secrets\.toml
  tasks:
    # Test values only. Set as host facts, like playbook.yml does, so they
    # show up in hostvars the way the real secrets do.
    - name: Set test secrets
      ansible.builtin.set_fact:
        pulsar_token: test-pulsar-token-7Hq2
        tesp_basic_auth_password: test-tes-password-K9xw
        # Stands in for any other secret that a variable dump would leak.
        test_unlisted_secret: test-unlisted-secret-Zp4m
        # S3 component parameters, as SRC passes them. The secret has
        # characters that must be escaped in TOML.
        src_s3_endpoint_url: https://s3.example.org
        src_s3_access_key_id: test-s3-access-key-Qe3r
        src_s3_secret_access_key: test-s3-secret/Jw8+"\\
        # Given as an s3:// URL; the playbook keeps just the bucket name.
        src_s3_bucket: ' s3://tesp-test-bucket/ '
        # Set by playbook.yml: the first deploy, kept across redeploys.
        tesp_first_deploy_time: '2026-11-18T09:30:00Z'
        # Set by playbook.yml from the rendered gateway.conf.
        tesp_gateway_conf_checksum: 0123abcd
        # Set by tasks/tesp-api-config.yml from the files it writes.
        tesp_settings_checksum: 1111aaaa
        tesp_s3_keys_checksum: 2222bbbb

    - name: Create output directory
      ansible.builtin.tempfile:
        state: directory
        suffix: tesp-render
      register: out

    - name: Render, check, clean up
      block:
        - name: Render templates
          ansible.builtin.template:
            src: "{{ templates_dir }}/{{ item }}"
            dest: >-
              {{ out.path }}/{{ item | basename | regex_replace('\.j2$', '') }}
            mode: '0600'
          loop:
            - welcome.html
            - chrony.conf
            - pulsar-firewall.sh.j2
            - pulsar-firewall.service.j2
            - task-fence.sh.j2
            - task-fence.service.j2
            - pulsar-uwsgi-socket.conf.j2
            - tesp-api/docker-compose.yml.j2
            - tesp-api/pulsar-token-proxy.conf.j2
            - tesp-api/settings.toml.j2
            - tesp-api/secrets.toml.j2
            - tesp-api/gateway.conf.j2
            - tesp-api/service-info.json.j2
            - tesp-api/validator.json.j2

        - name: Read rendered files
          ansible.builtin.slurp:
            src: "{{ out.path }}/{{ item }}"
          loop:
            - welcome.html
            - pulsar-firewall.sh
            - task-fence.sh
            - task-fence.service
            - pulsar-uwsgi-socket.conf
            - pulsar-token-proxy.conf
            - settings.toml
            - secrets.toml
            - docker-compose.yml
            - gateway.conf
            - service-info.json
          register: rendered

        - name: Index rendered files by name
          ansible.builtin.set_fact:
            files: >-
              {{ files | default({})
                 | combine({item.item: item.content | b64decode}) }}
          loop: "{{ rendered.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Welcome page shows the TES credentials but no other secrets
          ansible.builtin.assert:
            that:
              - pulsar_token not in files['welcome.html']
              - test_unlisted_secret not in files['welcome.html']
              - tesp_basic_auth_password in files['welcome.html']
              - workspace_fqdn in files['welcome.html']
              - tesp_api_version in files['welcome.html']
            fail_msg: welcome.html leaks a secret or lost connection details

        # Each value the nextflow-tesp-src catalog item asks for has its own
        # copy field, hinted with its form label and parameter key.
        - name: Welcome page has copy fields for the Nextflow workspace
          ansible.builtin.assert:
            that:
              - tesp_s3_bucket == 'tesp-test-bucket'
              - >-
                ('id="field-tes-url">https://' ~ workspace_fqdn ~ '/tes<')
                in files['welcome.html']
              - "'id=\"field-tes-username\">tes<' in files['welcome.html']"
              - >-
                ('id="field-tes-password">' ~ tesp_basic_auth_password ~ '<')
                in files['welcome.html']
              - >-
                ('id="field-fqdn">' ~ workspace_fqdn ~ '<')
                in files['welcome.html']
              - >-
                'id="field-nf-workdir">s3://tesp-test-bucket/work<'
                in files['welcome.html']
              - "'id=\"field-s3-bucket\"' not in files['welcome.html']"
              - >-
                '<small>Paste TESP URL · src_tes_endpoint</small>'
                in files['welcome.html']
              - "'<small>src_tes_username</small>' in files['welcome.html']"
              - >-
                '<small>Write the TES password · src_tes_password</small>'
                in files['welcome.html']
              - >-
                '<small>S3 bucket resource · src_nf_workdir</small>'
                in files['welcome.html']
              - "'<small>src_s3_endpoint_url</small>' in files['welcome.html']"
              - "'<small>src_s3_region</small>' in files['welcome.html']"
              - >-
                'href="https://github.com/mirelaminkova/nextflow-tesp-src"'
                in files['welcome.html']
              - >-
                ('id="field-s3-endpoint">' ~ src_s3_endpoint_url ~ '<')
                in files['welcome.html']
              - "\"workDir = 's3://tesp-test-bucket/work'\" in files['welcome.html']"
              - "\"endpoint = 'https://s3.example.org'\" in files['welcome.html']"
              - "'id=\"s3-no-keys\"' not in files['welcome.html']"
              - "'s3PathStyleAccess = true' in files['welcome.html']"
              - "'id=\"field-s3-region\">us-east-1<' in files['welcome.html']"
            fail_msg: welcome.html lacks a copy field or the S3 work directory

        - name: Render the welcome page without S3 settings
          ansible.builtin.template:
            src: "{{ templates_dir }}/welcome.html"
            dest: "{{ out.path }}/no-s3-welcome.html"
            mode: '0600'
          # The src_s3_* test values are facts, which beat task vars, so
          # override what group_vars derives from them.
          vars:
            tesp_s3_bucket: ''
            tesp_s3_endpoint_url: ''
            tesp_s3_access_key_id: ''

        - name: Without S3 settings the page says so and shows no workDir
          ansible.builtin.assert:
            that:
              - "'id=\"field-nf-workdir\"' not in page"
              - "'workDir' not in page"
              - "'aws {' not in page"
              - "'id=\"s3-unset\"' in page"
              - "'id=\"s3-no-keys\"' not in page"
          vars:
            page: "{{ lookup('file', out.path ~ '/no-s3-welcome.html') }}"

        # SRC passes the CO admins as a list.
        - name: Render the welcome page with a list of admins
          ansible.builtin.template:
            src: "{{ templates_dir }}/welcome.html"
            dest: "{{ out.path }}/admins-welcome.html"
            mode: '0600'
          vars:
            fact_co_groups: {src_co_admin: [alice, bob]}

        - name: Admins are listed by name, not as a Python list
          ansible.builtin.assert:
            that:
              - "'<strong>Admins:</strong> alice, bob</li>' in page"
              - "'test-co-admins</li>' in files['welcome.html']"
          vars:
            page: "{{ lookup('file', out.path ~ '/admins-welcome.html') }}"

        - name: Render the welcome page with an endpoint but no bucket or keys
          ansible.builtin.template:
            src: "{{ templates_dir }}/welcome.html"
            dest: "{{ out.path }}/endpoint-only-welcome.html"
            mode: '0600'
          vars:
            tesp_s3_bucket: ''
            tesp_s3_access_key_id: ''
            tesp_s3_addressing_style: virtual

        - name: Endpoint only gives an aws block without workDir or path style
          ansible.builtin.assert:
            that:
              - "'aws {' in page"
              - "\"endpoint = 'https://s3.example.org'\" in page"
              - "'workDir' not in page"
              - "'s3PathStyleAccess' not in page"
              - "'id=\"field-nf-workdir\"' not in page"
              - "'id=\"s3-no-keys\"' in page"
          vars:
            page: "{{ lookup('file', out.path ~ '/endpoint-only-welcome.html') }}"

        # What SRC passed on a failed deploy: a bucket with a prefix, the
        # form nextflow-tesp-src's src_nf_workdir takes.
        - name: A prefix after the bucket becomes the work directory
          ansible.builtin.assert:
            that:
              - tesp_s3_bucket == 'nextflow-tesp'
              - tesp_s3_prefix == 'test/run1'
              - tesp_s3_workdir == 's3://nextflow-tesp/test/run1'
              - tesp_s3_bucket is match(tesp_s3_bucket_re)
              - tesp_s3_prefix is match(tesp_s3_prefix_re)
          vars:
            tesp_s3_location: nextflow-tesp/test/run1

        - name: Without a prefix the work directory is <bucket>/work
          ansible.builtin.assert:
            that:
              - tesp_s3_prefix == ''
              - tesp_s3_workdir == 's3://tesp-test-bucket/work'

        - name: Render the welcome page with a bucket prefix
          ansible.builtin.template:
            src: "{{ templates_dir }}/welcome.html"
            dest: "{{ out.path }}/prefix-welcome.html"
            mode: '0600'
          vars:
            tesp_s3_location: nextflow-tesp/test

        - name: The page uses the prefix as the work directory
          ansible.builtin.assert:
            that:
              - "'id=\"field-nf-workdir\">s3://nextflow-tesp/test<' in page"
              - "\"workDir = 's3://nextflow-tesp/test'\" in page"
              - "'s3://nextflow-tesp/test/work' not in page"
          vars:
            page: "{{ lookup('file', out.path ~ '/prefix-welcome.html') }}"

        - name: Prefixes are checked before they reach the welcome page
          ansible.builtin.assert:
            that:
              - "'work' is match(tesp_s3_prefix_re)"
              - "'a/b_c/d.e-f' is match(tesp_s3_prefix_re)"
              - "'' is not match(tesp_s3_prefix_re)"
              - "'/x' is not match(tesp_s3_prefix_re)"
              - "'a//b' is not match(tesp_s3_prefix_re)"
              - "'a b' is not match(tesp_s3_prefix_re)"
              - "\"a'b\" is not match(tesp_s3_prefix_re)"
              - "'a\\n' is not match(tesp_s3_prefix_re)"

        - name: Bucket names are checked before they reach the welcome page
          ansible.builtin.assert:
            that:
              - "'tesp-test-bucket' is match(tesp_s3_bucket_re)"
              - "'my.bucket-01' is match(tesp_s3_bucket_re)"
              - "'Nextflow_TESP' is not match(tesp_s3_bucket_re)"
              - "'my_bucket' is not match(tesp_s3_bucket_re)"
              - "'bucket-' is not match(tesp_s3_bucket_re)"
              - "'' is not match(tesp_s3_bucket_re)"
              - "'a b' is not match(tesp_s3_bucket_re)"
              - "'bucket/prefix' is not match(tesp_s3_bucket_re)"
              - "'<script>' is not match(tesp_s3_bucket_re)"
              - "'-bucket' is not match(tesp_s3_bucket_re)"
              - "'ab' is not match(tesp_s3_bucket_re)"
              - "'abc' is match(tesp_s3_bucket_re)"
              - "('a' * 63) is match(tesp_s3_bucket_re)"
              - "('a' * 64) is not match(tesp_s3_bucket_re)"
              - "'abc\\n' is not match(tesp_s3_bucket_re)"

        # Catches secrets the test doesn't know about (e.g. future S3
        # credentials) if a variable dump is added back.
        - name: Welcome page template doesn't dump variables
          ansible.builtin.assert:
            that:
              - "'hostvars' not in welcome_src"
              - "'to_nice_json' not in welcome_src"
              - "'to_json' not in welcome_src"
          vars:
            welcome_src: "{{ lookup('file', templates_dir ~ '/welcome.html') }}"

        # Issue #29: base64 tokens have +, / and =. Pulsar decodes the query
        # string, so an unencoded + arrives as a space and every request fails.
        # A fact, as in playbook.yml (task vars can't override facts).
        - name: Use a base64 Pulsar token
          ansible.builtin.set_fact:
            plain_pulsar_token: "{{ pulsar_token }}"
            pulsar_token: a+b/c=d+/==

        - name: Render the Pulsar proxy with a base64 token
          ansible.builtin.template:
            src: "{{ templates_dir }}/tesp-api/pulsar-token-proxy.conf.j2"
            dest: "{{ out.path }}/b64-pulsar-token-proxy.conf"
            mode: '0600'

        - name: Restore the test Pulsar token
          ansible.builtin.set_fact:
            pulsar_token: "{{ plain_pulsar_token }}"

        - name: The token survives the query string, alone and after other args
          ansible.builtin.assert:
            that:
              - query_values | length == 2
              # urldecode is unquote_plus, as Pulsar's parse_qs: a raw +
              # would read as a space.
              - query_values | map('urldecode') | unique == ['a+b/c=d+/==']
            fail_msg: "token in the query string: {{ query_values }}"
          vars:
            conf: "{{ lookup('file', out.path ~ '/b64-pulsar-token-proxy.conf') }}"
            query_values: >-
              {{ conf | regex_findall('private_token=([^";]*)') }}
        # Issue #25: the gateway answers service-info itself, with values
        # the ELIXIR Cloud Registry accepts.
        - name: Service info is valid JSON with our values
          ansible.builtin.assert:
            that:
              - info.id == 'nl.surf-hosted.src.example.tesp.tes'
              - info.name == 'TESP on SURF Research Cloud'
              - >-
                info.type == {'group': 'org.ga4gh', 'artifact': 'tes',
                              'version': '1.0.0'}
              - info.environment == 'test'
              - info.organization.name == 'SURF'
              - info.organization.url == 'https://www.surf.nl/'
              - >-
                info.contactUrl
                == 'https://github.com/mirelaminkova/TESP-src/issues'
              - >-
                info.documentationUrl
                == 'https://github.com/mirelaminkova/TESP-src#readme'
              - info.version == 'tesp-api-' ~ tesp_api_version[:7]
              - info.createdAt == '2026-11-18T09:30:00Z'
              # Left out, so a redeploy doesn't change the file.
              - "'updatedAt' not in info"
              - "'Masaryk' not in files['service-info.json']"
            fail_msg: "service-info.json: {{ files['service-info.json'] }}"
          vars:
            info: "{{ files['service-info.json'] | from_json }}"

        - name: Welcome page shows the public service-info call
          ansible.builtin.assert:
            that:
              - >-
                ('<pre id="tes-info">curl https://' ~ workspace_fqdn
                 ~ '/tes/v1/service-info</pre>') in files['welcome.html']
              - "'<code id=\"service-env\">test</code>' in files['welcome.html']"

        - name: Gateway fronts tesp-api, which has no host port
          ansible.builtin.assert:
            that:
              - "'ports' not in compose.services['tesp-api']"
              - >-
                compose.services.gateway.ports
                == ['127.0.0.1:' ~ tesp_api_port ~ ':8080']
              - compose.services.gateway.container_name == 'tesp-gateway'
              - compose.services.gateway.image is search('@sha256:[0-9a-f]{64}$')
              - compose.services['pulsar-proxy'].image == compose.services.gateway.image
              - >-
                (tesp_gateway_dir ~ ':/etc/nginx/conf.d:ro')
                in compose.services.gateway.volumes
              - "'tesp-api' in compose.services.gateway.depends_on"
              # Issue #44: the stack's network is pinned, so the gateway can
              # trust X-Real-IP from its gateway address alone.
              - >-
                compose.networks.default.ipam.config
                == [{'subnet': '172.16.97.0/25', 'gateway': '172.16.97.1'}]
              - "'auth' not in compose.networks"
              # A changed config recreates the container.
              - >-
                compose.services.gateway.labels['tesp.gateway-config-checksum']
                == '0123abcd'
              # Outside the image build context, like the secrets file.
              - not tesp_gateway_dir.startswith(tesp_install_dir)
              - >-
                nginx_reverse_proxy_locations
                | selectattr('name', '==', 'tes') | map(attribute='proxy_pass')
                | first == 'http://127.0.0.1:' ~ tesp_api_port ~ '/'
          vars:
            compose: "{{ files['docker-compose.yml'] | from_yaml }}"

        - name: Gateway serves service-info and proxies the rest to tesp-api
          ansible.builtin.assert:
            that:
              - "'location = /v1/service-info {' in conf"
              - "'location = /v1/service-info/ {' in conf"
              - "'rewrite ^ /v1/service-info last;' in conf"
              # Re-resolved, so a recreated tesp-api container is found.
              - "'resolver 127.0.0.11' in conf"
              - "'set $tesp_api_upstream http://tesp-api:8080;' in conf"
              # The API docs stay public.
              - "'|swagger-ui\\\\.html|redoc|openapi\\\\.json|' in conf"
              - conf.count('proxy_pass $tesp_api_upstream;') == 2
              # Never the decoded $uri: it would pass %0d%0a on as a line break.
              - conf is not search('proxy_pass [^;]*\\$uri')
              # Requests without Basic credentials get 401 at the gateway.
              - "'if ($tes_has_basic = 0)' in conf"
              - "'add_header Allow \"GET, HEAD\" always;' in conf"
              # The gateway adds no credentials; only the public locations
              # drop them.
              - conf is not search('proxy_set_header Authorization \\$')
              - conf.count('proxy_set_header Authorization') == 1
              - tesp_basic_auth_password not in conf
              - tesp_basic_auth_password not in files['service-info.json']
          vars:
            conf: "{{ files['gateway.conf'] }}"

        - name: Render service info with characters JSON must escape
          ansible.builtin.template:
            src: "{{ templates_dir }}/tesp-api/service-info.json.j2"
            dest: "{{ out.path }}/escaped-service-info.json"
            mode: '0600'
          vars:
            tesp_service_info_name: 'TESP "demo" \ <b>'
            tesp_service_info_description: "two\nlines"

        - name: Service info stays valid JSON
          ansible.builtin.assert:
            that:
              - info.name == 'TESP "demo" \ <b>'
              - info.description == "two\nlines"
          vars:
            info: "{{ lookup('file', out.path ~ '/escaped-service-info.json') | from_json }}"

        # The welcome page shows the Basic password, so it must stay behind
        # SRAM even when the TES API is open to tokens.
        - name: The welcome page is SRAM-only, the TES API is not
          ansible.builtin.assert:
            that:
              - about.auth == 'sram'
              - about.location == '=/'
              - tes.auth == 'noauth'
          vars:
            about: >-
              {{ nginx_reverse_proxy_locations | selectattr('name', '==', 'about') | first }}
            tes: >-
              {{ nginx_reverse_proxy_locations | selectattr('name', '==', 'tes') | first }}

        # Issue #26: without tokens the gateway and the page are as before.
        - name: With OAuth off there is no validator
          ansible.builtin.assert:
            that:
              # No CORS origins configured: no CORS headers.
              - "'Access-Control' not in files['gateway.conf']"
              - "'validator' not in compose.services"
              - "'auth_request' not in files['gateway.conf']"
              - "'id=\"oauth\"' not in files['welcome.html']"
              - "'tes.basicPassword' in files['welcome.html']"
              # Basic from anywhere, as before.
              - "'    default 1;' in files['gateway.conf']"
          vars:
            compose: "{{ files['docker-compose.yml'] | from_yaml }}"

        - name: Render the gateway with CORS and tokens off
          ansible.builtin.template:
            src: "{{ templates_dir }}/tesp-api/gateway.conf.j2"
            dest: "{{ out.path }}/cors-basic-gateway.conf"
            mode: '0600'
          vars:
            src_tes_cors_origins: https://krini.rahtiapp.fi

        # Tokens off, no sources: Basic from everyone, but nobody exempt
        # from the rate limit (the Basic geo defaults to 1 there).
        - name: With tokens off and no sources, the rate geo exempts no one
          ansible.builtin.assert:
            that:
              - conf is search('geo \\$tes_basic_source \\{\\s+default 1;')
              - conf is search('geo \\$tes_rate_exempt \\{\\s+default 0;\\s+\\}')
          vars:
            conf: "{{ lookup('file', out.path ~ '/cors-basic-gateway.conf') }}"

        - name: With tokens off, a request without Basic still gets the challenge
          ansible.builtin.assert:
            that:
              # The location's own error_page (429) must not drop the 401.
              - conf is search('error_page 429 = @rate_limited;\\s+error_page 401 = @unauthorized;')
          vars:
            conf: "{{ lookup('file', out.path ~ '/cors-basic-gateway.conf') }}"

        - name: With tokens off, CORS still covers the API and its errors
          ansible.builtin.assert:
            that:
              - "'if ($tes_cors_preflight) {' in conf"
              - "'auth_request' not in conf"
              # service-info, the public docs, /, the 401 and 429 locations.
              - conf.count('add_header Access-Control-Allow-Origin') == 5
              - "'Access-Control-Max-Age $tes_cors_max_age always;' in conf"
              - "'1        \"600\";' in conf"
          vars:
            conf: "{{ lookup('file', out.path ~ '/cors-basic-gateway.conf') }}"

        - name: Render with LS Login tokens on
          ansible.builtin.template:
            src: "{{ templates_dir }}/{{ item }}"
            dest: >-
              {{ out.path }}/oauth-{{ item | basename | regex_replace('\.j2$', '') }}
            mode: '0600'
          loop: &oauth_templates
            - welcome.html
            - tesp-api/gateway.conf.j2
            - tesp-api/validator.json.j2
            - tesp-api/docker-compose.yml.j2
          vars: &oauth_vars
            tesp_oauth_enabled: true
            tesp_validator_conf_checksum: 4567cdef
            # The default LS Login entry, filled from component parameters.
            src_tes_oauth_client_ids: krini-client, cli-client, protes-service
            src_tes_oauth_exempt_client_ids: protes-service
            src_tes_oauth_entitlement_prefixes: 'urn:example:ECP_CLN:'
            src_tes_oauth_exempt_audiences: tes.example.org
            src_tes_oauth_entitlements: urn:example:ECP_CLN:EOC-Compute#example.org
            # Basic only from the Nextflow workspace.
            src_tes_basic_auth_sources: 145.38.1.2
            src_tes_rate_exempt_sources: 192.0.2.7
            src_tes_cors_origins: https://krini.rahtiapp.fi

        - name: Tokens are checked by the validator; tesp-api gets Basic
          ansible.builtin.assert:
            that:
              - "'auth_request /_tes_auth;' in conf"
              - "'set $tes_validator_url http://validator:8081/auth;' in conf"
              - "'proxy_pass_request_body off;' in conf"
              # Only a valid token gets the injected credentials, and they
              # replace whatever the client sent.
              - "('bearer   \"Basic ' ~ basic_b64 ~ '\";') in conf"
              - "'default  $http_authorization;' in conf"
              - "'proxy_set_header Authorization $tes_upstream_authorization;' in conf"
              - "'auth_request_set $tes_auth_kind $upstream_http_x_tes_auth_kind;' in conf"
              # Public locations pass no credentials at all.
              - "'proxy_set_header Authorization \"\";' in conf"
              # Tokens decide here, not the Basic-only check.
              - "'if ($tes_has_basic = 0)' not in conf"
              - tesp_basic_auth_password not in conf
              # Exempt clients' task submissions go to the audit log too,
              # with the validator's answer, not the client's headers.
              - "'location = /v1/tasks {' in conf"
              - "'mirror /_tes_audit;' in conf"
              - "'proxy_set_header X-Tes-Auth-Exempt $tes_auth_exempt;' in conf"
              - "'if ($tes_auth_exempt != \"1\")' in conf"
              - "'if ($request_method != POST)' in conf"
              # Forged gateway headers never reach tesp-api.
              - conf.count('proxy_set_header X-Tes-Auth-Exempt \"\";') == 2
              - conf.count('auth_request /_tes_auth;') == 2
              # nginx copies the validator's challenge; not added twice.
              - "'tes_auth_challenge' not in conf"
              # Basic from elsewhere is refused before the validator.
              - "'if ($tes_basic_refused) {' in conf"
              - "'real_ip_header X-Real-IP;' in conf"
              # Only the stack networks' bridge addresses (issue #44).
              - conf.count('set_real_ip_from') == 2
              - "'set_real_ip_from 172.16.97.1/32;' in conf"
              - "'set_real_ip_from 172.16.97.129/32;' in conf"
              - "'geo $tes_basic_source {' in conf"
              # CORS for Krini (browser): the exact origin only, echoed;
              # preflights answered before any auth; headers on errors too.
              - "'\"https://krini.rahtiapp.fi\" $http_origin;' in conf"
              - "'Access-Control-Allow-Origin $tes_cors_origin always;' in conf"
              - "'Access-Control-Allow-Credentials' not in conf"
              - conf is not search('Allow-Origin[^;]*\\*')
              - "'if ($tes_cors_preflight) {' in conf"
              - >-
                conf.index('if ($tes_cors_preflight) {')
                < conf.index('auth_request /_tes_auth;')
              # Every client-facing location sends them (add_header in a
              # location replaces the server's): service-info, the public
              # docs, /, /v1/tasks and the four error locations. Not the
              # internal /_tes_auth and /_tes_audit, nor the rewrite.
              - conf.count('add_header Access-Control-Allow-Origin') == 8
              # The issuer can't be reached: 503, not a misleading 401.
              - "'error_page 500 = @auth_error;' in conf"
              # No required group: 403, with the CORS headers too.
              - "'error_page 403 = @forbidden;' in conf"
              - "'location @forbidden {' in conf"
              - "'error=\"insufficient_scope\"' in conf"
              # A stopped validator (no upstream status) is 503 as well.
              - "'if ($tes_auth_status ~ \"^(50[234])?$\") {' in conf"
              - "'~^50[234]' in conf"
              - conf is search('WWW-Authenticate .Basic realm')
          vars:
            conf: "{{ lookup('file', out.path ~ '/oauth-gateway.conf') }}"
            basic_b64: "{{ ('tes:' ~ tesp_basic_auth_password) | b64encode }}"

        # Issue #36: hardening from the review of #33.
        - name: The gateway clears its headers, limits rates, exposes headers
          ansible.builtin.assert:
            that:
              # None of the gateway's own headers come from a client.
              - "'proxy_set_header X-Tes-Auth-Kind \"\";' in conf"
              # Per real client address, on the protected locations, with a
              # JSON 429 that carries the CORS headers.
              # Excess requests are queued, not refused (no nodelay): a 429
              # aborts a Nextflow run (nf-ga4gh doesn't retry it).
              - conf is search('limit_req_zone \\$tes_rate_key zone=tes_per_ip:10m rate=20r/s;')
              - conf.count('limit_req zone=tes_per_ip burst=40 delay=20;') == 2
              - conf.count('limit_conn tes_conn_per_ip 32;') == 2
              # 6 x the default issuer timeout (10 s) + 10 (the 5 s slot wait and slack).
              - "'proxy_read_timeout 70s;' in conf"
              - conf is search('limit_conn_zone \\$tes_rate_key zone=tes_conn_per_ip:10m;')
              - "'nodelay' not in conf"
              # Allowlisted sources (Basic sources, src_tes_rate_exempt_sources)
              # aren't limited: an empty key is not counted.
              - "'geo $tes_rate_exempt {' in conf"
              - "'    145.38.1.2 1;' in conf"
              # src_tes_rate_exempt_sources in the rate geo, not the Basic one.
              - conf is search('geo \\$tes_rate_exempt \\{[^}]*192\\.0\\.2\\.7 1;')
              - conf is not search('geo \\$tes_basic_source \\{[^}]*192\\.0\\.2\\.7')
              - "'map $tes_rate_exempt $tes_rate_key {' in conf"
              # Not the Basic map: its default can be 1 (everyone).
              - conf is search('geo \\$tes_rate_exempt \\{\\s+default 0;')
              - >-
                conf is search('location @rate_limited \\{[^}]*add_header Retry-After 1 always;')
              - "'limit_req_status 429;' in conf"
              - "'error_page 429 = @rate_limited;' in conf"
              - "'location @rate_limited {' in conf"
              # Krini can read the challenge and Retry-After.
              - "'Access-Control-Expose-Headers $tes_cors_expose always;' in conf"
              - "'WWW-Authenticate, Retry-After' in conf"
          vars:
            conf: "{{ lookup('file', out.path ~ '/oauth-gateway.conf') }}"

        - name: The validator container is bounded
          ansible.builtin.assert:
            that:
              - compose.services.validator.pids_limit == 128
              - compose.services.validator.mem_limit == '256m'
              - tesp_gateway_trusted_proxies == ['172.16.97.1/32', '172.16.97.129/32']
          vars:
            compose: >-
              {{ lookup('file', out.path ~ '/oauth-docker-compose.yml') | from_yaml }}

        - name: The validator config has the issuers and no secrets
          ansible.builtin.assert:
            that:
              - config.basic_auth_enabled is true
              - config.audit_tag_keys == []
              - config.leeway_seconds == 60
              - config.issuers | length == 1
              - >-
                config.issuers[0] == {
                  'issuer': 'https://login.aai.lifescience-ri.eu/oidc/',
                  'allowed_client_ids': ['krini-client', 'cli-client',
                                         'protes-service'],
                  'exempt_client_ids': ['protes-service'],
                  'audiences': [],
                  'exempt_audiences': ['tes.example.org'],
                  'entitlements': {
                    'any_of': ['urn:example:ECP_CLN:EOC-Compute#example.org'],
                    'prefix_any_of': ['urn:example:ECP_CLN:']}}
              # Basic stays on: sources are set.
              - config.basic_auth_enabled is true
              - tesp_basic_auth_password not in lookup('file', path)
              - basic_b64 not in lookup('file', path)
              - pulsar_token not in lookup('file', path)
          vars:
            path: "{{ out.path }}/oauth-validator.json"
            config: "{{ lookup('file', path) | from_json }}"
            basic_b64: "{{ ('tes:' ~ tesp_basic_auth_password) | b64encode }}"

        - name: The validator runs locked down, reachable only by the gateway
          ansible.builtin.assert:
            that:
              - "'ports' not in validator"
              - validator.read_only is true
              - validator.cap_drop == ['ALL']
              - "'no-new-privileges:true' in validator.security_opt"
              - validator.build.context == tesp_validator_dir
              - not tesp_validator_dir.startswith(tesp_install_dir)
              - >-
                validator.volumes
                == [tesp_gateway_dir ~ '/validator:/etc/tes-validator:ro']
              - >-
                validator.labels['tesp.validator-config-checksum']
                == '4567cdef'
              - "'validator' in compose.services.gateway.depends_on"
              - "'/healthz' in validator.healthcheck.test | join(' ')"
              - "'environment' not in validator"
              # Only the gateway shares a network with the validator.
              - validator.networks == ['auth']
              - compose.services.gateway.networks == ['default', 'auth']
              - "'auth' in compose.networks"
              # Both networks are pinned (issue #44): Docker may forward the
              # published port to the gateway's address on either.
              - >-
                compose.networks.auth.ipam.config
                == [{'subnet': '172.16.97.128/25', 'gateway': '172.16.97.129'}]
              - compose.networks.default.ipam.config[0].subnet == '172.16.97.0/25'
          vars:
            compose: >-
              {{ lookup('file', out.path ~ '/oauth-docker-compose.yml') | from_yaml }}
            validator: "{{ compose.services.validator }}"

        - name: The page shows a Bearer example and the trade-off, no secrets
          ansible.builtin.assert:
            that:
              - "'id=\"oauth\"' in page"
              - >-
                ('<pre id="tes-bearer">curl -H "Authorization: Bearer $TOKEN" https://'
                 ~ workspace_fqdn ~ '/tes/v1/tasks</pre>') in page
              - "'No per-user task isolation.' in page"
              - "'HTTP Basic (only from 145.38.1.2) or an LS Login access token' in page"
              # Basic is still on, so its fields stay.
              - tesp_basic_auth_password in page
              - basic_b64 not in page
              - pulsar_token not in page
              - "'krini-client' not in page"
          vars:
            page: "{{ lookup('file', out.path ~ '/oauth-welcome.html') }}"
            basic_b64: "{{ ('tes:' ~ tesp_basic_auth_password) | b64encode }}"

        - name: Render with tokens only (Basic off)
          ansible.builtin.template:
            src: "{{ templates_dir }}/{{ item }}"
            dest: >-
              {{ out.path }}/bearer-{{ item | basename | regex_replace('\.j2$', '') }}
            mode: '0600'
          loop: *oauth_templates
          vars:
            <<: *oauth_vars
            # Tokens on and no Basic sources: Basic is off.
            src_tes_basic_auth_sources: ''
            tesp_oauth_ca_bundle: /etc/ssl/certs/ca-certificates.crt

        - name: With Basic off, nothing offers the password
          ansible.builtin.assert:
            that:
              - tesp_basic_auth_password not in page
              - "'id=\"field-tes-password\"' not in page"
              - "'tes.oauthToken' in page"
              - "'tes.basicPassword' not in page"
              - >-
                '<pre id="tes-get">curl -H "Authorization: Bearer $TOKEN" '
                in page
              - "'Basic realm' not in conf"
              # Every Basic request is refused at the gateway.
              - "'    default 0;' in conf"
              - (lookup('file', out.path ~ '/bearer-validator.json')
                 | from_json).basic_auth_enabled is false
              # A test issuer's CA, through the system bundle.
              - >-
                '/etc/ssl/certs:/etc/tes-validator-ca:ro'
                in compose.services.validator.volumes
              - >-
                compose.services.validator.environment
                == ['SSL_CERT_FILE=/etc/tes-validator-ca/ca-certificates.crt']
          vars:
            page: "{{ lookup('file', out.path ~ '/bearer-welcome.html') }}"
            conf: "{{ lookup('file', out.path ~ '/bearer-gateway.conf') }}"
            compose: >-
              {{ lookup('file', out.path ~ '/bearer-docker-compose.yml') | from_yaml }}

        - name: Pulsar token goes only to the proxy, TES password to tesp-api
          ansible.builtin.assert:
            that:
              - pulsar_token in files['pulsar-token-proxy.conf']
              - pulsar_token not in files['settings.toml']
              - tesp_basic_auth_password in files['settings.toml']

        - name: S3 key pair goes only to the secrets file
          ansible.builtin.assert:
            that:
              - tesp_s3_secret_access_key == src_s3_secret_access_key
              - ('s3.access_key_id = ' ~ src_s3_access_key_id | to_json)
                in files['secrets.toml']
              - ('s3.secret_access_key = ' ~ src_s3_secret_access_key | to_json)
                in files['secrets.toml']
              - src_s3_secret_access_key not in files['welcome.html']
              - src_s3_secret_access_key not in files['settings.toml']
              - src_s3_secret_access_key not in files['docker-compose.yml']
              - src_s3_access_key_id not in files['settings.toml']
              - ('s3.endpoint_url = "' ~ src_s3_endpoint_url ~ '"')
                in files['settings.toml']
              - (tesp_secrets_file ~ ':/app/.secrets.toml:ro')
                in files['docker-compose.yml']
            fail_msg: S3 key pair missing from secrets.toml or leaked elsewhere

        # The {placeholders} are filled in by tesp-api, so they must reach
        # settings.toml as written.
        - name: Resource settings reach settings.toml with placeholders intact
          ansible.builtin.assert:
            that:
              - >-
                'pulsar.native_specification.cpu_cores = '
                ~ '"--cpus-per-task={cpu_cores}"' in files['settings.toml']
              - >-
                'pulsar.native_specification.ram_gb = "--mem={ram_mib}"'
                in files['settings.toml']
              - >-
                'container.resource_limits = "auto"'
                in files['settings.toml']

        # The keys load_status_polling reads in the pinned tesp-api. max_polls
        # is deprecated there and would log a warning at startup.
        - name: Status polling settings reach settings.toml, max_polls doesn't
          ansible.builtin.assert:
            that:
              - files['settings.toml'] is search(key_re ~ 'poll_interval = ')
              - >-
                files['settings.toml']
                is search(key_re ~ 'max_poll_interval = ')
              - >-
                files['settings.toml']
                is search(key_re ~ 'error_retry_seconds = ')
              - >-
                'pulsar.status.max_wait_seconds = 0' in files['settings.toml']
              - files['settings.toml'] is not search(key_re ~ 'max_polls\\s*=')
              - "'id=\"max-wait\"' not in files['welcome.html']"
          vars:
            key_re: '(?m)^\s*pulsar\.status\.'

        - name: Render with a task runtime cap
          ansible.builtin.template:
            src: "{{ templates_dir }}/{{ item }}"
            dest: >-
              {{ out.path }}/capped-{{ item | basename
                                       | regex_replace('\.j2$', '') }}
            mode: '0600'
          loop:
            - tesp-api/settings.toml.j2
            - welcome.html
          vars:
            tesp_max_wait_seconds: 86400

        - name: The cap reaches settings.toml and the welcome page
          ansible.builtin.assert:
            that:
              - >-
                'pulsar.status.max_wait_seconds = 86400'
                in lookup('file', out.path ~ '/capped-settings.toml')
              - >-
                '<span id="max-wait">86400</span>'
                in lookup('file', out.path ~ '/capped-welcome.html')

        # gather_facts is off; the group_vars templates read these facts
        # lazily, so task vars stand in for them.
        - name: SLURM node and memory settings follow the node's facts
          ansible.builtin.assert:
            that:
              - slurm_nodes[0].CPUs | int == 8
              - slurm_nodes[0].RealMemory | int == 16000 - 2048
              - slurm_config.SelectTypeParameters == 'CR_CPU_Memory'
              - slurm_config.DefMemPerCPU | int == (16000 - 2048) // 8
              - slurm_config.EnforcePartLimits == 'ALL'
              # Run-time limits without cgroups (issue #13): see group_vars.
              - slurm_config.JobAcctGatherType == 'jobacct_gather/linux'
              - slurm_config.JobAcctGatherParams == 'OverMemoryKill,UsePss'
              - slurm_config.JobAcctGatherFrequency == 'task=10'
              # No cgroup plugins and no task/affinity: the role's defaults,
              # proctrack/pgid and no task plugin, stay.
              - slurm_config.ProctrackType is not defined
              - slurm_config.TaskPlugin is not defined
              - slurm_cgroup_config is not defined
          vars:
            ansible_facts:
              processor_vcpus: 8
              processor_nproc: 8
              memtotal_mb: 16000

        - name: SLURM gets online CPUs and at least half of a small node
          ansible.builtin.assert:
            that:
              - slurm_nodes[0].RealMemory | int == 1500
              - slurm_nodes[0].CPUs | int == 1
          vars:
            ansible_facts:
              processor_vcpus: 2
              processor_nproc: 1
              memtotal_mb: 3000

        # uwsgi logs each request's URL, and on a client that went away a
        # write error with the URL, both with private_token in it.
        - name: Pulsar logs no request URLs and its config isn't world-readable
          ansible.builtin.assert:
            that:
              - pulsar_uwsgi_options['disable-logging'] | default(false) | bool
              - pulsar_uwsgi_options['ignore-sigpipe'] | default(false) | bool
              - pulsar_uwsgi_options['ignore-write-errors'] | default(false) | bool
              - pulsar_uwsgi_options['disable-write-exception'] | default(false) | bool
              - (pulsar_group | default('')) == pulsar_user.name
            fail_msg: >-
              uwsgi would log private_token with request URLs, or Pulsar's
              config directory would be world-readable (#8)

        - name: Find the tasks and roles in playbook.yml and tasks/
          ansible.builtin.set_fact:
            playbook_tasks: >-
              {{ (plays | map(attribute='pre_tasks', default=[]) | list
                  + plays | map(attribute='tasks', default=[]) | list
                  + plays | map(attribute='post_tasks', default=[]) | list
                  + plays | map(attribute='handlers', default=[]) | list
                  + query('ansible.builtin.file',
                          *query('ansible.builtin.fileglob', playbook_dir ~ '/../tasks/*.yml'))
                    | map('from_yaml') | list)
                 | flatten(levels=1) }}
            playbook_roles: >-
              {{ plays | map(attribute='roles', default=[]) | flatten(levels=1) }}

        # -v prints facts and module results, --diff rendered files. A task
        # that sets, reads or writes a secret (by name, or through the
        # template it renders) must be no_log; a template may use diff: false
        # instead, which keeps its errors visible. file and stat never print
        # a file's content. An assert prints only its messages and the
        # expression text, never values, so one whose messages name no secret
        # needs neither (tasks/pulsar-token.yml).
        - name: Tasks that handle the Pulsar token or a password don't print it
          ansible.builtin.assert:
            that:
              - >-
                item.no_log | default(false) | bool
                or (template_src != '' and item.diff is defined and not item.diff)
                or item['ansible.builtin.file'] is defined
                or item['ansible.builtin.stat'] is defined
                or (item['ansible.builtin.assert'] is defined
                    and not ([item['ansible.builtin.assert'].fail_msg | default(''),
                              item['ansible.builtin.assert'].success_msg | default(''),
                              item['ansible.builtin.assert'].msg | default('')]
                             | join(' ') is search(secret_var_re)))
            fail_msg: >-
              {{ item.name }} handles a secret but isn't no_log (or, for a
              template, diff: false)
            quiet: true
          loop: "{{ playbook_tasks }}"
          loop_control:
            label: "{{ item.name }}"
          when: >-
            item | to_json is search(secret_re)
            or (template_src != ''
                and lookup('ansible.builtin.file', playbook_dir ~ '/../' ~ template_src)
                    is search(secret_var_re))
          vars:
            template_src: >-
              {{ (item['ansible.builtin.template'] | default({})).src | default('') }}

        # Only root (and, for 0640 files, the root group) may read a file that
        # holds the token or a password, by name or through the template that
        # renders it. The welcome page is the one exception, by design: it
        # shows the TES credentials to CO members, so nginx (www-data) serves
        # it, behind SRAM.
        - name: Files with the Pulsar token or a password aren't world-readable
          ansible.builtin.assert:
            that:
              - module.mode is defined
              - module.mode | string is match('^0?[0-7][0-7]0$')
              - module.owner | default('root') == 'root'
              - module.group | default('root') == 'root'
            fail_msg: "{{ item.name }} writes a secret with mode {{ module.mode | default('(unset)') }}"
            quiet: true
          loop: "{{ playbook_tasks }}"
          loop_control:
            label: "{{ item.name }}"
          when:
            - item['ansible.builtin.template'] is defined or item['ansible.builtin.copy'] is defined
            - template_src != 'templates/welcome.html'
            - >-
              item | to_json is search(secret_re)
              or (template_src != ''
                  and lookup('ansible.builtin.file', playbook_dir ~ '/../' ~ template_src)
                      is search(secret_var_re))
          vars:
            module: "{{ item['ansible.builtin.template'] | default(item['ansible.builtin.copy']) }}"
            template_src: >-
              {{ (item['ansible.builtin.template'] | default({})).src | default('') }}

        # pulsar_group makes the role create pulsar_root and every directory
        # under it 0750 root:pulsar or pulsar:pulsar: job data (staging holds
        # job scripts with presigned S3 URLs) is private to root and Pulsar.
        # The welcome page must not present it as something users can open.
        - name: The welcome page says the job store is private
          ansible.builtin.assert:
            that:
              - files['welcome.html'] is search('Job storage:</strong> <code>' ~ pulsar_root ~ '</code>, readable only by root and the Pulsar service user')
            fail_msg: >-
              the welcome page advertises {{ pulsar_root }} without saying that
              only root and the Pulsar user can read it (#8, pulsar_group)

        # Under --check on a host without the proxy config (upgraded from
        # before this change), stat has no checksum.
        - name: The proxy checksum has a value under --check
          ansible.builtin.assert:
            that:
              - checksum_fact | length == 1
              - >-
                checksum_fact[0]['ansible.builtin.set_fact'].tesp_pulsar_proxy_conf_checksum
                is search('ansible_check_mode')
            fail_msg: the proxy config checksum must default under --check only
          vars:
            checksum_fact: >-
              {{ plays | map(attribute='post_tasks', default=[]) | flatten(levels=1)
                 | map('to_json') | select('search', 'set_fact": [{]"tesp_pulsar_proxy_conf_checksum"')
                 | map('from_json') | list }}

        # tesp_install_dir is the tesp-api image's build context (COPY . .):
        # a file there that holds the token ends up in every image layer.
        - name: The Pulsar proxy config is outside the image build context
          ansible.builtin.assert:
            that:
              - not (tesp_pulsar_proxy_conf | dirname).startswith(tesp_install_dir)
              - (tesp_pulsar_proxy_conf ~ ':/etc/nginx/conf.d/default.conf:ro') in files['docker-compose.yml']
            fail_msg: >-
              pulsar-token-proxy.conf must live outside {{ tesp_install_dir }}
              (the image build context) and be what pulsar-proxy mounts (#8)

        - name: The Pulsar role doesn't show diffs
          ansible.builtin.assert:
            that:
              - pulsar_role | length == 1
              - pulsar_role[0].diff is defined
              - not pulsar_role[0].diff
            fail_msg: >-
              galaxyproject.pulsar must run with diff: false, or --diff prints
              app.yml with the Pulsar token (#8)
          vars:
            pulsar_role: >-
              {{ playbook_roles | select('mapping')
                 | selectattr('role', 'eq', 'galaxyproject.pulsar') | list }}

        - name: Generated config is bind-mounted from outside the build context
          ansible.builtin.assert:
            that:
              - (tesp_settings_file ~ ':/app/settings.toml:ro')
                in files['docker-compose.yml']
              - (tesp_secrets_file ~ ':/app/.secrets.toml:ro')
                in files['docker-compose.yml']
              - (tesp_pulsar_proxy_conf ~ ':/etc/nginx/conf.d/default.conf:ro')
                in files['docker-compose.yml']
              - not (tesp_settings_file is match(tesp_install_dir ~ '/'))
              - not (tesp_secrets_file is match(tesp_install_dir ~ '/'))
              - not (tesp_pulsar_proxy_conf is match(tesp_install_dir ~ '/'))
            fail_msg: >-
              a generated tesp-api config file is in tesp_install_dir, the
              image build context, or isn't mounted from tesp_secrets_dir

        - name: The tesp-api service carries the checksums of the config it reads
          ansible.builtin.assert:
            that:
              - >-
                compose.services['tesp-api'].labels
                == {'tesp.settings-checksum': '1111aaaa',
                    'tesp.s3-keys-checksum': '2222bbbb'}
          vars:
            compose: "{{ files['docker-compose.yml'] | from_yaml }}"

        # playbook.yml and tasks/*.yml: only the compose file may be
        # templated or copied into the build context. A guard against the
        # obvious mistake, not a proof: it reads blocks one level deep and
        # looks for tesp_install_dir by name; tests/tesp-api-config.yml and
        # the e2e image check test the behaviour.
        - name: Find the tasks in playbook.yml and tasks/, blocks included
          ansible.builtin.set_fact:
            build_context_tasks: >-
              {{ [top, top | map(attribute='block', default=[]),
                  top | map(attribute='rescue', default=[]),
                  top | map(attribute='always', default=[])]
                 | flatten(levels=2) }}
          vars:
            plays: "{{ lookup('file', playbook_dir ~ '/../playbook.yml') | from_yaml }}"
            task_files: >-
              {{ query('ansible.builtin.file', *query('ansible.builtin.fileglob',
                                                      playbook_dir ~ '/../tasks/*.yml'))
                 | map('from_yaml') | flatten(levels=1) }}
            top: >-
              {{ [plays | map(attribute='pre_tasks', default=[]),
                  plays | map(attribute='tasks', default=[]),
                  plays | map(attribute='post_tasks', default=[]),
                  [task_files]]
                 | flatten(levels=3) }}

        - name: The scan found the config tasks
          ansible.builtin.assert:
            that:
              - >-
                build_context_tasks | selectattr('name', 'defined')
                | selectattr('name', '==', 'Template TESP-API settings.toml')
                | list | length == 1
              - >-
                build_context_tasks | selectattr('name', 'defined')
                | selectattr('name', '==', 'Take createdAt from the previous service info')
                | list | length == 1

        - name: Only the compose file is written into the build context
          ansible.builtin.assert:
            that:
              - >-
                not (dest is search('tesp_install_dir'))
                or dest is search('/docker-compose\.deploy\.yml$')
            quiet: true
          loop: "{{ build_context_tasks }}"
          loop_control:
            label: "{{ item.name | default('(unnamed)') }}"
          when: module in item
          vars:
            module: >-
              {{ ('ansible.builtin.template' in item)
                 | ternary('ansible.builtin.template', 'ansible.builtin.copy') }}
            dest: "{{ item[module].dest | default('') }}"

        - name: Firewall script guards the Pulsar port
          ansible.builtin.assert:
            that:
              - ('--dport ' ~ pulsar_port) in files['pulsar-firewall.sh']

        - name: Firewall script is valid sh
          ansible.builtin.command: sh -n {{ out.path }}/pulsar-firewall.sh
          changed_when: false

        # Issue #45. tests/e2e/check-task-fence.sh checks what the rules do.
        - name: Task fence matches the Pulsar user and spares Pulsar's port
          ansible.builtin.assert:
            that:
              - ("TASK_USER=" ~ pulsar_user.name) in files['task-fence.sh']
              - ('--uid-owner "$TASK_USER"') in files['task-fence.sh']
              - ('-o $o -p tcp --sport ' ~ pulsar_port ~ ' -m conntrack --ctdir REPLY -j RETURN')
                in files['task-fence.sh']
              - ('for o in lo docker0 br-+') in files['task-fence.sh']
              - ('-o lo -p tcp --dport 6817 -j RETURN') in files['task-fence.sh']
              - "('RequiredBy=' ~ tesp_pulsar_unit ~ ' slurmd.service') in files['task-fence.service']"
              - "('Before=' ~ tesp_pulsar_unit ~ ' slurmd.service') in files['task-fence.service']"
              - tesp_pulsar_unit == 'pulsar.service'
              - "'After=ufw.service netfilter-persistent.service' in files['task-fence.service']"
              - "'for ipt in iptables ip6tables' in files['task-fence.sh']"
              - "'ExecStart=/usr/local/sbin/tesp-task-fence' in files['task-fence.service']"

        # Without a socket, uwsgi's HTTP router reaches its worker over TCP on
        # loopback, which the fence blocks for the Pulsar user: Pulsar answers
        # 502 to every request (found on the test bed).
        - name: Pulsar's uwsgi router reaches its worker over a unix socket
          ansible.builtin.assert:
            that:
              - pulsar_uwsgi_options.socket == tesp_pulsar_uwsgi_socket
              - pulsar_uwsgi_options['http-to'] == tesp_pulsar_uwsgi_socket
              - tesp_pulsar_uwsgi_socket is match('/run/pulsar/[^/]+$')
              - "'RuntimeDirectory=pulsar' in files['pulsar-uwsgi-socket.conf']"
              - pulsar_uwsgi_socket is not defined

        - name: The Pulsar user is in the docker group only for Docker tasks
          ansible.builtin.assert:
            that:
              - docker_users == []
              - tesp_container_type == 'singularity'

        # slurmctld caches each user's groups for about 10 minutes (measured
        # on the test bed): without a restart, new jobs keep the docker gid
        # that long after gpasswd. In this order, and never under --check.
        - name: SLURM forgets the docker group after gpasswd
          ansible.builtin.assert:
            that:
              - steps is subset(names)
              - names.index(steps[0]) < names.index(steps[1]) < names.index(steps[2])
                < names.index(steps[3]) < names.index(steps[4]) < names.index(steps[5])
              - "\"tesp_container_type != 'docker'\" in decide"
              - "'not ansible_check_mode' in decide"
              - "'(tesp_pulsar_docker_group is changed' in decide"
              - "'or tesp_pulsar_groups.stdout' in decide"
              - restart['ansible.builtin.systemd_service'].state == 'restarted'
              - restart['ansible.builtin.systemd_service'].name is search('slurmctld')
              - restart.when == 'tesp_refresh_slurm_groups | bool'
              - wait.when == 'tesp_refresh_slurm_groups | bool'
          vars:
            steps:
              - Take the Pulsar user out of the docker group
              - Check whether Pulsar still runs with the docker group
              - Decide whether SLURM must forget the Pulsar user's old groups
              - Make SLURM forget the Pulsar user's old groups
              - Wait for slurmctld after the restart
              - Restart Pulsar without the docker group
            tesp_play: >-
              {{ plays | selectattr('name', 'match', 'Install TESP') | first }}
            names: "{{ tesp_play.post_tasks | map(attribute='name') | list }}"
            by_name: "{{ dict(names | zip(tesp_play.post_tasks)) }}"
            decide: "{{ by_name[steps[2]]['ansible.builtin.set_fact'].tesp_refresh_slurm_groups }}"
            restart: "{{ by_name[steps[3]] }}"
            wait: "{{ by_name[steps[4]] }}"

        - name: Task fence renders a slurmctld port range as iptables needs it
          ansible.builtin.assert:
            that:
              - "'--dport 6817:6818 -j RETURN' in ranged"
          vars:
            ranged: >-
              {{ lookup('ansible.builtin.template', templates_dir ~ '/task-fence.sh.j2',
                        template_vars={'tesp_task_fence_loopback_tcp_ports': ['6817-6818']}) }}

        - name: Task fence script is valid sh
          ansible.builtin.command: sh -n {{ out.path }}/task-fence.sh
          changed_when: false

        # After the role that creates the Pulsar user (the rules name it),
        # before the stack whose tesp-api submits tasks.
        - name: The fence is applied before tesp-api starts
          ansible.builtin.assert:
            that:
              - post_task_names is search(fence_then_stack)
              - pulsar_role_in_roles
            fail_msg: >-
              playbook.yml must start tesp-task-fence in post_tasks (after the
              galaxyproject.pulsar role) and before the tesp-api stack
          vars:
            tesp_play: >-
              {{ plays | selectattr('name', 'match', 'Install TESP') | first }}
            post_task_names: >-
              |{{ tesp_play.post_tasks | map(attribute='name') | join('|') }}|
            fence_then_stack: >-
              \|Enable and start the task network fence\|.*\|Build and start the TESP-API stack\|
            pulsar_role_in_roles: >-
              {{ tesp_play.roles | select('mapping')
                 | selectattr('role', 'eq', 'galaxyproject.pulsar') | list | length == 1 }}

        # Issue #35: under --check, a host without a stored token (deployed
        # before #19) gets no file from copy, so file and slurp must not run,
        # and only a real --check (ansible_check_mode) may use the stand-in.
        - name: Run the token tasks under ansible-playbook --check
          ansible.builtin.command:
            # The same ansible-core as this run, whatever is on PATH.
            argv:
              - "{{ ansible_playbook_python }}"
              - -m
              - ansible.cli.playbook
              - --check
              - -i
              - localhost,
              - -c
              - local
              - "{{ playbook_dir }}/check-mode/pulsar-token.yml"
              - -e
              - "tesp_pulsar_token_file={{ out.path }}/check_mode_pulsar_token"
          register: check_mode_run
          changed_when: false
          failed_when: false

        - name: Look for a token file written in check mode
          ansible.builtin.stat:
            path: "{{ out.path }}/check_mode_pulsar_token"
          register: check_mode_token_file

        - name: Check mode uses a stand-in token and writes nothing
          ansible.builtin.assert:
            that:
              - check_mode_run.rc == 0
              - not check_mode_token_file.stat.exists
              # A normal run can't reach the stand-in (copy writes the file
              # first), so pin the guard itself.
              - >-
                (token_tasks | selectattr('name', 'eq', 'Set the Pulsar token') | first)
                ['ansible.builtin.set_fact'].pulsar_token
                is search("'check-mode-stand-in-token-not-stored' if ansible_check_mode else ''")
            fail_msg: >-
              the token tasks fail or write a file under --check when no token
              is stored yet (#35): rc={{ check_mode_run.rc }}
              {{ check_mode_run.stdout_lines | select('search', 'fatal|msg') | list }}
              {{ check_mode_run.stderr | default('') }}
          vars:
            token_tasks: "{{ lookup('file', playbook_dir ~ '/../tasks/pulsar-token.yml') | from_yaml }}"

        # Issue #35: the script that decides whether Pulsar runs with an older
        # config than the one on disk, run against a stub busctl.
        - name: Render the stale-config check, and variants for a missing config dir and unit
          ansible.builtin.template:
            src: "{{ templates_dir }}/pulsar-config-stale.sh.j2"
            dest: "{{ out.path }}/{{ item.name }}.sh"
            mode: '0700'
          vars:
            pulsar_config_dir: "{{ out.path }}/{{ item.dir }}"
            pulsar_systemd_service_name: "{{ item.unit }}"
          loop:
            - {name: pulsar-config-stale, dir: pulsar config, unit: pulsar}
            - {name: missing-dir, dir: no such dir, unit: pulsar}
            - {name: missing-unit, dir: pulsar config, unit: nosuch}
            - {name: masked-unit, dir: pulsar config, unit: masked}
          loop_control:
            label: "{{ item.name }}"

        - name: Run the stale-config check against stub busctl and systemctl
          ansible.builtin.shell: |
            set -eu
            mkdir -p "{{ out.path }}/bin" "{{ out.path }}/pulsar config"
            # busctl answers like systemd 249 on Ubuntu 22.04 (recorded on the
            # test bed), for pulsar.service; any other unit is not-found, as
            # LoadUnit reports it, and masked.service is masked. STARTED is in seconds, sent as microseconds
            # with a fraction; like systemd it is kept after the unit stops,
            # and 0 means never started.
            cat > "{{ out.path }}/bin/busctl" <<'STUB'
            #!/bin/sh
            sd=org.freedesktop.systemd1
            unit=/org/freedesktop/systemd1/unit
            case "$*" in
              "call $sd /org/freedesktop/systemd1 $sd.Manager LoadUnit s pulsar.service")
                echo "o \"$unit/pulsar_2eservice\"" ;;
              "call $sd /org/freedesktop/systemd1 $sd.Manager LoadUnit s masked.service")
                echo "o \"$unit/masked_2eservice\"" ;;
              "call $sd /org/freedesktop/systemd1 $sd.Manager LoadUnit s "*)
                echo "o \"$unit/other\"" ;;
              "get-property $sd $unit/pulsar_2eservice $sd.Unit LoadState") echo 's "loaded"' ;;
              "get-property $sd $unit/pulsar_2eservice $sd.Unit ActiveState") echo "s \"$STATE\"" ;;
              "get-property $sd $unit/pulsar_2eservice $sd.Unit ActiveEnterTimestamp")
                if [ "$STARTED" = 0 ]; then echo "t 0"; else echo "t ${STARTED}943052"; fi ;;
              "get-property $sd $unit/other $sd.Unit LoadState") echo 's "not-found"' ;;
              "get-property $sd $unit/masked_2eservice $sd.Unit LoadState") echo 's "masked"' ;;
              "get-property $sd $unit/masked_2eservice $sd.Unit ActiveState") echo 's "inactive"' ;;
              "get-property $sd $unit/masked_2eservice $sd.Unit ActiveEnterTimestamp") echo 't 0' ;;
              *) exit 3 ;;
            esac
            STUB
            # The script must not parse `systemctl show` output (local time).
            printf '#!/bin/sh\nexit 3\n' > "{{ out.path }}/bin/systemctl"
            chmod +x "{{ out.path }}/bin/busctl" "{{ out.path }}/bin/systemctl"
            # A fractional mtime, as real files have.
            touch -d @1700000000.5 "{{ out.path }}/pulsar config/app.yml"
            script="{{ out.path }}/pulsar-config-stale.sh"
            # run STATE STARTED [script]: the Pulsar unit state and start time (s)
            run() { STATE=$1 STARTED=$2 PATH="{{ out.path }}/bin:$PATH" bash "${3:-$script}"; }
            echo "config-older:$(run active 1700000100) same-second:$(run active 1700000000)" \
                 "config-newer:$(run active 1699999900) stopped:$(run inactive 1700000100)" \
                 "failed:$(run failed 1700000100) never-started:$(run inactive 0)" \
                 "no-dir:$(run active 1700000100 "{{ out.path }}/missing-dir.sh")" \
                 "no-unit:$(run inactive 0 "{{ out.path }}/missing-unit.sh")" \
                 "masked:$(run inactive 0 "{{ out.path }}/masked-unit.sh")"
          args:
            executable: /bin/bash
          register: stale_runs
          changed_when: false

        - name: Pulsar is stale unless it is active and newer than its config
          ansible.builtin.assert:
            that:
              - >-
                stale_runs.stdout == 'config-older:current same-second:stale config-newer:stale
                stopped:stale failed:stale never-started:stale no-dir:stale no-unit:missing masked:stale'
            fail_msg: "stale-config check gave {{ stale_runs.stdout }} (#35)"

        # Issue #35: under --check the shell would be skipped, and the
        # restart task needs its result. It only reads, so it runs anyway.
        - name: The stale-config check runs under --check
          ansible.builtin.assert:
            that:
              - check_task | length == 1
              - check_task[0].check_mode is defined and not check_task[0].check_mode
              - check_task[0]['ansible.builtin.shell'] is search('pulsar-config-stale[.]sh[.]j2')
              - restart_task | length == 1
              - >-
                restart_task[0].when | string
                == "tesp_pulsar_config_state.stdout == 'stale' or (tesp_pulsar_config_state.stdout == 'missing' and not ansible_check_mode)"
            fail_msg: >-
              under --check the stale-config check must still run (it only
              reads), and only --check may skip restarting a unit that systemd
              doesn't know yet (#35)
          vars:
            check_task: >-
              {{ plays | map(attribute='post_tasks', default=[]) | flatten(levels=1)
                 | map('to_json') | select('search', 'register": "tesp_pulsar_config_state')
                 | map('from_json') | list }}
            restart_task: >-
              {{ plays | map(attribute='post_tasks', default=[]) | flatten(levels=1)
                 | selectattr('name', 'eq', "Restart Pulsar if it doesn't run with its current config")
                 | list }}

        # Issue #9. Last: these replace the test pulsar_token fact set above.
        - name: Generate and store a Pulsar token
          ansible.builtin.include_tasks: ../tasks/pulsar-token.yml
          vars:
            tesp_pulsar_token_file: "{{ out.path }}/pulsar_token"

        - name: Remember the first token
          ansible.builtin.set_fact:
            first_pulsar_token: "{{ pulsar_token }}"

        - name: Run the token tasks again, as a re-run of the playbook does
          ansible.builtin.include_tasks: ../tasks/pulsar-token.yml
          vars:
            tesp_pulsar_token_file: "{{ out.path }}/pulsar_token"

        - name: Check the stored token file
          ansible.builtin.stat:
            path: "{{ out.path }}/pulsar_token"
          register: token_file

        - name: A re-run keeps the Pulsar token; the file is private
          ansible.builtin.assert:
            that:
              - first_pulsar_token is match('^[A-Za-z0-9]{32}$')
              - pulsar_token == first_pulsar_token
              - token_file.stat.mode == '0600'
            fail_msg: >-
              the Pulsar token isn't 32 letters and digits, changed on a
              re-run, or its file is readable by others

        # A token put in the file by hand may be base64, with + / =, in a
        # file with looser permissions. It is reused as is (the proxy
        # template URL-encodes it, #29), and the file is made private.
        - name: Store a base64 Pulsar token by hand
          ansible.builtin.copy:
            content: "Ab+cD/eF=gH+iJ/kL=mN+oP/q=="
            dest: "{{ out.path }}/legacy_pulsar_token"
            mode: '0644'

        - name: Run the token tasks on the stored base64 token
          ansible.builtin.include_tasks: ../tasks/pulsar-token.yml
          vars:
            tesp_pulsar_token_file: "{{ out.path }}/legacy_pulsar_token"

        - name: Render the Pulsar proxy with the stored base64 token
          ansible.builtin.template:
            src: "{{ templates_dir }}/tesp-api/pulsar-token-proxy.conf.j2"
            dest: "{{ out.path }}/legacy-pulsar-token-proxy.conf"
            mode: '0600'

        - name: Check the stored base64 token file
          ansible.builtin.stat:
            path: "{{ out.path }}/legacy_pulsar_token"
          register: legacy_token_file

        - name: A stored base64 token is kept, private, and reaches Pulsar intact
          ansible.builtin.assert:
            that:
              - pulsar_token == 'Ab+cD/eF=gH+iJ/kL=mN+oP/q=='
              - legacy_token_file.stat.mode == '0600'
              - query_values | length == 2
              - query_values | map('urldecode') | unique == [pulsar_token]
            fail_msg: >-
              a stored base64 token was replaced, its file stayed readable by
              others, or the proxy doesn't URL-encode it: {{ query_values }}
          vars:
            conf: "{{ lookup('file', out.path ~ '/legacy-pulsar-token-proxy.conf') }}"
            query_values: >-
              {{ conf | regex_findall('private_token=([^";]*)') }}

        - name: Store an empty Pulsar token file
          ansible.builtin.copy:
            content: ""
            dest: "{{ out.path }}/empty_pulsar_token"
            mode: '0600'

        - name: The token tasks refuse an empty token file
          block:
            - name: Run the token tasks on the empty file
              ansible.builtin.include_tasks: ../tasks/pulsar-token.yml
              vars:
                tesp_pulsar_token_file: "{{ out.path }}/empty_pulsar_token"

            - name: An empty token file must fail the run
              ansible.builtin.fail:
                msg: the token tasks accepted an empty token file
          rescue:
            - name: The failure is the token check, not the fail task above
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search('holds no usable Pulsar token')
                fail_msg: >-
                  expected the token check to refuse the empty file, got:
                  {{ ansible_failed_result.msg }}

        # The role notifies pulsar_restart_handler_name when app.yml (the
        # token) changes; its default handler never runs here.
        - name: A changed Pulsar config restarts Pulsar
          ansible.builtin.assert:
            that:
              - pulsar_restart_handler_name | default('') != ''
              - restart_handlers | length == 1
              - (restart_handlers[0]['ansible.builtin.systemd_service'] | default({})).state | default('') == 'restarted'
              - >-
                (restart_handlers[0]['ansible.builtin.systemd_service'] | default({})).name | default('')
                is search('pulsar')
            fail_msg: >-
              Pulsar would keep its old token after app.yml changes (#9):
              pulsar_restart_handler_name must name a playbook handler that
              restarts the pulsar service
          vars:
            restart_handlers: >-
              {{ plays | map(attribute='handlers', default=[]) | flatten(levels=1)
                 | selectattr('name', 'eq', pulsar_restart_handler_name | default(''))
                 | list }}

        # pulsar-proxy reads its config only when it starts, and the template
        # replaces the bind-mounted file, so a changed config must recreate
        # the container. The config's checksum, taken after the template and
        # before the compose file, is a label on the service.
        # A handler alone isn't enough: a run that stops before handlers run
        # leaves the next run with nothing to notify.
        - name: Pulsar is restarted when its config is newer than the process
          ansible.builtin.assert:
            that:
              - check_tasks | length == 1
              - restart_tasks | length == 1
              - pjson.index(check_tasks[0] | to_json) < pjson.index(restart_tasks[0] | to_json)
              - restart_tasks[0]['ansible.builtin.systemd_service'].state | default('') == 'restarted'
            fail_msg: >-
              a run that stops between the Pulsar role and its handlers would
              leave Pulsar on an old token (#9): post_tasks must compare the
              config directory with Pulsar's start time and restart it
          vars:
            pjson: "{{ plays | map(attribute='post_tasks', default=[]) | flatten(levels=1) | map('to_json') | list }}"
            # The comparison itself (pulsar-config-stale.sh.j2) is run
            # against a stub busctl in the #35 checks above.
            check_tasks: >-
              {{ pjson | select('search', 'pulsar-config-stale[.]sh[.]j2')
                 | select('search', 'register": "tesp_pulsar_config_state')
                 | map('from_json') | list }}
            restart_tasks: >-
              {{ pjson | select('search', 'tesp_pulsar_config_state.stdout')
                 | map('from_json') | list }}

        # pulsar-proxy reads its config only when it starts, and the template
        # replaces the bind-mounted file, so a changed config must recreate
        # the container: after the template, the playbook takes the checksum
        # of that same file and the compose file labels pulsar-proxy with it.
        - name: A changed proxy config recreates pulsar-proxy
          ansible.builtin.assert:
            that:
              - tpl_tasks | length == 1
              - stat_tasks | length == 1
              - fact_tasks | length == 1
              - compose_tasks | length == 1
              - >-
                fact_tasks[0]['ansible.builtin.set_fact'].tesp_pulsar_proxy_conf_checksum
                is search(stat_tasks[0].register ~ '[.]stat[.]checksum')
              - >-
                pjson.index(tpl_tasks[0] | to_json) < pjson.index(stat_tasks[0] | to_json)
                < pjson.index(fact_tasks[0] | to_json) < pjson.index(compose_tasks[0] | to_json)
              - >-
                ((files['docker-compose.yml'] | from_yaml).services['pulsar-proxy'].labels
                 | default({}))['tesp.pulsar-proxy-conf-sha256'] | default('')
                == tesp_pulsar_proxy_conf_checksum
            fail_msg: >-
              pulsar-proxy would keep serving an old config (and token) after
              pulsar-token-proxy.conf changes (#9): playbook.yml must template
              it, stat that file, set tesp_pulsar_proxy_conf_checksum from the
              stat, then template the compose file, which labels pulsar-proxy
          vars:
            pjson: "{{ plays | map(attribute='post_tasks', default=[]) | flatten(levels=1) | map('to_json') | list }}"
            tpl_tasks: >-
              {{ pjson | select('search', 'pulsar-token-proxy[.]conf[.]j2')
                 | map('from_json') | list }}
            tpl_dest: "{{ (tpl_tasks[0]['ansible.builtin.template'] | default({})).dest | default('-') }}"
            # The stat of the very file the template writes.
            stat_tasks: >-
              {{ pjson | select('search', '"ansible[.]builtin[.]stat": [{]')
                 | select('search', '"path": "' ~ (tpl_dest | regex_escape) ~ '"')
                 | map('from_json') | list }}
            fact_tasks: >-
              {{ pjson | select('search', 'set_fact": [{]"tesp_pulsar_proxy_conf_checksum"')
                 | map('from_json') | list }}
            compose_tasks: >-
              {{ pjson | select('search', 'docker-compose[.]yml[.]j2')
                 | map('from_json') | list }}

      always:
        - name: Remove output directory
          ansible.builtin.file:
            path: "{{ out.path }}"
            state: absent
