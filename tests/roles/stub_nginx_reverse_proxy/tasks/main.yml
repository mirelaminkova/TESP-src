---
# Stand-in for uusrc.general.nginx_reverse_proxy in tests/nginx-locations.yml:
# writes one file per location, as the role does, and counts its runs (the
# real role restarts nginx on every run).
- name: Write the location files
  ansible.builtin.copy:
    content: "location {{ item.location }} {}\n"
    dest: "{{ nginx_apps_location }}/{{ item.name }}.conf"
    mode: '0644'
  loop: "{{ nginx_reverse_proxy_locations }}"
  loop_control:
    label: "{{ item.name }}"

- name: Count the restarts
  ansible.builtin.shell: echo restart >> {{ nginx_apps_location | quote }}/../restarts
  changed_when: true

# A role that fails after writing its files (tests/nginx-locations.yml).
- name: Fail when asked to
  ansible.builtin.fail:
    msg: stand-in role failure
  when: (nginx_apps_location ~ '/../fail') is exists
