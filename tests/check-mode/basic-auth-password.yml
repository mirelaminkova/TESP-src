---
# Run by tests/idempotence.yml with ansible-playbook --check, not by
# tests/run.sh: the stand-in password is chosen only under a real --check.
- name: TES password tasks under --check without a stored password
  hosts: localhost
  gather_facts: false
  vars:
    # tests/idempotence.yml passes the real path with -e.
    tesp_basic_auth_password_file: /nonexistent/set-with-extra-vars
  tasks:
    - name: Get the TES password
      ansible.builtin.include_tasks: ../../tasks/basic-auth-password.yml

    - name: Check mode uses the stand-in password
      ansible.builtin.assert:
        that:
          - tesp_basic_auth_password == 'check-mode-stand-in-password-not-stored'
        fail_msg: under --check without a stored password, expected the stand-in
