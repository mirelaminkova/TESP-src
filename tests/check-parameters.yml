---
# Runs the playbook's parameter checks (tasks/check-parameters.yml): the
# defaults pass, and each invalid case is rejected by the check meant for it.
#
#   ansible-playbook -i localhost, -c local tests/check-parameters.yml
#
# Each rejected case prints a red "fatal" line and counts as "rescued": that
# is the expected outcome. The play fails only if a case is accepted or
# rejected by another check.
- name: Check the parameter checks
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    workspace_fqdn: tesp.example.src.surf-hosted.nl
    tesp_deploy_time: '2026-11-18T09:30:00Z'
    # Issue #25: service info the ELIXIR Cloud Registry would refuse.
    service_info_cases:
      - why: an unknown environment
        expect: Invalid service info
        vars: {src_tes_environment: production}
      # The ELIXIR Cloud Registry's rules allow only these two.
      - why: environment dev
        expect: Invalid service info
        vars: {src_tes_environment: dev}
      - why: environment staging
        expect: Invalid service info
        vars: {src_tes_environment: staging}
      - why: no workspace_fqdn (the id would be localhost.tes)
        expect: Invalid service info
        vars: {workspace_fqdn: ''}
      - why: workspace_fqdn localhost
        expect: Invalid service info
        vars: {workspace_fqdn: localhost}
      - why: workspace_fqdn with a trailing dot
        expect: Invalid service info
        vars: {workspace_fqdn: tesp.example.src.surf-hosted.nl.}
      - why: workspace_fqdn that is an IP address
        expect: Invalid service info
        vars: {workspace_fqdn: 127.0.0.1}
      - why: an http organization URL
        expect: Invalid service info
        vars: {src_tes_organization_url: 'http://www.surf.nl/'}
      - why: a service name without a letter or digit
        expect: Invalid service info
        vars: {src_tes_service_name: ' - '}
      - why: an organization name that is only a dash
        expect: Invalid service info
        vars: {src_tes_organization_name: ' -'}
      - why: an id with a space
        expect: Invalid service info
        vars: {tesp_service_info_id: 'my service'}
      - why: a contact URL that is neither https nor mailto
        expect: Invalid service info
        vars: {src_tes_contact_url: 'ftp://example.org'}
      - why: an http documentation URL
        expect: Invalid service info
        vars: {tesp_service_info_documentation_url: 'http://example.org/docs'}
      - why: a timestamp that is not RFC 3339 UTC
        expect: Invalid service info
        vars: {tesp_service_info_created_at: '18-11-2026'}
      - why: an updatedAt that is not RFC 3339 UTC
        expect: Invalid service info
        vars: {tesp_service_info_updated_at: '2026-11-18 09:30'}
      - why: an organization URL with a bad host
        expect: Invalid service info
        vars: {src_tes_organization_url: 'https://-/'}
    # Issue #26. A valid issuer, varied by the cases below.
    valid_issuer:
      issuer: https://login.example.org/oidc/
      allowed_client_ids: [portal, cli, service]
      exempt_client_ids: [service]
      audiences: [tes.example.org]
      entitlements: {any_of: ['urn:example:group:ECP_CLN#example.org']}
    valid_issuers: ["{{ valid_issuer }}"]
    oauth_cases:
      - why: both Basic and tokens switched off
        expect: Invalid access settings
        vars: {tesp_basic_auth_enabled: false, tesp_oauth_enabled: false}
      - why: src_tes_oauth_enabled that is not a boolean
        expect: Invalid access settings
        vars: {src_tes_oauth_enabled: maybe}
      - why: a Basic source that is a host name
        expect: Invalid access settings
        vars: {src_tes_basic_auth_sources: 'nextflow.example.org'}
      - why: Basic sources with a space (as SRC would split them)
        expect: Invalid access settings
        vars: {src_tes_basic_auth_sources: '10.0.0.1 10.0.0.2'}
      - why: an exempt client without audiences
        expect: Invalid token issuer
        vars:
          tesp_oauth_enabled: true
          tesp_oauth_issuers:
            - "{{ valid_issuer | combine({'audiences': []}) }}"
      - why: audit tag keys given as a string
        expect: Invalid token settings
        vars: {tesp_oauth_enabled: true, tesp_oauth_audit_tag_keys: user_sub}
      - why: a relative CA bundle path
        expect: Invalid token settings
        vars: {tesp_oauth_enabled: true, tesp_oauth_ca_bundle: certs/ca.pem}
      - why: tokens on without issuers
        expect: Invalid token issuers
        vars: {tesp_oauth_enabled: true, tesp_oauth_issuers: []}
      - why: the same issuer twice
        expect: Invalid token issuers
        vars:
          tesp_oauth_enabled: true
          tesp_oauth_issuers: ["{{ valid_issuer }}", "{{ valid_issuer }}"]
      - why: the default LS Login entry without client ids
        expect: Invalid token issuer https://login.aai.lifescience-ri.eu/oidc/
        vars:
          tesp_oauth_enabled: true
          tesp_oauth_issuers: "{{ default_issuers }}"
      - why: an http issuer
        expect: Invalid token issuer http://
        vars:
          tesp_oauth_enabled: true
          tesp_oauth_issuers:
            - "{{ valid_issuer | combine({'issuer': 'http://login.example.org/oidc/'}) }}"
      - why: an exempt client that is not allowed
        expect: Invalid token issuer
        vars:
          tesp_oauth_enabled: true
          tesp_oauth_issuers:
            - "{{ valid_issuer | combine({'exempt_client_ids': ['other']}) }}"
      - why: a symmetric algorithm
        expect: Invalid token issuer
        vars:
          tesp_oauth_enabled: true
          tesp_oauth_issuers:
            - "{{ valid_issuer | combine({'algorithms': ['RS256', 'HS256']}) }}"
      - why: no entitlements
        expect: Invalid token issuer
        vars:
          tesp_oauth_enabled: true
          tesp_oauth_issuers:
            - "{{ valid_issuer | combine({'entitlements': {'any_of': []}}) }}"
      - why: an entitlement prefix without a boundary
        expect: Invalid token issuer
        vars:
          tesp_oauth_enabled: true
          tesp_oauth_issuers:
            - "{{ valid_issuer | combine({'entitlements': {'prefix_any_of': ['urn:x:ECP_CLN']}}) }}"
      - why: an unknown key (a typo)
        expect: Invalid token issuer
        vars:
          tesp_oauth_enabled: true
          tesp_oauth_issuers:
            - "{{ valid_issuer | combine({'alowed_client_ids': ['x']}) }}"
      - why: an http JWKS URL
        expect: Invalid token issuer
        vars:
          tesp_oauth_enabled: true
          tesp_oauth_issuers:
            - "{{ valid_issuer | combine({'jwks_uri': 'http://login.example.org/jwk'}) }}"
      - why: client ids given as a string
        expect: Invalid token issuer
        vars:
          tesp_oauth_enabled: true
          tesp_oauth_issuers:
            - "{{ valid_issuer | combine({'allowed_client_ids': 'portal'}) }}"
    # Krini calls the TES from the browser: exact https origins only.
    cors_cases:
      - why: a CORS wildcard
        expect: Invalid CORS origins
        vars: {src_tes_cors_origins: '*'}
      - why: an http CORS origin
        expect: Invalid CORS origins
        vars: {src_tes_cors_origins: 'http://krini.example.org'}
      - why: a CORS origin with a path
        expect: Invalid CORS origins
        vars: {src_tes_cors_origins: 'https://krini.example.org/app'}
      - why: a CORS origin with a trailing slash
        expect: Invalid CORS origins
        vars: {src_tes_cors_origins: 'https://krini.example.org/'}
      - why: CORS origins with a space
        expect: Invalid CORS origins
        vars: {src_tes_cors_origins: 'https://a.example.org https://b.example.org'}
    other_cases:
      - why: an S3 endpoint without a scheme
        expect: Invalid S3 component parameters
        vars: {src_s3_endpoint_url: s3.example.org}
      - why: a negative task runtime cap
        expect: tesp_max_wait_seconds must be
        vars: {tesp_max_wait_seconds: -1}
  tasks:
    - name: Keep the default issuer list for a case
      ansible.builtin.set_fact:
        default_issuers: "{{ tesp_oauth_issuers }}"

    - name: The defaults pass
      ansible.builtin.include_tasks: ../tasks/check-parameters.yml

    - name: SRC component parameters reach the service info
      ansible.builtin.assert:
        that:
          - tesp_service_info_name == 'Demo TES'
          - tesp_service_info_organization_name == 'ELIXIR-NL'
          - tesp_service_info_organization_url == src_tes_organization_url
          - tesp_service_info_environment == 'prod'
          - tesp_service_info_contact_url == 'mailto:support@example.org'
          - tesp_service_info_id == 'nl.surf-hosted.src.example.tesp.tes'
      vars:
        src_tes_service_name: ' Demo TES '
        src_tes_organization_name: ELIXIR-NL
        src_tes_organization_url: https://elixir-europe.org/about-us/who-we-are/nodes/netherlands
        src_tes_environment: prod
        src_tes_contact_url: mailto:support@example.org

    - name: Blank parameters fall back to the defaults
      ansible.builtin.assert:
        that:
          - tesp_service_info_name == 'TESP on SURF Research Cloud'
          - tesp_service_info_organization_name == 'SURF'
          - tesp_service_info_environment == 'test'
      vars:
        src_tes_service_name: '  '
        src_tes_organization_name: ''
        src_tes_environment: ' '

    - name: Those parameters pass the checks
      ansible.builtin.include_tasks: ../tasks/check-parameters.yml
      vars:
        src_tes_organization_url: https://elixir-europe.org/about-us/who-we-are/nodes/netherlands
        src_tes_environment: prod
        src_tes_contact_url: mailto:support@example.org

    - name: Token settings from SRC component parameters
      ansible.builtin.assert:
        that:
          - tesp_oauth_enabled is true
          - tesp_basic_auth_enabled is true
          - tesp_basic_auth_sources == ['145.38.1.2', '10.0.0.0/8']
          - tesp_oauth_issuers | length == 1
          - issuer.issuer == 'https://login.aai.lifescience-ri.eu/oidc/'
          - issuer.allowed_client_ids == ['portal', 'cli', 'service']
          - issuer.exempt_client_ids == ['service']
          - issuer.audiences == ['tes.example.org']
          - issuer.entitlements.any_of == ['urn:a', 'urn:b']
          - issuer.entitlements.prefix_any_of == ['urn:a:']
      vars:
        src_tes_oauth_enabled: 'True'
        src_tes_basic_auth_sources: '145.38.1.2,10.0.0.0/8'
        src_tes_oauth_client_ids: ' portal, cli,service ,'
        src_tes_oauth_exempt_client_ids: service
        src_tes_oauth_audiences: tes.example.org
        src_tes_oauth_entitlements: 'urn:a,urn:b'
        src_tes_oauth_entitlement_prefixes: 'urn:a:'
        issuer: "{{ tesp_oauth_issuers[0] }}"

    - name: Those token settings pass the checks
      ansible.builtin.include_tasks: ../tasks/check-parameters.yml
      vars:
        src_tes_oauth_enabled: 'true'
        src_tes_oauth_client_ids: portal,cli,service
        src_tes_oauth_exempt_client_ids: service
        src_tes_oauth_audiences: tes.example.org
        src_tes_oauth_entitlement_prefixes: 'urn:a:'
        src_tes_basic_auth_sources: '145.38.1.2,2001:610:108::/48'

    # Issue #26 audit: the registered workspace takes tokens only.
    - name: With tokens on and no Basic sources, Basic is off; defaults apply
      ansible.builtin.assert:
        that:
          - tesp_basic_auth_enabled is false
          - tesp_oauth_issuers[0].exempt_client_ids == []
          - tesp_oauth_issuers[0].entitlements.any_of == tesp_oauth_default_entitlements
          - tesp_oauth_default_entitlements is not search('ECP_CLN#')
      vars:
        src_tes_oauth_enabled: 'true'
        src_tes_oauth_client_ids: portal

    - name: CORS origins from the component parameter pass the checks
      ansible.builtin.include_tasks: ../tasks/check-parameters.yml
      vars:
        src_tes_cors_origins: https://krini.rahtiapp.fi,https://krini.example.org:8443

    - name: CORS origins are parsed
      ansible.builtin.assert:
        that:
          - tesp_cors_origins == ['https://krini.rahtiapp.fi', 'https://krini.example.org:8443']
      vars:
        src_tes_cors_origins: https://krini.rahtiapp.fi,https://krini.example.org:8443

    - name: With tokens off, Basic is on from anywhere
      ansible.builtin.assert:
        that:
          - tesp_basic_auth_enabled is true
          - tesp_basic_auth_sources == []

    - name: An issuer without entitlements passes when they are switched off
      ansible.builtin.include_tasks: ../tasks/check-parameters.yml
      vars:
        tesp_oauth_enabled: true
        tesp_oauth_issuers:
          - "{{ valid_issuer | combine({'entitlements': {},
                                       'require_entitlement': false}) }}"

    - name: Each invalid case is rejected by its check
      ansible.builtin.include_tasks: include/expect-invalid.yml
      loop: "{{ service_info_cases + oauth_cases + cors_cases + other_cases }}"
      loop_control:
        loop_var: case
        label: "{{ case.why }}"
